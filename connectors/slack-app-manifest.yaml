# Slack app manifest for the one company Slack app.
# Create at https://api.slack.com/apps > Create New App > From an app manifest, paste this,
# install to your company's workspace, then copy the Bot User OAuth Token. See connectors/README.md.
#
# These are exactly the scopes connectors/slack.py and backend/slack_gateway.py use:
#   channels:history      read public channel messages and threads  (history, gateway channel readers)
#   channels:read         list public channels                      (channels, doctor, resolve #name)
#   channels:join         join a public channel                     (join)
#   groups:history        read private channel messages and threads (history, gateway channel readers)
#   groups:read           list private channels the bot is in       (channels, doctor)
#   chat:write            post a message in a channel or DM         (post, dm, gateway replies)
#   chat:write.customize  post a reply under a bot's own name/icon  (gateway replies, "sent from <bot>")
#   users:read            resolve user ids to display names         (history, gateway sender check)
#   users:read.email      find a person by work email                (dm --to someone@acme.example, gateway sender check)
#   im:write              open a direct message with a person       (dm)
#   im:history            read DMs people send to the bot           (inbox, gateway message.im)
#   im:read               list the bot's DM conversations           (inbox, doctor)
#   mpim:write            open a group DM                           (dm with several people)
#   mpim:history          read group DMs the bot is in              (inbox)
#   mpim:read             list group DMs                            (inbox)
#   app_mentions:read     receive @Tico mentions in joined channels (gateway app_mention)
#   files:read            open files people share, e.g. screenshots (file --id, url_private)
#   files:write           upload an image a bot made, e.g. a chart  (upload)
# Events arrive over Socket Mode (an outbound websocket held by tico-slack-gateway.service on
# the server; no public receiver, no signing secret): `app_mention` in any channel the app is
# in, `message.im` for DMs to it, and `message.channels` / `message.groups` for everything
# else said in a channel it is in. A person's DM or @Tico wakes the bot the router picks
# to at once; every other channel message is stored and reaches the channel's readers
# (the channel list in Settings > Tools > Slack) on the hourly pass (docs/slack-gateway.md).
# The app-level token (connections:write) is minted under Basic Information > App-Level Tokens.

display_information:
  name: Tico
  description: "Tico: your AI COO and connection to your company's AI team."
  background_color: "#1f2933"
  long_description: >-
    Tico is your AI COO and the single Slack app for your company's bots. DM it, or
    @Tico in a channel it has been invited to, and the message reaches the bot it is for; the reply
    comes back in the same thread under that employee's name. Bots also call the hub's connectors/slack.py to
    read channel history (including threads) and, for the channels an owner or admin lists in Tico,
    to post an update. Every post is recorded in the company's audit log with
    the employee that made it.

features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Tico
    always_online: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - channels:join
      - groups:history
      - groups:read
      - chat:write
      - chat:write.customize
      - users:read
      - users:read.email
      - im:write
      - im:history
      - im:read
      - mpim:write
      - mpim:history
      - mpim:read
      - app_mentions:read
      - files:read
      - files:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  interactivity:
    is_enabled: false
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
