# Where facts about a market come from, and how far to trust each (backend/market_spend.py).
# The Librarian reads this before it sizes a market (`hub market sources`) and cites a catalog id or a URL for every
# figure. No source is trusted alone: size each segment by two methods. A team adds its own with `hub market sources
# --add-file`; a team entry with the same id replaces the one here.
#
# covers:      sizing, players, buyers, pricing, signals, value_chain
# access:      free (public), team_key (the team brings a login or key), gateway (a Gateway feed, not built yet)
# reliability: primary (the source holds the data), secondary (someone else's count), estimate (modelled; spreads of
#              3-10x are normal), signal (what people say, never a size)

- id: ramp-ai-index
  name: Ramp AI Index
  kind: Card spend
  covers: [buyers, sizing]
  access: free
  reliability: primary
  how: What small businesses actually pay for AI tools, by vendor. The first source to try for buyers.
  url: https://ramp.com
- id: brex
  name: Brex
  kind: Card spend
  covers: [buyers, sizing]
  access: free
  reliability: primary
  how: What small businesses actually pay, by vendor. A paid feed is a Gateway candidate.
  url: https://www.brex.com
- id: mercury
  name: Mercury
  kind: Card spend
  covers: [buyers, sizing]
  access: free
