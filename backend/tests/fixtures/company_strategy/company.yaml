strategy:
  summary: "Win field crews at mid-size builders with the fastest schedule on a phone."
  vision: "Every crew on a mid-size job site knows tomorrow's plan before they leave tonight."
  sections:
    serve: "Superintendents and foremen at general contractors with 50 to 500 staff."
    sell: "A phone-first schedule app at $40 per user per month; pricing isn't on the site yet."
    know: "Supers already text photos all day. We turn those photos into the schedule."
    not: "No desktop reporting suite, no enterprise security reviews this year."
  bets:
    - id: b1
      statement: "Win the superintendent's phone"
      why: "Supers decide what the crew opens every morning."
      rules_out: "Deep desktop reporting"
      wrong_if: "Fewer than 3 in 10 supers open it daily after 60 days"
      check_by: 2027-01-23
    - id: b2
      statement: "Mid-size before enterprise"
      why: "Mid-size builders buy in weeks, not quarters."
      rules_out: "Long security reviews"
      wrong_if: "Mid-size sales cycles run past 45 days"
      check_by: 2027-01-23
    - id: b3
      statement: "Photos are the input"
      why: "Crews won't type; they already take photos."
      rules_out: "Form-heavy daily logs"
      wrong_if: "Under half of schedule updates come from photos"
      check_by: ""
  market:
    definition:
      root: "Construction management software"
      in: "Scheduling, field and project tools for builders"
      out: "Design and CAD tools"
      year: 2026
    segments:
      - key: gc-suites
        name: "GC suites"
        parent: null
