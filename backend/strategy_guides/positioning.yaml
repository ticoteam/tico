# Positioning (Dunford, Obviously Awesome): what a buyer would use instead, what you have that they do not,
# the value that creates, who cares most about it, and the market category that makes it all make sense.
# Not listed until the page can switch guides (docs/strategy.md); the stored shape is the same for every guide.
id: positioning
name: Positioning
description: 'In the style of Dunford''s positioning: alternatives, unique attributes, value, best-fit customers, category.'
listed: false
bets_label: Positions
bet_label: Position
questions:
  - key: q1
    ask: When a prospect does not buy from you, what do they do instead? Give the three most common answers, including doing nothing.
  - key: q2
    ask: What can you do that none of those alternatives can? Name only what is true today.
  - key: q3
    ask: For your best customers, what did that let them achieve or avoid, in their own words?
  - key: q4
    ask: 'Describe the customer who gets the most value from you: size, situation, and the moment they started looking.'
  - key: q5
    ask: When you say what market you are in, do prospects nod or do you have to explain? What category would make them nod?
  - key: q6
    ask: Which customers are you attracting today that you would rather not, and what in your positioning draws them in?
  - key: q7
    ask: What is changing in the market that makes your position matter more in two years than it does today?
suggested_sections:
  - key: alternatives
    title: Competitive alternatives
    prompt: 'What a buyer would do if you did not exist: the named competitors, the spreadsheet, the intern, doing nothing. Be honest about how often the answer is doing nothing.'
  - key: attributes
    title: Unique attributes
    prompt: The features, capabilities and facts about the team that the alternatives lack. Only what is true today, not the roadmap.
  - key: value
    title: Value
    prompt: What those attributes let a buyer do or stop doing, in their words and with their numbers where you have them. Attributes are yours; value is theirs.
  - key: customers
    title: Who cares most
    prompt: 'The buyers who feel that value most sharply: their size, their situation, the trigger that makes them look. The best-fit customer, not the widest one.'
  - key: category
    title: Market category
    prompt: The market you say you are in, so a buyer knows at once what you are and what to compare you to, and the trend that makes your position matter now.
