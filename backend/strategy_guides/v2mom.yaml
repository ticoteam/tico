# V2MOM (Salesforce): vision, values, methods, obstacles, measures. The first V is the vision field every
# strategy has, so it is not a section here; the methods are the bets list.
# Not listed until the page can switch guides (docs/strategy.md); the stored shape is the same for every guide.
id: v2mom
name: V2MOM
description: 'In the style of V2MOM: vision, values, methods, obstacles and measures.'
listed: false
bets_label: Methods
bet_label: Method
questions:
  - key: q1
    ask: What does the team look like when the vision is reached, in a way an outsider could check?
  - key: q2
    ask: When two good options conflict, which value wins, and can you remember the last time it cost you something?
  - key: q3
    ask: What are the three to five things the team will actually do this year to reach the vision, in order?
  - key: q4
    ask: For your first method, what is most likely to stop it, and what are you doing about that?
  - key: q5
    ask: Which method has no number attached, and what would the number be?
  - key: q6
    ask: Which method is there because a person wants it rather than because the vision needs it?
  - key: q7
    ask: What are you no longer doing because it did not make the list?
suggested_sections:
  - key: values
    title: Values
    prompt: The three to five principles that decide between two good options when they conflict, in order of priority. A value nobody has ever had to choose against is decoration.
  - key: methods
    title: Methods
    prompt: The handful of things the team will do to reach the vision, in priority order. Each one is a record under the Methods label; this is the paragraph that explains why these and in this order.
  - key: obstacles
    title: Obstacles
    prompt: 'What stands in the way of each method: a missing skill, a competitor, a dependency, a budget, a regulation. Name the obstacle, not the worry.'
  - key: measures
    title: Measures
    prompt: For each method, the number and date that says it is done or working. Measures belong to methods, not to the vision.
