# The default guide: what the Strategy Bot asks while it drafts a strategy with the owner
# (backend/strategy.py `guides`).
# A guide changes the questions and the word for bets, never the stored shape: every strategy has the summary, the
# vision, the bets and the seven sections (serve, sell, proof, now, know, how, not), plus any extra section the owner
# adds.
#
# Each question is one idea. `claim` is what the Strategy Bot fills in from what it already knows (the website, the
# market graph, the Growth numbers, what customers said, earlier answers) and puts to the owner to keep, edit or
# strike; `ask` is the open question it falls back on when it knows nothing yet. `section` is where the answer lands;
# `bets` means it becomes a bet. A claim's blanks are filled only from a source or the owner: never a made-up number.
id: default
name: Default
description: >-
  Short, founder-native questions in the style of the YC application and a16z's go-to-market writing: what you make,
  who needs it and how badly, how you know they want it, why now, why you, and where the next hundred customers come
  from. Each one is a claim to keep, edit or strike, so a first draft takes minutes, not a workshop.
listed: true
bets_label: Bets
bet_label: Bet
questions:
  - key: make
    section: sell
    ask: What do you make, and who needs it badly enough to use a rough version today?
    claim: "You make {product} for {customer}, who need it badly enough to put up with an early version."
  - key: acute
    section: serve
    ask: How bad is the problem today, and what do people use instead of you?
    claim: "Without you, {customer} {workaround}, and that costs them {pain}."
  - key: wedge
    section: serve
    ask: What is the narrow way in, the first customer and use you win before anything else?
    claim: "You get in through {wedge}: {first_customer} first, the rest of the market after."
  - key: proof
    section: proof
    ask: How do you know people want it? Who uses it now, how often, do they come back, and what do they say?
    claim: "{users} use it {how_often}, {retention} come back, and one said: \"{quote}\"."
  - key: now
    section: now
    ask: Why now? What changed recently that makes this possible, or needed, today?
    claim: "This works now because {change}; a few years ago {what_stopped_it}."
  - key: why-you
    section: know
    ask: Why are you the ones to build this? What have you seen or done that others haven't?
    claim: "You're the team for this because you {seen_or_done}."
  - key: know
    section: know
    ask: What do you understand about this business that the obvious competitors don't?
    claim: "You know something the obvious competitors miss: {insight}."
  - key: fear
    section: know
    ask: Who do you fear most, and what stops a bigger company copying you next quarter?
    claim: "{competitor} is the one to fear, and they can't copy you quickly because {moat}."
  - key: money
    section: sell
    ask: How do you make money, how much per customer, and what breaks if you double the price?
    claim: "You charge {price} per {unit}, a customer is worth {value} a year, and doubling the price would lose {who}."
  - key: next-100
    section: how
    ask: Where do your next 100 customers come from? Name the channel, or the people.
    claim: "Your next 100 customers come from {channel}, starting with {first_ones}."
  - key: contrarian
    section: bets
    ask: What are you betting on that most people in your market would call wrong?
    claim: "Your bet that most people would call wrong: {bet}. You'd know it's wrong if {signal}."
  - key: wont
    section: not
    ask: What won't you do, even when a good customer asks or it would bring money this quarter?
    claim: "You won't {refusal}, even when a good customer asks or it would pay this quarter."
suggested_sections:
  - key: brand
    title: Brand and voice
    prompt: What the team sounds like and stands for in every message, and the words it never uses.
  - key: channels
    title: Channels
    prompt: Where your last ten customers came from, and the one channel you are betting on next.
