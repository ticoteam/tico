        message_id: 0c4e7a19-9400-4000-8000-000000000001
        approves: [5b2e7d10-9400-4000-8000-000000000001, 5b2e7d10-9400-4000-8000-000000000002, 5b2e7d10-9400-4000-8000-000000000003, 5b2e7d10-9400-4000-8000-000000000004, 5b2e7d10-9400-4000-8000-000000000005, 5b2e7d10-9400-4000-8000-000000000006, 5b2e7d10-9400-4000-8000-000000000007, 5b2e7d10-9400-4000-8000-000000000008, 5b2e7d10-9400-4000-8000-000000000009, 5b2e7d10-9400-4000-8000-000000000010, 5b2e7d10-9400-4000-8000-000000000011, 5b2e7d10-9400-4000-8000-000000000012, 5b2e7d10-9400-4000-8000-000000000013, 5b2e7d10-9400-4000-8000-000000000014, 5b2e7d10-9400-4000-8000-000000000015, 5b2e7d10-9400-4000-8000-000000000016, 5b2e7d10-9400-4000-8000-000000000017, 5b2e7d10-9400-4000-8000-000000000018, 5b2e7d10-9400-4000-8000-000000000019, 5b2e7d10-9400-4000-8000-000000000020, 5b2e7d10-9400-4000-8000-000000000021, 5b2e7d10-9400-4000-8000-000000000022, 5b2e7d10-9400-4000-8000-000000000023]
