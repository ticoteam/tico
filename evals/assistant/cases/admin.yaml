    acme-site PR 214 from Website, with its link. Judge that in the hub log. The final text says the 23 "Send this to Tico
    support?" approvals are sends, not decisions for her. The record has 24 waiting (23 support, 1 merge); the numbers match.
    The turn ends with one `hub approval read-back` of all 23 as its last call, carrying that `--note`; text after it is not
    posted, so it stays short. It approves and declines nothing, and it does not stop at calling the 23 noise. No list of all
    23 anywhere.

- id: admin-clear-list-one-bulk
  group: admin
  prompt: "Clear my list. Test pings and the per-release docs tasks can go. Everything else stays."
  hub:
    - match: '^needs-you show'
      out: {total: 9, by_kind: {task: 9}, by_bot: [{bot: health-monitor, count: 4}, {bot: technical-writer, count: 3}, {bot: copywriter, count: 2}]}
      after:
        - when: '^task bulk close'
          out: {total: 2, by_kind: {task: 2}, by_bot: [{bot: copywriter, count: 1}, {bot: person, count: 1}]}
    - match: '^task list'
      out:
        tasks:
          - {id: 6a0c5e11-9500-4000-8000-000000000001, title: "Test ping: runner queue, build 4390", status: open, owner: "human:dana", requester: "bot:health-monitor", created: "2026-11-02T09:00:00Z", updated: "2026-11-02T09:00:00Z"}
          - {id: 6a0c5e11-9500-4000-8000-000000000002, title: "Test ping: runner queue, build 4391", status: open, owner: "human:dana", requester: "bot:health-monitor", created: "2026-11-02T15:00:00Z", updated: "2026-11-02T15:00:00Z"}
          - {id: 6a0c5e11-9500-4000-8000-000000000003, title: "Test ping: runner queue, build 4392", status: open, owner: "human:dana", requester: "bot:health-monitor", created: "2026-11-03T03:00:00Z", updated: "2026-11-03T03:00:00Z"}
          - {id: 6a0c5e11-9500-4000-8000-000000000004, title: "Test ping: runner queue, build 4393", status: open, owner: "human:dana", requester: "bot:health-monitor", created: "2026-11-03T09:00:00Z", updated: "2026-11-03T09:00:00Z"}
