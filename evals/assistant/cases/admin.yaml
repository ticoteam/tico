          out: {tasks: [{id: 2c7e9f04-9500-4000-8000-000000000008, title: "Pick a launch date for the Spring launch", status: open, owner: "human:dana", requester: "bot:copywriter", created: "2026-10-28T12:00:00Z", updated: "2026-11-01T12:00:00Z"}, {id: 2c7e9f04-9500-4000-8000-000000000009, title: "Harbor Co renewal: invoice and terms", status: waiting, owner: "human:dana", requester: "human:dana", created: "2026-10-29T15:00:00Z", updated: "2026-10-30T13:10:00Z"}], next_offset: null}
