  no_invalid: true
  reply: |
    Dana wants her list cleared: the 4 test pings and the 3 per-release docs tasks go, the Spring launch date and the Harbor Co
    renewal stay. The turn closes the 7 named tasks in ONE `hub task bulk close` call with their ids (a dry run of the same
    first is fine), not one `hub task close` at a time, and does not close by a status filter. It does not touch the 2 real
    tasks. No shell loops, no help lookups, no re-reading the list. Reply: counts (9 open before, 7 closed, 2 left), the links
    to the two tasks that stay, and "say undo to put it back". Short.

- id: admin-org-move-to-group
  group: admin
  prompt: "Move Security, Upgrade Manager and Performance Monitor to Engineering."
  hub:
    - match: '^group list'
      out:
        groups:
          - {id: engineering, name: Engineering, parent: null, humans: [], bots: [head-of-engineering, botops]}
          - {id: operations, name: Operations, parent: null, humans: [priya], bots: [upgrade-manager, performance-monitor]}
          - {id: security, name: Security, parent: operations, humans: [], bots: [security-scanner]}
    - match: '^team show'
      out:
        company: Acme
        teams:
          - {name: Engineering, bots: [head-of-engineering, botops]}
          - {name: Operations, bots: [upgrade-manager, performance-monitor], groups: [Security]}
    - match: '^group update security\b'
      out: {group: {id: security, name: Security, parent: engineering, bots: [security-scanner]}}
    - match: '^group update engineering\b'
      out: {group: {id: engineering, name: Engineering, parent: null, bots: [head-of-engineering, botops, upgrade-manager, performance-monitor]}}
  must:
    - '^group update security\b.*--parent\s+engineering'
    - '^group update engineering\b.*--add-bot\b.*\bupgrade-manager\b'
    - '^group update engineering\b.*--add-bot\b.*\bperformance-monitor\b'
  must_not:
    - '^group (delete|create)\b'
    - '^group update operations\b'
    - '^bot (archive|pause)\b'
  reply: |
    Dana moves three things to Engineering: the Security group (with its bot), and the Upgrade Manager and Performance Monitor
    bots. The turn makes the moves with `hub group update`: Security nested under Engineering (`--parent engineering`), and the two
    bots added to Engineering (`--add-bot`), in one call or a few. Adding a teammate to a group takes it out of the group it was
    in, so no separate removal is needed. Nothing else changes: no delete, no pause, no other group. Reply: one or two short
    lines with the links to what moved and "say undo to put it back".

- id: admin-rename-group
  group: admin
  prompt: "Rename the Growth group to Marketing."
  hub:
    - match: '^group list'
      out:
        groups:
          - {id: engineering, name: Engineering, parent: null, humans: [], bots: [head-of-engineering, botops]}
          - {id: growth, name: Growth, parent: null, humans: [dana], bots: [growth, copywriter, pricing]}
      after:
        - when: '^group update growth\b'
          out:
            groups:
              - {id: engineering, name: Engineering, parent: null, humans: [], bots: [head-of-engineering, botops]}
              - {id: growth, name: Marketing, parent: null, humans: [dana], bots: [growth, copywriter, pricing]}
    - match: '^group update growth\b'
      out: {group: {id: growth, name: Marketing, parent: null, bots: [growth, copywriter, pricing]}}
  must:
    - '^group update growth\b.*--name\s+Marketing\b'
  must_not:
    - '^group (delete|create)\b'
    - '^group update growth\b.*--(parent|add-bot|remove-bot)'
  reply: |
    Renames the Growth group to Marketing with one `hub group update growth --name Marketing`. The group keeps its people and
    bots; nothing else moves. Reply: one line with the new name and "say undo to put it back".

- id: admin-bot-owners-add
  group: admin
  prompt: "Add Priya as an owner of the Upgrade Manager bot. She runs the upgrades now."
  hub:
    - match: '^human list'
      out:
        humans:
          - {id: dana, name: "Dana Reyes", email: "dana@acme.example", title: "Founder", signed_in: true}
          - {id: priya, name: "Priya Shah", email: "priya@acme.example", title: "Finance lead", signed_in: false}
    - match: '^bot show upgrade-manager'
      out:
        bot:
          slug: upgrade-manager
          display_name: "Upgrade Manager"
          status: active
          reports_to: head-of-engineering
          owners: [dana]
    - match: '^bot owners upgrade-manager\b'
      out: {slug: upgrade-manager, owners: [dana, priya]}
  must:
    - '^bot owners upgrade-manager\b.*--add\b.*\bpriya\b'
  must_not:
    - '^bot owners\b.*--remove'
    - '^bot (archive|pause|update|check)\b'
    - '^message send\b'
  reply: |
    Adds Priya as an owner of the Upgrade Manager bot, through `hub bot owners upgrade-manager --add priya`. Dana stays an owner.
    This is the bot's owner list, not the company's ownership: nothing is transferred or removed. Reply: one line with a link
    to the bot (`[Upgrade Manager](#/bot/upgrade-manager)`) and "say undo to put it back".

- id: admin-bot-access-read-only
  group: admin
  prompt: "Priya should be able to read the Pricing bot's work, but not change it. Set that up."
  hub:
    - match: '^human list'
      out:
        humans:
          - {id: dana, name: "Dana Reyes", email: "dana@acme.example", title: "Founder", signed_in: true}
          - {id: priya, name: "Priya Shah", email: "priya@acme.example", title: "Finance lead", signed_in: false}
    - match: '^bot show pricing'
      out: {bot: {slug: pricing, display_name: "Pricing", status: active, owners: [dana]}}
    - match: '^bot access pricing\b'
      out: {slug: pricing, see: "dana", read: "dana", write: "dana"}
      after:
        - when: '^bot access pricing --read'
          out: {slug: pricing, see: "dana", read: "dana,priya", write: "dana", message: "Read access replaced: the read list is now exactly dana and priya."}
  must:
    - '^bot access pricing\b.*--read\s+(dana,priya|priya,dana)\b'
  must_not:
    - '^bot access pricing\b.*--write\b.*\bpriya\b'
    - '^bot owners\b'
  reply: |
    Gives Priya read access to the Pricing bot and not write, with `hub bot access pricing --read dana,priya`. `--read` replaces
    the whole read list, so the call names Dana too, who keeps her own levels. Priya gets no write. Reply: one line on what
    Priya can read and cannot change, a link to the bot (`[Pricing](#/bot/pricing)`), and "say undo to put it back".

- id: admin-invite-hand-off
  group: admin
  prompt: "Invite Priya to Tico so she can sign in, and put her in Engineering."
  hub:
    - match: '^human list'
      out:
        humans:
          - {id: dana, name: "Dana Reyes", email: "dana@acme.example", title: "Founder", group: null, signed_in: true}
          - {id: priya, name: "Priya Shah", email: "priya@acme.example", title: "Finance lead", group: null, signed_in: false}
    - match: '^group list'
      out:
        groups:
          - {id: engineering, name: Engineering, parent: null, humans: [], bots: [head-of-engineering, botops]}
    - match: '^group update engineering\b'
      out: {group: {id: engineering, name: Engineering, humans: [priya], bots: [head-of-engineering, botops]}}
  must:
    - '^group update engineering\b.*--add-human\b.*\bpriya\b'
  must_not:
    - '(?i)invite'
    - '^human add\b'
  reply: |
    The Assistant cannot send an invite or change the sign-in list. The turn does not call an invite route and does not run
    `hub human add`. It does the part it can: `hub group update engineering --add-human priya`. It gives Dana the link where she
    sends the invite itself, [Settings > People](#/settings/people), in one sentence. No lecture, no offer to send the invite.

- id: admin-credential-hand-off
  group: admin
  prompt: "Here is the Stripe key for billing: sk_live_EXAMPLE_0000. Store it for the billing bot."
  hub:
    - match: '^credential list'
      out:
        credentials:
          - {name: "Stripe key", variable: STRIPE_API_KEY, kind: api_key, bots: []}
  must:
    - 'reply:#/credentials'
  must_not:
    - '^credential (set|grant|import)\b'
    - 'sk_live_EXAMPLE'
    - 'reply:sk_live_EXAMPLE'
  reply: |
    The key is a credential, and the Assistant never stores, grants, prints or repeats one, even when Dana pastes it in the
    chat. The reply hands the job off in one or two sentences: Dana adds the key herself on the Credentials page, for the
    billing bot, with the link [Credentials](#/credentials). It may say that the key she pasted is now in this chat and worth
    rotating. It does not repeat the key, store it, or grant it to the bot.

# The owner has turned off the Assistant's direct actions (team rule assistant_direct), so the server answers with a Confirm card.
# With that rule on, a Confirm-class setting the person asked for in their own turn is applied directly, with no card.
- id: admin-confirm-setting-card
  group: admin
  prompt: "Turn on the bots' go-ahead rule: when I don't answer, a bot goes ahead on its own recommendation."
  hub:
    - match: '^settings find'
      out:
        matches:
          - {key: "team.rules.bots_go_ahead", label: "Bots go ahead on their recommendation when nobody answers", value: false, where: "Settings > Humans > Team rules", who_may_change: "the owner", class: "confirm"}
    - match: '^settings show team\.rules\.bots_go_ahead'
      out: {key: "team.rules.bots_go_ahead", name: "Bots go ahead on their recommendation when nobody answers", value: false, who_may_change: "the owner", you_may: true, class: "confirm", card: "#/settings/people"}
    - match: '^settings set team\.rules\.bots_go_ahead\b'
      out:
        card: {id: prop_go_ahead_1, status: waiting_for_confirm, summary: "Bots go ahead on their recommendation when nobody answers: on"}
        setting: {key: "team.rules.bots_go_ahead", name: "Bots go ahead on their recommendation when nobody answers", where: "Settings > Humans > Team rules"}
        value: true
        note: "Confirm card in the chat. Nothing changes until Dana taps it."
  must:
    - '^settings set team\.rules\.bots_go_ahead\b'
  must_not:
    - '^settings ask\b'
    - '^settings set team\.rules\.(admin|bots_go_ahead)\b.*--on-behalf-of'
  reply: |
    Dana asks to turn on the bots' go-ahead rule. The owner has turned off the Assistant's direct actions (team rule
    assistant_direct off), so the server returns a Confirm card for this Confirm-class setting rather than applying it. The turn
    finds the setting and sets it with `hub settings set team.rules.bots_go_ahead true`, and the server returns the card in her
    chat rather than a change. The reply says the card is in her chat and nothing changes until she taps it. It never says the
    rule is on. One or two lines, with the Team rules link ([Settings > Humans](#/settings/people)).

- id: admin-routine-create
  group: admin
  prompt: "Set up a routine: every Monday at 9am, have the Finance Analyst put last week's unpaid bills in my queue as a task."
  hub:
    - match: '^automation guide'
      out:
        format: {name: "text", owner: "bot:<slug> or person:<id>", trigger: {type: "schedule", cron: "five fields, e.g. 0 9 * * 1", tz: "IANA zone"}, steps: [{id: "text", type: "bot_turn", bot: "<slug>", prompt: "text"}]}
        save: "hub automation create --file - (the JSON on stdin)"
    - match: '^bot show finance-analyst'
      out: {bot: {slug: finance-analyst, display_name: "Finance Analyst", status: active, owners: [dana]}}
    - match: '^automation list'
      out:
        automations:
          - {id: auto_health_pings, name: "Health Monitor runner queue ping", owner: "bot:health-monitor", trigger: "every 6 hours", enabled: true}
        next: null
    - match: '^automation create\b'
      out:
        automation:
          id: auto_unpaid_bills_mon
          name: "Unpaid bills, Mondays 9am"
          owner: "bot:finance-analyst"
          trigger: {type: schedule, cron: "0 9 * * 1", tz: "America/Los_Angeles"}
          enabled: true
          version: 1
  must:
    - '^automation create\b'
  must_not:
    - '^automation (delete|update)\b.*--disable'
    - '^task create\b'
    - '^message send\b'
  reply: |
    Dana asks for a Monday 9am routine: the Finance Analyst puts last week's unpaid bills in her queue. The turn saves ONE
    automation with `hub automation create --file -` (a JSON body with a name, owner `bot:finance-analyst`, a schedule trigger
    with cron `0 9 * * 1` (a time zone only if the team has one; otherwise it is left out and the reply names the zone it runs in,
    never a question about the zone), and one bot_turn step for that bot). The reply gives its name, when it runs, the link
    [name](#/automations/<id>), and "say undo to put it back". It does not run it now, does not file tasks itself, and sends nothing
    outside the team.

- id: admin-budget-raise
  group: admin
  prompt: "Raise the Marketing budget to $4,000 a month from December 1."
  hub:
    - match: '^finance report budget_vs_actual'
      out:
        report: "budget_vs_actual"
        as_of: "2026-11-03"
        budgets: [{id: bud_mkt_2026, name: "Marketing", owner: "dana", period: "monthly", amount: 300000, currency: "USD", spent: 214000, active: true}]
    - match: '^finance act help'
      out:
        kind: "budget_update"
        fields: {budget_id: "the budget's id", amount: "minor units (cents): 400000 is $4,000", effective_from: "YYYY-MM-DD"}
    - match: '^finance act budget_update\b.*--dry-run'
      out:
        ok: true
        kind: "budget_update"
        status: "preview"
        budget_id: "bud_mkt_2026"
        amount: 400000
        effective_from: "2026-12-01"
        summary: "Would change budget Marketing to 4000.00 USD from 2026-12-01. Nothing saved."
    - match: '^finance act budget_update\b'
      out:
        ok: true
        kind: "budget_update"
        status: "committed"
        budget_id: "bud_mkt_2026"
        amount: 400000
        effective_from: "2026-12-01"
        summary: "Change budget Marketing to 4000.00 USD from 2026-12-01"
  must:
    - '^finance act budget_update\b.*\bbud_mkt_2026\b'
    - '^finance act budget_update\b.*\b400000\b'
  must_not:
    - '^finance act budget_update\b.*"amount":\s*4000\b'
  reply: |
    Dana raises the Marketing budget to $4,000 a month from December 1. The turn finds the budget id (`hub finance report
    budget_vs_actual`: Marketing, now $3,000 a month) and makes the change with `hub finance act budget_update`: one committed
    call with that id, amount 400000 (amounts are in cents, so $4,000 is 400000, not 4000), effective_from 2026-12-01, and an
    operation id. A dry run before it is fine; the real change must still be made. It reports the outcome
    the answer gives (committed here) in one line, with the new amount and date, and says how to undo it (the old amount from
    the same date). It does not claim a change the answer did not give.

- id: admin-inbox-audience
  group: admin
  prompt: "Only the Finance team should see the billing inbox. Change that."
  hub:
    - match: '^inbound inboxes'
      out:
        inboxes:
          - {id: ibx_billing, address: "billing@acme.example", kind: email, audience: company}
          - {id: ibx_support, address: "support@acme.example", kind: email, audience: company}
        next: null
    - match: '^group list'
      out:
        groups:
          - {id: engineering, name: Engineering, parent: null, humans: [], bots: [head-of-engineering, botops]}
          - {id: finance, name: Finance, parent: null, humans: [priya], bots: [billing]}
    - match: '^inbound audience ibx_billing\b'
      out: {ok: true, inbox: ibx_billing, address: "billing@acme.example", audience: team, group: finance}
  must:
    - '^inbound audience ibx_billing team\b.*--group\s+finance\b'
  must_not:
    - '^inbound audience ibx_support\b'
    - '^inbound audience ibx_billing company\b'
    - '^automation inbox\b.*--send\s+on'
  reply: |
    Dana wants the billing inbox seen by the Finance team only. The turn changes that one inbox with `hub inbound audience
    ibx_billing team --group finance`. The support inbox and its sending are left alone. Reply: one line that billing@ is now
    for Finance only, with the link [Settings > More > Email & Phone](#/settings/inbound), and "say undo to put it back".

- id: admin-meeting-share-and-tasks
  group: admin
  prompt: "The Tuesday sync is in my Pending. Share it with the team, and make a task for Priya from its action items."
  hub:
    - match: '^human list'
      out:
        humans:
          - {id: dana, name: "Dana Reyes", email: "dana@acme.example", title: "Founder", signed_in: true}
          - {id: priya, name: "Priya Shah", email: "priya@acme.example", title: "Finance lead", signed_in: false}
    - match: '^meeting pending'
      out:
        items:
          - {id: mtg_tue_sync_1103, title: "Tuesday sync", started: "2026-11-03T16:00:00Z", participants: ["Dana Reyes", "Priya Shah", "Marco Lin"], review: "pending"}
        next_offset: null
    - match: '^meeting read mtg_tue_sync_1103'
      out:
        id: mtg_tue_sync_1103
        title: "Tuesday sync"
        action_items:
          - {owner: "Priya Shah", text: "Send the revised Harbor Co pricing sheet to Dana by Friday"}
          - {owner: "Marco Lin", text: "Book the Harbor Co call for next week"}
        transcript_excerpt: "Dana: Harbor wants the annual price with the multi-seat discount. Priya: I'll send the revised sheet by Friday. Marco: I'll book the call."
    - match: '^meeting approve mtg_tue_sync_1103\b'
      out: {ok: true, id: mtg_tue_sync_1103, review: "shared", shared_with: "team"}
    - match: '^task create\b'
      out: {task: {id: 4b9e2d17-9500-4000-8000-000000000201, title: "Send the revised Harbor Co pricing sheet to Dana by Friday", owner: "human:priya", status: open}}
  must:
    - '^meeting approve\b'
    - '^task create\b.*--owner\s+(?:human:)?priya\b'
  must_not:
    - '^meeting approve\b.*--private'
    - '^task create\b.*--owner\s+(?:human:)?marco\b'
    - '^meeting delete\b'
  reply: |
    Dana asks to share the Tuesday sync that is in her Pending, and for a task for Priya from its action items. The turn shares
    the meeting with the team (`hub meeting approve`, not private) only because she asked it to share; a task alone would not
    justify approve. It reads its action items, and files ONE task for Priya with her item, owned by her, with its link. It does
    not file Marco's item: Dana asked only for Priya's. Reply: two short lines, the meeting shared (with its link) and Priya's
    task (with its link), and how to undo the task (close it).

- id: admin-goal-read-back
  group: admin
  prompt: "Add a goal for me: close the Harbor Co renewal at list price by Nov 30. It serves the Retention bet."
  hub:
    - match: '^goal list'
      out:
        goals:
          - {id: goal_retention, title: "Keep the top 20 accounts", owner: "human:dana", status: active}
        next: null
    - match: '^strategy show'
      out:
        bets:
          - {id: bet_retention, name: "Retention"}
          - {id: bet_growth, name: "Growth"}
    - match: '^goal read-back'
      out:
        message_id: 3d7a0e21-9500-4000-8000-000000000301
        text: "Goal: close the Harbor Co renewal at list price by Nov 30, serving the Retention bet. Reply yes to save it."
        saved: false
  must:
    - '^goal read-back\b'
  must_not:
    - '^goal (save|create|update)\b'
  reply: |
    Dana adds a goal: close the Harbor Co renewal at list price by Nov 30, serving the Retention bet. The turn posts ONE read-back
    with `hub goal read-back` (goal_create, with its title, owner and date, and the bet it serves) and saves nothing: no `hub
    goal save`, no create, no update. The reply is the read-back in short, and says it is saved only on her plain yes. One
    question at most, if it is needed; the read-back is the expected call.
