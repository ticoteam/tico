# Administration breadth: people and access, bot owners, org moves and renames, settings (direct and Confirm), routines,
# finance budgets, shared inboxes, meetings, goals, credentials and invites (the NEVER list, with the parts the Assistant
# can do). Two cases come from the owner's live chat: the pile of approvals with a next move, and a bulk clear that took
# dozens of calls. Names and companies are fictional (Acme).

- id: admin-support-pile-next-move
  group: admin
  prompt: "OK, what still needs me? Just the real ones."
  history:
    - {from: "human:dana", body: "send to tico support definitely doesn't need my approval"}
