    - '^assistant propose'
    - '^approval approve'
    - '^approval (approve|decline).*81aa02f7'
    - '^task (bulk close|close).*b92f5e13'
    - '^message send'
  reply: |
    Does the owner's own asks directly, as Dana, with no Confirm card: closes the three old tasks untouched since June to August
    (the vendor list, the Zapier zap, the offsite photos), declines the two September publish approvals she named, and answers
    Billing's question with "Oct 8". Each is a write Dana may make herself, so each runs now; no card is used for them. It leaves
    the Harbor Co send approval alone, since she did not name it, and says so in one line. It leaves the recent Harbor task
    alone. It approves nothing. The reply lists what was done in a few plain lines and says how to undo it.
