    each: the linked title, about twelve words of why, and one question or next action. The five should be real decisions
    and fixes (for example the workflow edits, the Team price, the paid search spend, the account executive ad, the
    recorder bug), not routine bot work such as the churn report. No preamble, no restating the request or the goal, no
    account of how it chose, no closing offer. The first line is the first item, or at most one short line of count before
    the items.

