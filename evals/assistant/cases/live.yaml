    Closes the six bot-owned tasks that are not kept, one task close each, in this turn, as Dana: the shipped release docs,
    the duplicate Trial-plan rename, and the four bot tasks still being worked (the churn report, the newsletter draft, the
    support backlog, the onboarding draft). She asked to close basically all of them, so it does not hold back bot work.
    It keeps five and names them one line each, as the most important: real decisions and real fixes (the workflow edits,
    the Team price, the paid search spend, the account executive ad, the recorder bug). Each kept item is one line: its
    link, about twelve words of why, and one question or next action (for example "Fix it now?"). It opens with the result
    ("Closed 6 tasks", with "say undo to reopen them"). It does not restate her request, the goal, or how it ranked: no
    preamble, no "tell me which ones and I will", no closing offer, no menu. It gives no OK, answers nothing, sends no
    message and creates no task. The numbers match the record: 11 open, 6 closed, 5 kept. Plain lines, no headings.

