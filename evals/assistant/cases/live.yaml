# Live cases: asks from the owner's real Assistant chat on Nov 3, where the Assistant did badly. Each case is independent.
# Owner Dana; company Acme; bots are named by slug. The canned records are the ones the chat saw. Main has offered 100k as a
# Compact at choice since #2313 (Nov 3); the record here offers it, as the live hub does.

- id: live-models-all-bots
  group: live
  prompt: "Can you set the model for all my bots to haiku 5.5 xhigh 100k context? Except for codex bots which you can set to terra 6.1 high?"
  hub:
    - match: '^bot status list'
      out:
        - {id: copywriter, slug: copywriter, display_name: Copywriter, state: active, owner_id: "human:dana", runtime: claude, model: claude-sonnet-5-5, effort: high, compact_at: 250000}
        - {id: support, slug: support, display_name: Support, state: active, owner_id: "human:dana", runtime: claude, model: claude-opus-5-5, effort: medium, compact_at: 250000}
        - {id: analyst, slug: analyst, display_name: Analyst, state: active, owner_id: "human:dana", runtime: claude, model: claude-sonnet-5-5, effort: medium, compact_at: 150000}
        - {id: sales, slug: sales, display_name: Sales, state: active, owner_id: "human:dana", runtime: codex, model: gpt-6.1-sol, effort: medium, compact_at: 250000}
        - {id: pricing, slug: pricing, display_name: Pricing, state: active, owner_id: "human:dana", runtime: codex, model: gpt-6-luna, effort: high, compact_at: 250000}
        - {id: research, slug: research, display_name: Research, state: active, owner_id: "human:dana", runtime: pi, model: deepseek-v4.1-flash, effort: low, compact_at: 250000}
    - match: '^bot model \S+\s*$'
      out:
        models:
          - {id: claude-haiku-5-5, label: "haiku 5.5", provider: anthropic, efforts: [low, medium, high, xhigh], default_effort: medium}
          - {id: claude-sonnet-5-5, label: "sonnet 5.5", provider: anthropic, efforts: [low, medium, high, xhigh, max], default_effort: high}
          - {id: gpt-6.1-sol, label: "gpt 6.1 sol", provider: openai, efforts: [low, medium, high, xhigh, max], default_effort: medium}
          - {id: gpt-6-luna, label: "gpt 6 luna", provider: openai, efforts: [low, medium, high, xhigh, max], default_effort: max}
          - {id: gpt-6.1-terra, label: "gpt 6.1 terra", provider: openai, efforts: [low, medium, high, xhigh, max], default_effort: medium}
          - {id: deepseek-v4.1-flash, label: "deepseek v4.1 flash", provider: deepseek, efforts: [low, high, max], default_effort: low}
    - match: '^settings find'
      out:
        matches:
          - {key: "bot.compact_at", label: "Compact at", value: 250000, options: [100000, 150000, 250000, 400000, 600000, 1000000], where: "Bots > Bot editor", who_may_change: "the owner"}
    - match: '^settings show bot\.compact_at'
      out:
        key: "bot.compact_at"
        label: "Compact at"
        value: 250000
        options: [100000, 150000, 250000, 400000, 600000, 1000000]
        who_may_change: "the owner"
  must:
    - '^bot model copywriter claude-haiku-5-5\b.*--effort xhigh\b'
    - '^bot model support claude-haiku-5-5\b.*--effort xhigh\b'
    - '^bot model analyst claude-haiku-5-5\b.*--effort xhigh\b'
    - '^bot model sales gpt-6\.1-terra\b.*--effort high\b'
    - '^bot model pricing gpt-6\.1-terra\b.*--effort high\b'
    - '^settings set bot\.compact_at 100000\b.*--bot copywriter\b'
    - '^settings set bot\.compact_at 100000\b.*--bot support\b'
    - '^settings set bot\.compact_at 100000\b.*--bot analyst\b'
  must_not:
    - '^message send(?! -h\b| --help)'
    - '^note create\b'
    - '^task create\b.*botops'
  reply: |
    Changes the models itself, with no hand-off. It sets the three Claude bots (Copywriter, Support, Analyst) to haiku 5.5 at
    xhigh, one bot model call each, and sets the two Codex bots (Sales, Pricing) to gpt-6.1-terra at high, since terra is in
    this record's model list. For Research, the pi bot, either it sets it to haiku 5.5 at xhigh too (her words say all bots) or it leaves it and says why in one line; both pass. It does not message BotOps, file a task for BotOps, ask
    it a question, or leave it a note. For the 100k context it sets Compact at to 100k (the record offers it) on the Claude bots, one settings set each, and
    says so. The reply is a short summary of what changed, a few short lines, and every number in it matches the
    record.

- id: live-short-followup-answer
  group: live
  prompt: "Do Luna xhigh"
  history:
    - {from: "human:dana", body: "Switch the Codex bots to terra 6.1 high."}
    - {from: "assistant", body: "There is no terra model on the hub. The Codex models here are GPT 6.1 Sol and GPT 6 Luna. Which one should Sales and Pricing use, and at what effort?"}
  hub:
    - match: '^bot status list'
      out:
        - {id: sales, slug: sales, display_name: Sales, state: active, owner_id: "human:dana", runtime: codex, model: gpt-6.1-sol, effort: medium, compact_at: 250000}
        - {id: pricing, slug: pricing, display_name: Pricing, state: active, owner_id: "human:dana", runtime: codex, model: gpt-6.1-sol, effort: high, compact_at: 250000}
        - {id: copywriter, slug: copywriter, display_name: Copywriter, state: active, owner_id: "human:dana", runtime: claude, model: claude-sonnet-5-5, effort: high, compact_at: 250000}
    - match: '^bot model \S+\s*$'
      out:
        models:
          - {id: claude-haiku-5-5, label: "haiku 5.5", provider: anthropic, efforts: [low, medium, high, xhigh], default_effort: medium}
          - {id: claude-sonnet-5-5, label: "sonnet 5.5", provider: anthropic, efforts: [low, medium, high, xhigh, max], default_effort: high}
          - {id: gpt-6.1-sol, label: "gpt 6.1 sol", provider: openai, efforts: [low, medium, high, xhigh, max], default_effort: medium}
          - {id: gpt-6-luna, label: "gpt 6 luna", provider: openai, efforts: [low, medium, high, xhigh, max], default_effort: max}
  must:
    - '^bot model sales gpt-6-luna\b.*--effort xhigh\b'
    - '^bot model pricing gpt-6-luna\b.*--effort xhigh\b'
  must_not:
    - '^message send(?! -h\b| --help)'
    - '^note create\b'
    - '^task create\b.*botops'
    - '^bot (pause|resume|archive) copywriter\b'
    - '^bot (model|task-model|update) copywriter\b(?!\s*$)'
  reply: |
    Applies the change itself. It sets Sales and Pricing, the two Codex bots, to gpt-6-luna at xhigh, one bot model call each.
    It does not send the change through BotOps, does not message anyone, and leaves Copywriter alone. The reply is one to three
    lines and says what changed (Sales and Pricing now on GPT 6 Luna at xhigh). It does not say terra was applied, and it does
    not ask again which model to use, since Dana just answered that.

