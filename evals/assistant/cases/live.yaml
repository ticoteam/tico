  group: live
  prompt: "I want to close basically all the tickets. Walk me through up to five ones you think are really important. If I think there are more, I think there's some in this list, then we'll go from looking for more, but let's start with that: things that we should address."
  history:
    - {from: "human:dana", body: "Clean up my tickets. Most of them are old."}
    - {from: "assistant", body: "Kept 11 open. 'Turn on workflow edits for the builders' is yours: one GitHub App permission and two ticks, and three bot tasks wait on it, so closing it would leave them stuck. The rest are bot tasks still being worked, and closing them would stop that work. Tell me which ones to close and I will."}
