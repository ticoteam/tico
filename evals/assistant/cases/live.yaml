- id: live-decision-asked-in-reply
  group: live
  prompt: "Should the spring price be $49 or $59?"
  hub:
    - match: '^task list'
      out:
        tasks: [*q2]
        next: null
  must: ['reply:\?']
  must_not:
    - '^task (create|ask|answer)\b'
    - '^assistant propose\b'
    - '^task (close|done)\b'
    - '^message send(?! -h\b| --help)'
  reply_max_words: 90
  reply: |
    The price is Dana's decision, and she has not handed it over, so the Assistant does not pick one, set it, give an OK
    or send anything. It asks her one question in this reply, $49 or $59, with the task linked (Pick the Team price for
    the spring page), and may say briefly what it would weigh. It puts no ask on the task and creates no task: she answers
    in this chat. Two to four short lines, plain, no headings.

- id: live-delegated-choice-acts
  group: live
  prompt: "Pick the spring price for me, $49 or $59. Whatever you think is right."
  hub:
    - match: '^task list'
      out:
        tasks: [*q2]
        next: null
  must: ['reply:\$?(49|59)\b']
  must_not:
    - '^task (create|ask|answer)\b'
    - '^assistant propose\b'
    - '^message send(?! -h\b| --help)'
  reply_max_words: 90
  reply: |
    The price was handed to the Assistant ("whatever you think is right"), so it decides: it picks $49 or $59 (either is
    fine), says which in one line and that she left the choice to it, and records the pick on the task (a comment, or a
    close with the pick in its note). It puts no ask on the task, creates no task, gives no OK and sends no message, and it
    does not ask her again. Two to four short lines, plain, no headings.
