# Verbosity and close-all cases from the owner's chat of Nov 6: "I want to close basically all the tickets. Walk me through up to
# five ones you think are really important." The Assistant had refused to close bot tasks being worked and sent long
# paragraphs. The task list below is shared by the first two cases (YAML anchors): 4 tasks Dana owns and 7 bot tasks she
# asked for.
