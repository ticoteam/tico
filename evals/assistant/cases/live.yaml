          - {name: Operations, bots: [{slug: upgrade-manager, display_name: Upgrade Manager, job: "Files runtime and dependency upgrades"}]}
    - match: '^task list'
      out:
        tasks:
          - {id: 3a1f0c21-9300-4000-8000-000000000101, title: "Upgrade the Node runtime to 22.12 in the runner image", status: open, owner: "human:dana", requester: "bot:upgrade-manager", created: "2026-11-02T14:10:00Z", updated: "2026-11-03T08:05:00Z"}
