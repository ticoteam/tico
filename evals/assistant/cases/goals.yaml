# Goal-driving cases: where the person stands on their goals, what to do today, the suggestions they turned down, work a bot
# can do, the keep-going offer in a chat, and the morning message (background runs). Owner Dana; company Acme; the goal
# ids, bets and KPI readings are invented.
# Canned reads follow the real routes: `whoami` (backend/app.py /me), `goal list` (backend/goal_routes.py: the default is
# {owner, goals, chain, reports, company} of bare goal rows with no KPIs; `--all` is a bare list), `goal show` (goals.view:
# the row with kpis, tasks, checkins), `strategy show` (strategy.view; in a person's Assistant chat the identity acts via the
# Assistant, so it is never the strategy editor: no draft, published bets only, `may_edit` false), `proposal list`
# ({proposals}), `human list` (a bare list), and `assistant morning` ({message_id, conversation_id, day, next_at}, or the
# CLI's error JSON on a 409). A goal always has an owner; a company goal is owned by the Team (`company`).

- id: goals-where-we-stand-red-no-owner
  group: goals
  prompt: "Where do we stand on our goals?"
  hub:
    - match: '^whoami'
      out: {actor: "human:dana", role: owner, email: "dana@acme.example"}
    - match: '^strategy show'
      out:
        current: {n: 3, status: published, summary: "Keep the top accounts and grow self-serve trials.", published_at: "2026-10-20T17:00:00Z", published_by: "human:dana"}
        bets:
          - {id: bet_harbor, statement: "Keep the top accounts", status: active, rank: 0}
          - {id: bet_trials, statement: "Self-serve trials", status: active, rank: 1}
        label: Bets
        label_one: Bet
        may_edit: false
        goals_by_bet:
          bet_harbor: [{id: goal_9a1e0c77, title: "Grow the Harbor account", owner_id: company, status: red}]
          bet_trials: [{id: goal_4f2a9c1b, title: "Paid trials to 400 a month by year end", owner_id: "human:dana", status: yellow}]
        live_by_bet: {bet_harbor: 1, bet_trials: 1}
        health_by_bet: {bet_harbor: red, bet_trials: yellow}
    - match: '^goal list'
      out:
        - {id: goal_9a1e0c77, title: "Grow the Harbor account", owner_id: company, parent_id: null, status: red, status_note: "Harbor renewal ARR is 42,000 against 120,000", status_source: auto, bet_id: bet_harbor, rank: 0, updated_at: "2026-10-31T18:00:00Z"}
        - {id: goal_4f2a9c1b, title: "Paid trials to 400 a month by year end", owner_id: "human:dana", parent_id: null, status: yellow, status_note: "Paid trials per month is 318 against 400", status_source: auto, bet_id: bet_trials, rank: 0, updated_at: "2026-10-31T18:00:00Z"}
    - match: '^goal show goal_9a1e0c77'
      out:
        id: goal_9a1e0c77
        title: "Grow the Harbor account"
        owner_id: company
        status: red
        status_note: "Harbor renewal ARR is 42,000 against 120,000"
        bet_id: bet_harbor
        kpis: [{id: kpi_harbor_arr, name: "Harbor renewal ARR", unit: "", latest: {value: 42000, period_end: "2026-10-31"}, freshness: fresh, target_label: "→ 120,000 by Dec 31", status: red, reason: "42,000 against 120,000"}]
        children: []
        chain: []
        tasks: []
        events: []
        checkins: []
        proposals: []
    - match: '^goal show goal_4f2a9c1b'
      out:
        id: goal_4f2a9c1b
        title: "Paid trials to 400 a month by year end"
        owner_id: "human:dana"
        status: yellow
        status_note: "Paid trials per month is 318 against 400"
        bet_id: bet_trials
        kpis: [{id: kpi_trials, name: "Paid trials per month", unit: "", latest: {value: 318, period_end: "2026-10-31"}, freshness: fresh, target_label: "→ 400 by Dec 31", status: yellow, reason: "318 against 400"}]
        children: []
        chain: []
        tasks: [{id: 7d1e4b20-5000-4000-8000-000000000003, title: "Trial onboarding emails", owner_id: "bot:copywriter", requester_id: "human:dana", status: doing, updated_at: "2026-11-03T15:00:00Z"}]
        events: []
        checkins: [{id: chk_1, goal_id: goal_4f2a9c1b, created_at: "2026-10-27T16:00:00Z", author: "human:dana", body: "Onboarding emails go out next week.", signal: at_risk}]
        proposals: []
    - match: '^proposal list'
      out: {proposals: []}
  must:
    - '^goal list\b'
  must_not:
    - '^goal (save|create|update|status|read-back)\b'
    - '^assistant propose'
    - '^task (create|close|bulk)\b'
  reply: |
    Opens with where they stand in one line: one goal red, one yellow. The red company goal comes first and is linked,
    [Grow the Harbor account](#/goals/goal_9a1e0c77), with its number from the record (42,000 against 120,000, Oct 31). The
    gap it names is that nobody is on it: it is owned only by the Team, with no open task, so the item for Dana is to hand it
    to someone (a person or a bot), which only she can decide. It may name the trials goal second, linked, with 318 against
    400. At most three items, each with its goal linked. It may end with one "Next: ... Do it now?" line. It changes nothing,
    invents no figure, and adds no headings, strategy summary or list of reads that came back empty.

