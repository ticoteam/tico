- id: followups-also-check-health
  group: followups
  prompt: "also the Check health ones"
  history:
    - {from: "human:dana", body: "Have Check health stop pinging me with test tasks. Only the runner queue ones."}
    - {from: "assistant", body: "Turned off the runner queue ping automation. Say undo to put it back. The three test pings already in your queue are still open."}
  hub:
    - match: '^task list'
      out:
        tasks:
          - {id: 4d3f8b5a-1000-4000-8000-000000000004, number: 301, title: "[Check health] test ping: runner queue", status: open, version: 1, pipeline_id: general, stage_id: general-todo, owner: "human:dana", requester: "bot:botops", turn: {state: person, who: "human:dana", line: "Dana: look at the test ping"}, created: "2026-11-02T06:00:00Z", updated: "2026-11-02T06:00:00Z"}
          - {id: 5e4a9c6b-1000-4000-8000-000000000005, number: 302, title: "[Check health] test ping: runner queue", status: open, version: 1, pipeline_id: general, stage_id: general-todo, owner: "human:dana", requester: "bot:botops", turn: {state: person, who: "human:dana", line: "Dana: look at the test ping"}, created: "2026-11-02T12:00:00Z", updated: "2026-11-02T12:00:00Z"}
          - {id: 6f5b0d7c-1000-4000-8000-000000000006, number: 303, title: "[Check health] test ping: runner queue", status: open, version: 1, pipeline_id: general, stage_id: general-todo, owner: "human:dana", requester: "bot:botops", turn: {state: person, who: "human:dana", line: "Dana: look at the test ping"}, created: "2026-11-02T18:00:00Z", updated: "2026-11-02T18:00:00Z"}
          - {id: e7a1c3d9-8200-4000-8000-000000000007, number: 304, title: "[Check health] cell-2 disk at 91 percent", status: open, version: 2, pipeline_id: general, stage_id: general-todo, owner: "human:dana", requester: "bot:botops", turn: {state: person, who: "human:dana", line: "Dana: free space on cell-2 (a real finding)"}, created: "2026-11-02T20:00:00Z", updated: "2026-11-02T20:00:00Z"}
        next: null
    - match: '^task close (4d3f8b5a|5e4a9c6b|6f5b0d7c)'
      out: {ok: true, task: {status: closed}, note: "closed as the person, via Assistant"}
    - match: '^automation (list|show)'
      out:
        automations:
          - {id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: false, runs_7d: 4, creates: "one task per run, owner human:dana"}
        next: null
  must:
    - '^task close 4d3f8b5a\S*'
    - '^task close 5e4a9c6b\S*'
    - '^task close 6f5b0d7c\S*'
  must_not:
    - '^task (close|done|move|update) .*e7a1c3d9\S*'
    - '^task (close|update|done|move)\b(?! (4d3f8b5a|5e4a9c6b|6f5b0d7c))'
    - '^task answer(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
  reply: |
    Closes the three open Check health test pings, by their ids, as Dana (one `tico task close` per id), and says so with the
    count and how to reopen them. It leaves the real Check health finding about cell-2's disk open, since it is not a test
    ping, and says so in a line. It does not message Check health and does not touch the automation again.

- id: followups-stop-them-coming-back
  group: followups
  prompt: "Stop them from coming back."
  history:
    - {from: "human:dana", body: "Close the test pings from Check health."}
    - {from: "assistant", body: "Closed the three test pings. The source still makes them every 6 hours, so more will come."}
  hub:
    - match: '^origin show'
      out:
        item: {kind: task, id: "4d3f8b5a-1000-4000-8000-000000000004", title: "[Check health] test ping: runner queue"}
        made_by: "bot:botops"
        source: {kind: automation, id: auto_health_pings, name: "Check health runner queue ping", trigger: "every 6 hours"}
        siblings_this_week: 22
        stops:
          - {fix: "Turn the automation off", command: "tico automation update auto_health_pings --disable --summary 'stop test pings'"}
          - {fix: "Or a rule that stops it", command: "tico rules add --kind internal --text 'Check health test pings do not go into the owner queue' --who human:dana"}
    - match: '^automation (list|show)'
      out:
        automations:
          - {id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: true, runs_7d: 24, creates: "one task per run, owner human:dana"}
        next: null
      after:
        - {when: '^automation update auto_health_pings .*--disable', out: {automations: [{id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: false, runs_7d: 24, creates: "one task per run, owner human:dana"}], next: null}}
    - match: '^automation update auto_health_pings .*--disable'
      out: {ok: true, id: auto_health_pings, enabled: false, version: 4, summary: "turned off at the owner's request via Assistant"}
    - match: '^automation update auto_health_pings'
      out: {ok: true, id: auto_health_pings, enabled: true, version: 4}
    - match: '^rules add'
      out: {ok: true, id: rule_1190, status: active}
  must:
    - '^(origin show|automation (list|show))\b'
    - '^(automation update auto_health_pings .*--disable|rules add)\b'
  must_not:
    - '^message send(?! -h\b| --help)'
    - '^task answer(?! -h\b| --help)'
    - '^automation update auto_docs_release'
  reply: |
    Stops the source, not the symptom: turns off the Check health runner queue ping automation (auto_health_pings), or adds a
    rule that stops it, as Dana. It says which, in one line, and how to undo it. It does not close more tasks, does not touch
    the release docs automation, and does not message Check health.

