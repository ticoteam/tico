# Follow-ups: a short message that only makes sense after the earlier exchange. The harness has no multi-turn runs, so each
# case carries the earlier words of the chat as `history`, and the person's short reply as the prompt.

- id: followups-undo-after-close
  group: followups
  prompt: "undo"
  history:
    - {from: "human:dana", body: "Close the Harbor Co reminder task, the renewal is sorted."}
    - {from: "assistant", body: "Closed it: Harbor Co renewal reminder. Say undo to put it back."}
  hub:
    - match: '^assistant change list'
      out:
        changes:
          - {id: chg_8d4c02, at: "2026-11-03T10:31:00Z", action: task.close, summary: "Closed 'Harbor Co renewal reminder'", words: "Close the Harbor Co reminder task, the renewal is sorted.", recorded_as: "Dana (via Assistant)", undo: "reopen"}
        next: null
    - match: '^assistant change restore chg_8d4c02'
      out:
        ok: true
        id: chg_8d4c02
        restored: "task reopened to open"
        task: "Harbor Co renewal reminder"
  must:
    - '^assistant change list\b'
    - '^assistant change restore chg_8d4c02\b'
  must_not:
    - '^task (create|close)(?! -h\b| --help)'
    - '^task answer(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
  reply: |
    Restores the last change, the close of the Harbor Co renewal reminder, so the task is open again. It says in one line what
    came back, with a link if the record gives an id. It does not create a task, close anything else, answer any ask, or
    message Harbor Co or anyone else.

