- id: queue-undo-close
  group: queue
  prompt: "undo that"
  history:
    - {from: "human:dana", body: "Close the Finance phase 0 review of PR #1991. It's done."}
    - {from: "assistant", body: "Closed it: Finance phase 0 review of PR #1991."}
  hub:
    - match: '^assistant change list'
      out:
        changes:
          - id: chg_7f3a21
            at: "2026-11-03T09:12:00Z"
            action: task.close
            summary: "Closed 'Finance phase 0 review of PR #1991'"
            words: "Close the Finance phase 0 review of PR #1991. It's done."
            recorded_as: "Dana (via Assistant)"
            undo: "reopen"
    - match: '^assistant change restore chg_7f3a21'
      out: {ok: true, id: chg_7f3a21, restored: "task reopened to open", task: "Finance phase 0 review of PR #1991"}
  must:
    - '^assistant change list\b'
    - '^assistant change restore chg_7f3a21\b'
  must_not:
    - '^task (create|close|bulk close)\b'
    - '^approval (approve|decline)'
    - '^message send'
  reply: |
    Finds the last change the Assistant made for Dana (the close of the Finance phase 0 review of PR #1991) from its change
    list, and restores it, so the task is open again. It says in one line what was undone and which task, with a link if known.
    It does not create a new task, close anything else, or message anyone. Short.

- id: queue-morning-summary
  group: queue
  prompt: "morning, anything I should know?"
  hub:
    - match: '^brief'
      out:
        alerts:
          - "Runner queue: 6 test pings from Health Monitor open on you since Nov 2."
          - "Release v0.5.20 shipped at 23:00 UTC; its docs task is done but still open."
        waiting_on_you: {count: 193}
        bots_down: []
        what_bots_said: "Technical Writer filed 3 docs tasks overnight. Release Manager is waiting on your v0.5.0 publish approval."
    - match: '^needs-you show'
      out: {total: 193, by_kind: {task: 130, question: 57, approval: 6}, created_this_week: 159, older_than_3_days: 118}
    - match: '^health check'
      out: {problems: [], note: "No bot is down. Two computers are idle."}
    - match: '^task list'
      out: *q_tasks
  must:
    - '^(brief|needs-you show|health check|task list)\b'
  must_not:
    - '^message send'
    - '^approval (approve|decline)'
  reply: |
    A short morning summary, not a dump: nothing is down, the number that waits on her (193, from the tool, quoted exactly or
    as "about 190" with the exact figure available), the handful that are real decisions (the v0.5.0 publish approval, the
    org-chart yes, the release merge), and the noise (the repeated test pings and done docs tasks). It offers one clear next
    step (clear the done and duplicate items, stop the test pings) or does it, saying what it did with undo. It does not
    approve anything, and it does not send messages. Plain lines, links where it has ids.
