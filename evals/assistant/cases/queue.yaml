- id: queue-stop-release-notices
  group: queue
  prompt: "i don't think we need those release notices at all, i don't want them"
  history:
    - {from: "human:dana", body: "can you clear old tasks?"}
    - {from: "assistant", body: "I closed one old task (Finance phase 0 review of PR #1991). The others are live work or wait on you."}
  hub:
    - match: '^task list'
      out: *q_tasks
    - match: '^needs-you show'
      out: *q_needs
    - match: '^automation list'
      out:
        automations:
          - {id: auto_docs_release, name: "Docs and release notes for each release", owner: "bot:technical-writer", trigger: "release published (about twice a day)", enabled: true, runs_7d: 14, creates: "one task per release, owner human:dana"}
          - {id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: true, runs_7d: 24, creates: "one task per run, owner human:dana"}
        next: null
    - match: '^automation show auto_docs_release'
      out:
        automation:
          id: auto_docs_release
          name: "Docs and release notes for each release"
          owner: "bot:technical-writer"
          trigger: {kind: "release.published"}
          steps: [{action: "task.create", owner: "human:dana", title: "Docs for {version} release notes"}]
          enabled: true
          version: 4
    - match: '^origin show'
      out:
        item: {kind: task, id: "1a0c5e27-1000-4000-8000-000000000001", title: "Docs for v0.5.20 release notes"}
        made_by: "bot:technical-writer"
        source: {kind: automation, id: auto_docs_release, name: "Docs and release notes for each release", trigger: "release.published"}
        siblings_this_week: 14
    - match: '^automation update auto_docs_release'
      out: {ok: true, id: auto_docs_release, enabled: false, version: 5, summary: "disabled at the owner's request via Assistant"}
    - match: '^rules add'
      out: {ok: true, id: rule_1182, status: active}
  must:
    - '^(automation update auto_docs_release|rules add)\b'
    - '^task close (1a0c5e27|2b1d6f38|3c2e7a49)'
  must_not:
    - '^task (close|done|move|update) \S*(7d21c4a0|8e6d2f1b|9f7e3a2c)'
    - '^task answer \S+ \S+ ok\b'
    - '^message send'
  reply: |
    Stops the source, not just the symptom: it disables the Technical Writer's "Docs and release notes for each release"
    automation, or adds a rule that stops it, and says so. It also closes the three open "Docs for vX" tasks, as Dana, one
    close each. It says what it changed and how to undo it (turn the automation back on, reopen the tasks). It does not
    message the Technical Writer or any bot about it, and does not refuse because the automation belongs to a bot. A
    short reply in a few lines, with the automation named and linked.

- id: queue-why-sent
  group: queue
  prompt: "why are they being sent?"
  history:
    - {from: "human:dana", body: "i don't think we need those release notices at all, i don't want them"}
    - {from: "assistant", body: "I closed the done release-notes tasks. The source is still on."}
  hub:
    - match: '^task list'
      out: *q_tasks
    - match: '^origin show 1a0c5e27\S*'
      out:
        item: {kind: task, id: "1a0c5e27-1000-4000-8000-000000000001", title: "Docs for v0.5.20 release notes"}
        made_by: "bot:technical-writer"
        source: {kind: automation, id: auto_docs_release, name: "Docs and release notes for each release", trigger: "release.published"}
        siblings_this_week: 14
        stops:
          - {fix: "Turn the automation off", command: "tico automation update auto_docs_release --disable --summary 'stop per-release docs tasks'"}
          - {fix: "Or a rule that stops it", command: "tico rules add --text 'No per-release docs tasks for the owner' --who human:dana"}
    - match: '^automation list'
      out:
        automations:
          - {id: auto_docs_release, name: "Docs and release notes for each release", owner: "bot:technical-writer", trigger: "release published (about twice a day)", enabled: true, runs_7d: 14, creates: "one task per release, owner human:dana"}
        next: null
  must:
    - '^(origin show|automation (list|show))\b'
  must_not:
    - '^(automation update|rules add|assistant propose)'
    - '^task (close|done|answer|move|update)\b'
    - '^message send'
  reply: |
    Names the source from the record: the automation "Docs and release notes for each release" (owned by the Technical Writer),
    which files one "Docs for vX" task for the owner on each release, releases going out about twice a day. It says this
    from `origin show` or the automation list, not a guess. It offers to stop it (turn the automation off, or add a rule)
    and asks, or does it only if the owner asked for the stop in the same message. It does not close anything or change the
    automation in this reply, since the owner asked why. Plain and short.

