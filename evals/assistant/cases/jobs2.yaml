# Everyday jobs, the ones jobs.yaml does not cover: the board, catch-up, meetings and files, owners and goals, why something
# happened, closing and reopening a task, handing work to a bot (answer, ask, tell, pause, resume, model, routine time), undo
# of an automation change, rules, and a support report that is only a link. Each case is independent; its canned rows
# cover every read the job makes. Owner Dana Okafor; Priya Shah is the CFO; bots are named by slug.

- id: jobs2-what-needs-me
  group: jobs2
  prompt: "What needs me right now? Just the real ones."
  hub:
    - match: '^needs-you show'
      out:
        total: 8
        by_kind: {task: 4, question: 2, approval: 2}
        created_this_week: 6
        older_than_3_days: 3
    - match: '^message list'
      out:
        actor: "human:dana"
        messages:
          - {id: 0a6d4b92-6100-4000-8000-000000000001, kind: notice, from_actor: "bot:release-manager", text: 'Approve this publish: {"release": "v0.5.0", "channel": "stable"}', refs: {approval: 5f3e21c0-6100-4000-8000-000000000001, task: 7d21c4a0-1000-4000-8000-000000000008}, created: "2026-11-01T09:00:00Z"}
          - {id: 0a6d4b92-6100-4000-8000-000000000002, kind: notice, from_actor: "bot:pr-reviewer", text: 'Approve this merge: {"repo": "tico", "pull_request": 2041}', refs: {approval: 6e1f0c2a-6100-4000-8000-000000000002}, created: "2026-11-02T14:00:00Z"}
          - {id: 0b7e4c19-6100-4000-8000-000000000003, kind: question, from_actor: "bot:engineering-lead", text: "Should the staging banner stay on through the holiday week? Options: keep it, or take it down on Nov 10.", created: "2026-11-02T11:00:00Z"}
          - {id: 1c8f5d2a-6100-4000-8000-000000000004, kind: question, from_actor: "bot:ceo-bot", text: "Which goal does CEO Bot own: the hiring plan or the budget?", created: "2026-10-31T11:00:00Z"}
        more_messages: false
        tasks: []
        notices: []
    - match: '^task list'
      out:
        tasks:
          - {id: 7d21c4a0-1000-4000-8000-000000000008, title: "Approve the v0.5.0 release publish", status: waiting, owner: "human:dana", requester: "bot:release-manager", note: "Ready for your publish approval.", created: "2026-10-29T09:00:00Z", updated: "2026-11-01T09:00:00Z"}
          - {id: 9f7e3a2c-1000-4000-8000-000000000010, title: "CEO Bot: which goals does it own?", status: waiting, owner: "human:dana", requester: "bot:botops", note: "Two questions open.", created: "2026-10-27T11:00:00Z", updated: "2026-10-31T11:00:00Z"}
          - {id: 5b8e0d11-aa47-4c92-8e13-f0a6b7c9d2e4, title: "Spring launch: pricing page", status: open, owner: "human:dana", requester: "human:dana", note: "", created: "2026-10-20T10:05:00Z", updated: "2026-10-20T10:05:00Z"}
          - {id: c2d3e4f5-1000-4000-8000-000000000011, title: "Website preview deploy failing", status: open, owner: "human:dana", requester: "bot:engineering-lead", note: "", created: "2026-10-14T09:00:00Z", updated: "2026-10-14T09:00:00Z"}
        next_offset: null
  must:
    - '^(needs-you show|message list)\b'
  must_not:
    - '^approval (approve|decline)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
    - '^task (close|bulk close|update)(?! -h\b| --help)'
  reply: |
    Lists what waits on Dana from the record, in a few plain lines with links: the v0.5.0 publish approval, the tico pull request
    2041 merge approval, the Engineering Lead question about the staging banner, the CEO Bot goal question, and the pricing page
    task she owns. The count is the tool's: 8 items (4 tasks, 2 questions, 2 approvals), quoted as the record gives it. It names
    which ones are real decisions. It does not approve, decline or answer anything, and changes nothing.

