        answered_at: "2026-11-03T09:20:00Z"
    - match: '^bot status list'
      out:
        - {slug: analytics, display_name: Analytics, state: active, focus: "Idle"}
        - {slug: copywriter, display_name: Copywriter, state: active, focus: "Launch email draft 2"}
  must:
    - '^question ask (\S+ )?analytics\b'
  must_not:
    - '^message send(?! -h\b| --help)'
    - '^task (create|close|update|bulk close)(?! -h\b| --help)'
    - '^approval (approve|decline)(?! -h\b| --help)'
  reply: |
    Reports Analytics' answer as it gave it: 318 paid trials in October, from the billing export run on Nov 1, and names that as
    the source. It does not invent a number or a second source, and it does not message Analytics or file a task.

- id: jobs2-tell-bot
  group: jobs2
  prompt: "Tell Copywriter to use the spring subject line from draft 1 for the launch email."
  hub:
