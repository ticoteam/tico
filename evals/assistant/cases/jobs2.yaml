    - '^task (close|bulk close|update)(?! -h\b| --help)'
    - '^approval (approve|decline)(?! -h\b| --help)'
  reply: |
    Sends Copywriter Dana's words (use the spring subject line from draft 1 for the launch email) in one line, and says it was
    sent to Copywriter, inside the team. It sends nothing to anyone outside the team, and does not close or change the launch
    email task.

- id: jobs2-pause-bot
  group: jobs2
  prompt: "Pause the Website bot until I say so."
  hub:
    - match: '^bot status list'
      out:
        - {slug: website, display_name: Website, state: active, focus: "Preview deploy failing since Oct 14"}
        - {slug: copywriter, display_name: Copywriter, state: active, focus: "Launch email draft 2"}
    - match: '^task list'
      out:
        tasks:
          - {id: c2d3e4f5-1000-4000-8000-000000000011, title: "Website preview deploy failing", status: open, owner: "bot:website", requester: "bot:engineering-lead", note: "", created: "2026-10-14T09:00:00Z", updated: "2026-10-14T09:00:00Z"}
          - {id: 91c2d7e4-5000-4000-8000-000000000003, title: "Site: update the press page", status: open, owner: "bot:website", requester: "human:dana", note: "", created: "2026-10-28T09:00:00Z", updated: "2026-10-28T09:00:00Z"}
        next_offset: null
    - match: '^bot pause website'
      out:
        ok: true
        bot: website
        state: paused
        open_tasks_kept: 2
        note: "Open tasks stay on its board and wait until it resumes."
  must:
    - '^bot pause website\b'
  must_not:
    - '^bot (archive|update|go-live|resume)(?! -h\b| --help)'
    - '^task (close|bulk close|create)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
  reply: |
    Pauses the Website bot as Dana and says so in one or two lines, including what the pause does as the tool reports it.
    It says how to undo it. It does not archive, change or close anything, and does not message the bot's team.

- id: jobs2-resume-bot
  group: jobs2
  prompt: "Resume the Website bot, the deploy is fixed now."
  hub:
    - match: '^bot status list'
      out:
        - {slug: website, display_name: Website, state: paused, focus: "Paused by its owner"}
        - {slug: copywriter, display_name: Copywriter, state: active, focus: "Launch email draft 2"}
      after:
        - {when: '^bot resume website', out: [{slug: website, display_name: Website, state: active, focus: "Active again after the resume"}, {slug: copywriter, display_name: Copywriter, state: active, focus: "Launch email draft 2"}]}
    - match: '^task list'
      out:
        tasks:
          - {id: c2d3e4f5-1000-4000-8000-000000000011, title: "Website preview deploy failing", status: open, owner: "bot:website", requester: "bot:engineering-lead", note: "", created: "2026-10-14T09:00:00Z", updated: "2026-10-14T09:00:00Z"}
        next_offset: null
    - match: '^bot resume website'
      out:
        ok: true
        bot: website
        state: active
  must:
    - '^bot resume website\b'
  must_not:
    - '^bot (pause|archive|update)(?! -h\b| --help)'
    - '^task (close|bulk close)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
  reply: |
    Resumes the Website bot and says so in one line. It does not say the deploy works, since the record does not show it, and
    it does not close the preview task that is still open on the record. It says how to undo it.

- id: jobs2-change-bot-model
  group: jobs2
  prompt: "Switch Copywriter to the bigger model for its drafts."
  hub:
    - match: '^settings find'
      out:
        matches:
          - {key: "bot.model", label: "Model", bot: "copywriter", value: "claude-haiku-5-5", options: ["claude-haiku-5-5", "claude-sonnet-5-5"], where: "Bot > Settings", who_may_change: "the owner"}
    - match: '^settings show'
      out:
        key: "bot.model"
        bot: "copywriter"
        value: "claude-haiku-5-5"
        who_may_change: "the owner"
    - match: '^settings set bot\.model'
      out:
        ok: true
        key: "bot.model"
        bot: "copywriter"
        value: "claude-sonnet-5-5"
    - match: '^bot model copywriter claude-sonnet-5-5'
      out:
        ok: true
        slug: copywriter
        model: "claude-sonnet-5-5"
    - match: '^bot model copywriter (?!claude-sonnet-5-5\b)\S+'
      out: "error: not one of this bot's models: claude-haiku-5-5, claude-sonnet-5-5"
      exit: 1
    - match: '^bot model copywriter\s*$'
      out:
        slug: copywriter
        model: "claude-haiku-5-5"
        models: ["claude-haiku-5-5", "claude-sonnet-5-5"]
  must:
    - '^(settings set \S*model\S* \S+ .*--bot copywriter|bot model copywriter claude-sonnet-5-5)\b'
  must_not:
    - '^(bot (archive|update)|task (close|bulk close))(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
    - '^settings set (?!\S*model)'
  reply: |
    Sets Copywriter's model to the bigger option the record lists (claude-sonnet-5-5), through its model setting, and says
    in one line what changed and how to undo it. It changes no other bot's model and no team default, and does not message
    Copywriter.

- id: jobs2-change-routine-time
  group: jobs2
  prompt: "Move Keeper's nightly tidy from 2am to 6am UTC."
  hub:
    - match: '^automation list'
      out:
        automations:
          - {id: auto_keeper_nightly, name: "Keeper nightly tidy", owner: "bot:keeper", trigger: "daily at 02:00 UTC", enabled: true, runs_7d: 7, creates: "one tidy summary a night"}
          - {id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: true, runs_7d: 24, creates: "one task per run, owner human:dana"}
        next: null
      after:
        - {when: '^automation update auto_keeper_nightly --file -', out: {automations: [{id: auto_keeper_nightly, name: "Keeper nightly tidy", owner: "bot:keeper", trigger: "daily at 06:00 UTC", enabled: true, runs_7d: 7, creates: "one tidy summary a night"}, {id: auto_health_pings, name: "Check health runner queue ping", owner: "bot:botops", trigger: "every 6 hours", enabled: true, runs_7d: 24, creates: "one task per run, owner human:dana"}], next: null}}
    - match: '^automation show auto_keeper_nightly'
      out:
        automation:
          id: auto_keeper_nightly
          name: "Keeper nightly tidy"
          owner: "bot:keeper"
          trigger: {kind: "schedule", cron: "0 2 * * *", tz: "UTC"}
          steps: [{action: "keeper.tidy"}]
          enabled: true
          version: 3
      after:
        - {when: '^automation update auto_keeper_nightly --file -', out: {automation: {id: auto_keeper_nightly, name: "Keeper nightly tidy", owner: "bot:keeper", trigger: {kind: "schedule", cron: "0 6 * * *", tz: "UTC"}, steps: [{action: "keeper.tidy"}], enabled: true, version: 4}}}
    - match: '^automation update auto_keeper_nightly'
      out:
        ok: true
        id: auto_keeper_nightly
        version: 4
        summary: "schedule set to 06:00 UTC via Assistant"
  must:
    - '^automation update auto_keeper_nightly\b.*--file\b'
  must_not:
    - '^automation (create|delete)(?! -h\b| --help)'
    - '^automation update auto_keeper_nightly .*--disable'
    - '^automation update auto_health_pings'
    - '^message send(?! -h\b| --help)'
  reply: |
    Changes only the schedule of Keeper's nightly tidy, to 06:00 UTC, through the automation's update, and leaves its steps
    and everything else as they were. It says so in one line and how to undo it. It does not disable it, does not touch the
    Check health automation, and does not message Keeper.

- id: jobs2-undo-automation-change
  group: jobs2
  prompt: "Undo the last change to the release-notes automation."
  hub:
    - match: '^automation list'
      out:
        automations:
          - {id: auto_docs_release, name: "Docs and release notes for each release", owner: "bot:technical-writer", trigger: "release published", enabled: false, runs_7d: 0, creates: "one task per release, owner human:dana"}
        next: null
    - match: '^automation versions auto_docs_release'
      out:
        versions:
          - {version: 5, at: "2026-11-02T14:20:00Z", by: "human:dana (via Assistant)", summary: "disabled at the owner's request via Assistant", enabled: false}
          - {version: 4, at: "2026-10-29T10:00:00Z", by: "bot:technical-writer", summary: "trigger: release published", enabled: true}
        next: null
    - match: '^automation show auto_docs_release'
      out:
        automation:
          id: auto_docs_release
          name: "Docs and release notes for each release"
          owner: "bot:technical-writer"
          trigger: {kind: "release.published"}
          enabled: false
          version: 5
      after:
        - {when: '^automation (restore auto_docs_release 4|update auto_docs_release --enable)', out: {automation: {id: auto_docs_release, name: "Docs and release notes for each release", owner: "bot:technical-writer", trigger: {kind: "release.published"}, enabled: true, version: 6}}}
    - match: '^automation restore auto_docs_release 4'
      out:
        ok: true
        id: auto_docs_release
        restored_version: 4
        version: 6
        enabled: true
  must:
    - '^automation versions auto_docs_release\b'
    - '^automation restore auto_docs_release 4\b'
  must_not:
    - '^automation update auto_docs_release .*--disable'
    - '^task (create|close|bulk close)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
  reply: |
    Restores the release-notes automation to version 4, the version before the disable, so it is on again. It says in one or
    two lines what it changed. It does not disable it again, does not close any task, and does not message the Technical
    Writer.

- id: jobs2-show-rules
  group: jobs2
  prompt: "Which rules are the bots following right now?"
  hub:
