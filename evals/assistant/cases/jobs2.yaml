  reply: |
    Lists the active rules from the record in a few plain lines, each with its text and who it applies to, for example the
    per-release docs rule and the test-ping rule. It adds, edits and retires nothing, and changes nothing.

- id: jobs2-add-rule
  group: jobs2
  prompt: "Add a rule: no bot files test pings into my queue, ever."
  hub:
    - match: '^rules list'
      out: {rules: [], next: null}
    - match: '^rules add'
      out:
        ok: true
        id: rule_1196
        status: active
        text: "No bot files test pings into the owner's queue."
        who: "human:dana"
  must:
    - '^rules add\b'
  must_not:
    - '^rules (edit|retire)(?! -h\b| --help)'
    - '^automation (update|delete)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
    - '^approval (approve|decline)(?! -h\b| --help)'
  reply: |
    Adds the rule as active, in Dana's words (no bot files test pings into her queue), and says so in one line with its id
    and how to undo it. It does not turn off any automation or message any bot. Short.

- id: jobs2-support-broken
  group: jobs2
  prompt: "The Ask panel won't load on my phone. It's broken, please fix it."
  hub:
    - match: '^health check'
      out:
        problems: []
        note: "No bot is down."
  must:
    - 'reply:#/support'
  must_not:
    - '^support (file|report|send)(?! -h\b| --help)'
    - '^message send(?! -h\b| --help)'
    - '^task create .*--owner (bot:)?botops'
  reply: |
    Points Dana to the Tico team for this bug: a link [Message the Tico team](#/support). It does not file a support report
    itself, does not promise a fix or a date, and does not claim it can fix the panel. One or two short lines, perhaps asking
    which phone and browser she used so the team can reproduce it.
