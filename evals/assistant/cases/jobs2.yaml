  group: jobs2
  prompt: "What is open on my board?"
  hub:
    - match: '^task list'
      out:
        tasks:
          - {id: 5b8e0d11-aa47-4c92-8e13-f0a6b7c9d2e4, title: "Spring launch: pricing page", status: open, owner: "human:dana", requester: "human:dana", note: "", created: "2026-10-20T10:05:00Z", updated: "2026-10-20T10:05:00Z"}
          - {id: a13f9e20-71cd-4b8e-a0f3-2c9d5e6b7a10, title: "Spring launch: launch email", status: doing, owner: "bot:copywriter", requester: "human:dana", note: "Draft 2 is in review.", created: "2026-10-14T15:20:00Z", updated: "2026-10-31T11:40:00Z"}
          - {id: 7d21c4a0-1000-4000-8000-000000000008, title: "Approve the v0.5.0 release publish", status: waiting, owner: "human:dana", requester: "bot:release-manager", note: "Ready for your publish approval.", created: "2026-10-29T09:00:00Z", updated: "2026-11-01T09:00:00Z"}
