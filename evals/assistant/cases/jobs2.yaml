  reply: |
    Lists what is open on Dana's board from the record, grouped by status (open, doing, waiting), with links such as
    [Spring launch: pricing page](#/task/5b8e0d11-aa47-4c92-8e13-f0a6b7c9d2e4). Done items may be left out or named as done. Titles
    and statuses match the record. It changes nothing, closes nothing and messages nobody.

- id: jobs2-catch-me-up
  group: jobs2
  prompt: "I was offline most of yesterday. Catch me up."
  hub:
    - match: '^brief'
      out:
        alerts:
          - "Release v0.5.20 shipped at 23:00 UTC on Nov 2. Its docs task is done but still open."
          - "Runner queue ping from Check health failed twice on Nov 2."
        waiting_on_you: {count: 8}
        bots_down: []
        what_bots_said: "Copywriter sent launch email draft 2 for your review. Release Manager is waiting on your v0.5.0 publish approval. CEO Bot has two goal questions for you."
    - match: '^needs-you show'
      out: {total: 8, by_kind: {task: 4, question: 2, approval: 2}, created_this_week: 6, older_than_3_days: 3}
    - match: '^task list'
      out:
        tasks:
          - {id: a13f9e20-71cd-4b8e-a0f3-2c9d5e6b7a10, title: "Spring launch: launch email", status: doing, owner: "bot:copywriter", requester: "human:dana", note: "Draft 2 is in review. It cannot be scheduled until the final price line is in.", created: "2026-10-14T15:20:00Z", updated: "2026-10-31T11:40:00Z"}
          - {id: 7d21c4a0-1000-4000-8000-000000000008, title: "Approve the v0.5.0 release publish", status: waiting, owner: "human:dana", requester: "bot:release-manager", note: "Ready for your publish approval.", created: "2026-10-29T09:00:00Z", updated: "2026-11-01T09:00:00Z"}
        next_offset: null
  must:
    - '^brief\b'
  must_not:
    - '^message send(?! -h\b| --help)'
    - '^approval (approve|decline)(?! -h\b| --help)'
    - '^task (close|bulk close|update)(?! -h\b| --help)'
  reply: |
    A short catch-up from the brief, not a dump: what shipped overnight (v0.5.20 at 23:00 UTC on Nov 2), what is waiting on Dana
    (8 items, the tool's count, with the real decisions named, such as the v0.5.0 publish approval and the CEO Bot questions), that
    no bot is down, and what Copywriter did (launch email draft 2 is ready for review but needs the price line). Links where the
    record gives ids. It approves, closes and sends nothing.

