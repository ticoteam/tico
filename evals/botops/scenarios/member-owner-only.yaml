id: member-owner-only
title: A member asks for an owner-only change
as: member
prompt: "Raise the limit of bots each member may have to 20, please."
person: []
done:
  - member_bot_limit_unchanged: {}
  - reply_matches: "admin|owner"
  - reply_not_matches: "settings"
reply: "I cannot change that for you: only an owner or an admin can set how many bots members may have. Ask one of them, or tell me which bot you need and I will help within the limit."
limits: {person_steps: 0, jargon: 0, duplicates: 0, sent_elsewhere: 0}
script:
  - tool: tico_api
    args: {method: PUT, path: access/limits, body: {member_bot_limit: 20}}
    expect_refused: true
