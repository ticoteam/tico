# Public desktop builds are always generic. Private company builds use company-app.yml.
# Updater signing and optional Apple signing secrets are shared by both workflows.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/app_release.py", ".github/workflows/app.yml"]
  workflow_dispatch:
  workflow_call:    # a version tag whose shell changed (release.yml); the server release never waits for it

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      TICO_HUB_URL: ""
      TICO_RUNNER_URL: ""
      TICO_ENV_SLUG: ""
      TICO_LOCAL_TOKEN_FILE: ""
      TICO_APP_NAME: Tico
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Shared with company-app.yml, which restores this cache (never saves into it): compiled dependencies and the
      # installed Tauri CLI, so only the app crate recompiles.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          shared-key: desktop
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - name: The app's version is the release's
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" -c "import json,os; p='app/tauri.conf.json'; d=json.load(open(p)); d['version']=os.environ['GITHUB_REF_NAME'].removeprefix('v'); json.dump(d, open(p,'w'), indent=2)"
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Apple signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Keychain output can contain private certificate subject names.
          exec >/dev/null 2>&1
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certificate.p12
      - name: Apple signing and notarization, only when the secrets exist
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty APPLE_SIGNING_IDENTITY makes the bundler try to sign with nothing; only a
          # real identity goes into the environment. Without one, tauri.conf.json signs ad hoc.
          [ -n "$IDENTITY" ] && echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          [ -n "$ID" ] && echo "APPLE_ID=$ID" >> "$GITHUB_ENV"
          [ -n "$PASSWORD" ] && echo "APPLE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          [ -n "$TEAM" ] && echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          true
      - name: Build
        working-directory: app
        shell: bash
        run: |
          # Signing tools can print private certificate subjects or identifiers.
          if ! cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} >/dev/null 2>&1; then
            echo '::error::Desktop build failed; verify build dependencies and signing configuration.'
            exit 1
          fi
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find app/target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: out/
          if-no-files-found: error
