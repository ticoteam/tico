# Runs one test command on a fresh RunsOn VM for a pushed commit, so a bot's full suite, browser tests, release
# check or cargo build doesn't load the computer its team shares. scripts/remote.py dispatches it and reads the
# result; scripts/heavy.sh sends a heavy command here when TICO_HEAVY_REMOTE=1. The VM holds no secrets.
name: Remote run
run-name: Remote run ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: The caller's id for this run (12 lowercase hex characters), to find it again
        required: true
        type: string
      ref:
        description: Full commit SHA to run; it must be pushed
        required: true
        type: string
      command:
        description: The command, run with bash from the repository root
        required: true
        type: string
      setup:
        description: python (venv), browser (also npm and Playwright), rust (also the Rust toolchain), all
        type: choice
        options: [python, browser, rust, all]
        default: python
      cpus:
        description: vCPUs of the VM
        type: choice
        options: ['4', '8', '16']
        default: '4'
      minutes:
        description: Time limit for the command
        type: string
        default: '30'

permissions:
  contents: read

jobs:
  run:
    # Spot: an interruption reruns the job automatically, and a test run can always be repeated.
    runs-on: runs-on=${{ github.run_id }}/runner=${{ inputs.cpus }}cpu-linux-x64/volume=80gb/extras=s3-cache
    timeout-minutes: 75
    env:
      ID: ${{ inputs.id }}
      REF: ${{ inputs.ref }}
      MINUTES: ${{ inputs.minutes }}
      SETUP: ${{ inputs.setup }}
      TICO_BROWSER_CHANNEL: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check the inputs
        run: |
          [[ "$ID" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::id must be 12 lowercase hex characters"; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit SHA"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 60 ] \
            || { echo "::error::minutes must be 1 to 60"; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - if: inputs.setup == 'browser' || inputs.setup == 'all'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - if: inputs.setup == 'browser' || inputs.setup == 'all'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        run: |
          case $SETUP in browser | all) suite=browser ;; *) suite=python ;; esac
          bash scripts/ci_install.sh "$suite"
          # A command written for a checkout (.venv/bin/python) finds the same interpreter here.
          ln -s "$RUNNER_TEMP/venv" .venv
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - if: inputs.setup == 'rust' || inputs.setup == 'all'
        name: Install Rust
        run: rustup toolchain install 1.92 --profile minimal && rustup default 1.92
      - name: Run the command
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          mkdir -p "$RUNNER_TEMP/remote"
          printf '%s\n' "$COMMAND" > "$RUNNER_TEMP/remote/command"
          set +e
          timeout --kill-after=30s "${MINUTES}m" bash -c "$COMMAND" 2>&1 | tee "$RUNNER_TEMP/remote/output.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/remote/exit-code"
          echo "Exit code $code"
          exit "$code"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: remote-run-${{ inputs.id }}
          path: ${{ runner.temp }}/remote
          retention-days: 3
          if-no-files-found: warn
