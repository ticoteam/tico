# Runs one test command on a fresh RunsOn VM for a pushed commit, so a bot's full suite, browser tests, release
# check or cargo build doesn't load the computer its team shares. scripts/remote.py dispatches it and reads the
# result; scripts/heavy.sh sends a heavy command here when TICO_HEAVY_REMOTE=1. The VM holds no secrets.
# TICO_CI_HOSTED=true runs it on a GitHub-hosted runner instead (4 vCPUs; docs/releasing.md#tests-on-a-pr).
name: Remote run
run-name: Remote run ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: The caller's id for this run (12 lowercase hex characters), to find it again
        required: true
        type: string
      ref:
        description: Full commit SHA to run; it must be pushed
        required: true
        type: string
      command:
        description: The command, run with bash from the repository root
        required: true
        type: string
      setup:
        description: python (venv), browser (also npm and Playwright), rust (also the Rust toolchain), all
        type: choice
        options: [python, browser, rust, all]
        default: python
      cpus:
        description: vCPUs of the VM
        type: choice
        options: ['4', '8', '16']
        default: '4'
      minutes:
        description: Time limit for the command
        type: string
        default: '30'

permissions:
  contents: read

jobs:
  run:
    # Spot: an interruption reruns the job automatically, and a test run can always be repeated. The family list gives
    # Spot more pools: with none, a 16-vCPU VM came almost only from c8i-flex/c8id, and ~1 in 4 was reclaimed (Nov 11).
    runs-on: ${{ vars.TICO_CI_HOSTED == 'true' && 'ubuntu-24.04' || format('runs-on={0}/runner={1}cpu-linux-x64/family=m8+c8+r8+m7+c7+r7/volume=80gb:gp3:125mbs:3000iops/extras=s3-cache', github.run_id, inputs.cpus) }}
    timeout-minutes: 75
    env:
      ID: ${{ inputs.id }}
      REF: ${{ inputs.ref }}
      MINUTES: ${{ inputs.minutes }}
      SETUP: ${{ inputs.setup }}
      TICO_BROWSER_CHANNEL: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check the inputs
        env:
          CPUS: ${{ inputs.cpus }}
          HOSTED: ${{ vars.TICO_CI_HOSTED }}
        run: |
          [[ "$ID" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::id must be 12 lowercase hex characters"; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit SHA"; exit 1; }
          [[ "$MINUTES" =~ ^[0-9]+$ ]] && [ "$MINUTES" -ge 1 ] && [ "$MINUTES" -le 60 ] \
            || { echo "::error::minutes must be 1 to 60"; exit 1; }
          # GitHub-hosted runners have 4 vCPUs; a larger VM needs RunsOn.
          if [ "$HOSTED" = true ] && [ "$CPUS" != 4 ]; then echo "::error::cpus must be 4 while TICO_CI_HOSTED is true"; exit 1; fi
      - name: Free disk on a GitHub-hosted runner (about 14 GB free there; RunsOn's volume is 30 GB)
        if: vars.TICO_CI_HOSTED == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      # Every setup compiles the UI's TypeScript (scripts/ci_install.sh).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
      - if: inputs.setup == 'browser' || inputs.setup == 'all'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install
        run: |
          case $SETUP in browser | all) suite=browser ;; *) suite=python ;; esac
          bash scripts/ci_install.sh "$suite"
          # A command written for a checkout (.venv/bin/python) finds the same interpreter here.
          ln -s "$RUNNER_TEMP/venv" .venv
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - if: inputs.setup == 'rust' || inputs.setup == 'all'
        name: Install Rust
        run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - name: Run the command
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          mkdir -p "$RUNNER_TEMP/remote"
          printf '%s\n' "$COMMAND" > "$RUNNER_TEMP/remote/command"
          set +e
          timeout --kill-after=30s "${MINUTES}m" bash -c "$COMMAND" 2>&1 | tee "$RUNNER_TEMP/remote/output.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/remote/exit-code"
          echo "Exit code $code"
          exit "$code"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remote-run-${{ inputs.id }}
          path: ${{ runner.temp }}/remote
          retention-days: 3
          if-no-files-found: warn
