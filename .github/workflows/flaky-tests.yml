# Flaky tests (scripts/flake_detect.py), daily and on demand. Read-only: it never pushes, opens a pull request or touches
# the queue. It reads the last days of PR-check runs and queue retries and lists, in the job summary, each test that
# failed and passed on the same commit (a retry, a rerun attempt, or two runs of one commit), with its commit and runs.
# It fails when it finds one: a red run is the signal. A flaky test is fixed at its root cause the same day, or deleted;
# nothing quarantines it. PR checks and the merge queue never read this job.
# GitHub-hosted runners (free for this public repository), like PR checks.
name: Flaky tests

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Days before today to read as well
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flaky-tests
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Tests that failed and passed on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '1' }}
        run: |
          set -o pipefail
          python3 scripts/flake_detect.py detect --repo "$GITHUB_REPOSITORY" --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
