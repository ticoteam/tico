# Flaky tests (scripts/flake_quarantine.py). Read-only: it never pushes, opens a pull request or touches the queue.
# - detect (daily, and on demand): reads the last days of PR-check runs and lists each test that failed and passed on the
#   same commit (a rerun attempt, or two runs of one commit). Each one not quarantined yet gets a proposed entry file,
#   uploaded as the quarantine-proposals artifact; the summary gives the command that writes them into a branch.
# - report (weekly, and on demand): lists every quarantined test with its age and ticket, and fails when one has been
#   quarantined longer than 14 days or an entry is malformed. It fails this job only: PR checks and the merge queue
#   never read it.
# GitHub-hosted runners (free for this public repository), like PR checks.
name: Flaky tests

on:
  schedule:
    - cron: '23 6 * * *'
    - cron: '47 15 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Days before today to read as well (detect)
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flaky-tests-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

jobs:
  detect:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 6 * * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Tests that failed and passed on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '1' }}
        run: |
          set -o pipefail
          python3 scripts/flake_quarantine.py detect --repo "$GITHUB_REPOSITORY" --days "$DAYS" --write "$RUNNER_TEMP/proposals" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-proposals
          path: ${{ runner.temp }}/proposals/
          retention-days: 14
          if-no-files-found: ignore

  report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 15 * * 1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Quarantined tests and their age
        run: |
          set -o pipefail
          python3 scripts/flake_quarantine.py report --max-age-days 14 | tee -a "$GITHUB_STEP_SUMMARY"
