# Builds the Tico images (server, runner and updater; linux/amd64 and linux/arm64) from a branch and publishes them to
# ghcr.io/ticoteam as edge, on a manual run. Release images are not built here: Release validation (ci.yml) builds and
# tests them, and release.yml points the version tags at those digests.
# Jobs run on on-demand RunsOn VMs in Tico's own AWS account, so a publish is never cut short by a Spot interruption.
name: Docker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [tico, tico-runner, tico-updater]
        platform: [amd64, arm64]
    # Each architecture builds natively: emulating npm and pip installs is slow and flaky.
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-${{ matrix.platform == 'arm64' && 'arm64' || 'x64' }}/spot=false/extras=s3-cache
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image == 'tico' && 'server' || matrix.image == 'tico-runner' && 'runner' || 'updater' }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            TICO_VERSION=edge
            TICO_COMMIT=${{ github.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          outputs: type=image,name=ghcr.io/ticoteam/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max
      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.image }}.digests-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/spot=false
    strategy:
      fail-fast: false
      matrix:
        image: [tico, tico-runner, tico-updater]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.image }}.digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch edge tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/ticoteam/${{ matrix.image }}
        run: |
          tags=(-t "$IMAGE:edge")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          # The registry sometimes drops the manifest upload; retry instead of failing the publish.
          for attempt in 1 2 3 4; do
            timeout 120 docker buildx imagetools create "${tags[@]}" "${sources[@]}" && exit 0
            echo "imagetools create failed (attempt $attempt); retrying"; sleep $((attempt * 5))
          done
          exit 1
      - run: docker buildx imagetools inspect "ghcr.io/ticoteam/${{ matrix.image }}:edge"
