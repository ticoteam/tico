# Stale PR keeper (scripts/stale_pr_keeper.py), hourly and on demand. For each open pull request to main:
# - dropped by the merge queue for failed checks where every failure is a quarantined test (ci/quarantine/) or a crashed
#   pytest-xdist worker: re-enqueued (`gh pr merge N`), at most once per head sha;
# - dropped for any other failure: one comment per head sha naming the failing test;
# - conflicting with main and its own checks red: labelled needs-main-merge (removed once it merges cleanly).
# It closes nothing and never merges main into a branch. The run summary lists pull requests with no push in 7 days.
# GitHub calls stay few (one rate limit covers everything): one GraphQL page per 50 open pull requests, and the queue
# run, its jobs and its failed jobs' logs only for a pull request it has not commented on for its head yet.
# Enqueueing needs a GitHub App or personal token (GitHub refuses the workflow's own token for the merge queue): the
# STALE_PR_KEEPER_TOKEN secret, with pull requests and contents write. Without it the keeper still comments and labels,
# and a flake's comment says to re-enqueue by hand.
name: Stale PR keeper

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what it would do; change nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write # comments and labels
  issues: write # comments and labels through the issues API
  actions: read # queue runs, jobs and logs
  checks: read # check suites and the status rollup of each head
  statuses: read # the status rollup of each head

concurrency:
  group: stale-pr-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Bring back pull requests the queue dropped for a flake
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_TOKEN: ${{ secrets.STALE_PR_KEEPER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -o pipefail
          args=(--repo "$GITHUB_REPOSITORY")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 scripts/stale_pr_keeper.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
