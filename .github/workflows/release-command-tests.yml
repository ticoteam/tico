name: Release command tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['tools/release-command/**', 'scripts/release', '.github/workflows/release-command-tests.yml']
  push:
    branches: [main]
    paths: ['tools/release-command/**', 'scripts/release', '.github/workflows/release-command-tests.yml']
permissions:
  contents: read
jobs:
  command:
    # A draft pull request runs nothing; marking it ready for review runs these tests. Push and merge_group are unchanged.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.92 --profile minimal
      - name: Test release refusals and exact-commit tagging with synthetic git and Actions
        run: cargo +1.92 test --locked --manifest-path tools/release-command/Cargo.toml
