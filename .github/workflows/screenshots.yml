# The screenshots in docs/images come from demo mode (docs/demo.md). They are taken
# again by hand (Actions tab, Run workflow), and a pull request offers the new pictures. The script fails, rather than
# saving a bad picture, on any console error, error banner or icon that did not load.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Take the screenshots from the demo
        run: TICO_BROWSER_CHANNEL= npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images
      - name: Open a pull request with the new images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/images && [ -z "$(git ls-files --others --exclude-standard docs/images)" ]; then
            echo "The screenshots have not changed."; exit 0
          fi
          branch="screenshots/${GITHUB_REF_NAME:-manual}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/images
          git commit -m "Refresh the screenshots for ${GITHUB_REF_NAME:-main}"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh the screenshots for ${GITHUB_REF_NAME:-main}" \
            --body "Taken from demo mode by scripts/screenshots. Nothing else changed." || true
