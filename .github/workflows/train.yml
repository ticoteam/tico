# Tico's own release windows (docs/releasing.md#release-windows). Windows open at 07:30, 11:00, 14:00 and 20:30 Los
# Angeles time on weekdays, and at 07:30 and 15:00 on weekends, and stay open until a vX.Y.Z release is published after
# them.
# Nothing is stored: each run works the window out from GitHub (scripts/release_train.py).
#   - At the open (schedule), on a manual run and at the backstop: promote the canary's (Tico Team) release to stable
#     (TIDY) once it is approved, not held and healthy (docs/releasing.md#approval).
#   - While open, on the open, on every push to main, whenever a Release validation run finishes, and every 20 minutes as
#     a backstop for a missed event (at :05, :25 and :45; it never opens a window): ship the first green
#     candidate (tag it, publish it with release.yml as not latest, update the canary, then mark it latest), which
#     closes the window; otherwise, when no validation is running and main's head has none yet, validate main's head
#     as the next patch (ci.yml).
#   - A red or cancelled candidate keeps the window open and goes on the one `release-train` issue, once; a window that
#     ships closes it. A tag whose release did not publish gets its Release workflow once more after 30 minutes.
#   - A candidate that ships also gets its before and after pictures on its approval issue (release-shots.yml, in the
#     shots and approval-shots jobs). Those run after the window: nothing in the window waits for them, and approval stays
#     a person's (docs/releasing.md#approval).
# The guard is read-only and outside the concurrency group, so a push with nothing to do costs one small GitHub-hosted
# job and never queues behind, or displaces, a hotfix. Every job that acts (window here, hotfix in hotfix.yml) shares the
# `release-train` group, so a push and a finished run can never both start a build or a release.
# Schedules, pushes and finished runs act only when the repository variable RELEASE_TRAINS is `on`; a manual run always acts.
name: Release window
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release window (manual, {0})', github.actor)
  || github.event_name == 'schedule' && github.event.schedule == '5-59/20 * * * *' && 'Release window check'
  || github.event_name == 'schedule' && format('Release window (scheduled {0})', github.event.schedule)
  || github.event_name == 'workflow_run' && format('Release window: {0}', github.event.workflow_run.display_title)
  || format('Release window: push {0}', github.sha) }}

on:
  schedule:
    # Every UTC time a window starts at, under PDT or PST. A cron that is not a real window's start (the off-season
    # twin of another) does what a push does; scripts/release_train.py decides which ones open a window.
    - cron: '30 3 * * *'         # 20:30 PDT, the evening before
    - cron: '30 4 * * *'         # 20:30 PST, the evening before
    - cron: '30 14 * * *'        # 07:30 PDT
    - cron: '30 15 * * *'        # 07:30 PST
    - cron: '0 18 * * *'         # 11:00 PDT
    - cron: '0 19 * * *'         # 11:00 PST
    - cron: '0 21 * * *'         # 14:00 PDT
    - cron: '0 22 * * *'         # 14:00 PST, and 15:00 PDT at weekends
    - cron: '0 23 * * *'         # 15:00 PST at weekends
    - cron: '5-59/20 * * * *'    # backstop: a step in an open window if an event was missed; never opens one
  push:
    branches: [main]
  workflow_run:
    workflows: [Release validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read     # validation and hotfix runs
      contents: read    # tags, releases, main
      issues: read      # whether a red candidate is already on the release-train issue
    outputs:
      go: ${{ steps.guard.outputs.go }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release_train.py
            scripts/release_notes.py
            templates/catalog/release-notes/software/rollout.py
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TRAINS: ${{ vars.RELEASE_TRAINS }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/release_train.py guard

  window:
    needs: guard
    if: needs.guard.outputs.go == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    concurrency:
      group: release-train
      cancel-in-progress: false
    permissions:
      actions: write    # dispatches Release validation, and release.yml on the new tag
      contents: write   # creates the version tag, marks the release latest
      issues: write     # the release-train issue, and each candidate's approval issue
      packages: write   # points the images' latest tags at the release once the canary is healthy
      pull-requests: read  # the merged pull requests in a candidate's release notes
      checks: read      # their checks
    outputs:
      shipped: ${{ steps.window.outputs.shipped }}  # 'true' when the canary runs a candidate and its approval issue is open
      version: ${{ steps.window.outputs.version }}
      sha: ${{ steps.window.outputs.sha }}
      base: ${{ steps.window.outputs.base }}  # the release stable runs: what the candidate's pictures compare with
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CANARY_URL: ${{ vars.CANARY_URL }}
      STABLE_URL: ${{ vars.STABLE_URL }}
      CANARY_UPDATE_KEY: ${{ secrets.CANARY_UPDATE_KEY }}
      STABLE_UPDATE_KEY: ${{ secrets.STABLE_UPDATE_KEY }}
      RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_TITLE: ${{ github.event.workflow_run.display_title }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release_train.py
            scripts/release_notes.py
            templates/catalog/release-notes/software/rollout.py
          sparse-checkout-cone-mode: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: window
        name: Promote the approved release, then ship the first green candidate or validate main
        run: python3 scripts/release_train.py window
      # The job reports its own outcome; this covers a job that died or timed out before it could.
      - name: Report a window step that did not finish
        if: always() && steps.checkout.outcome == 'success' && steps.window.outputs.reported != 'true'
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          import release_train as t
          gh = t.GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"])
          t.report(gh, False, ["The release window job ended before it reported (canceled, timed out or crashed); see the run log."])
          EOF

  # A shipped candidate's before and after pictures (release-shots.yml). They run after the window, outside its lane: the
  # canary is updated before they start, and no job of the window needs them.
  shots:
    needs: window
    if: always() && needs.window.outputs.shipped == 'true'
    permissions:
      contents: write   # the release shots push their pictures to the release-evidence branch
    uses: ./.github/workflows/release-shots.yml
    with:
      base: ${{ needs.window.outputs.base }}
      head: ${{ needs.window.outputs.sha }}
      version: ${{ needs.window.outputs.version }}

  approval-shots:
    needs: [window, shots]
    if: always() && needs.window.outputs.shipped == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read    # downloads the shots artifact of this run
      contents: read   # the release scripts (sparse checkout)
      issues: write    # the candidate's approval issue
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release_train.py
            scripts/release_notes.py
            templates/catalog/release-notes/software/rollout.py
          sparse-checkout-cone-mode: false
      # With no artifact (the shots job ended before it uploaded), the download fails and the issue says the pictures
      # could not be made, with this run's URL.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-shots-${{ needs.window.outputs.version }}
          path: ${{ runner.temp }}/release-shots
      - name: Put the pictures on the approval issue
        env:
          VERSION: ${{ needs.window.outputs.version }}
        run: python3 scripts/release_train.py shots-into-approval "$VERSION" "$RUNNER_TEMP/release-shots/release-shots.md"
