# Tico's own release train (docs/releasing.md#the-release-train). There are no release windows: a candidate is cut
# whenever main has merged work past the newest release and no candidate is in flight, at any hour. A release goes out
# only when main moved since the newest release and the candidate is green; no new commit means no release.
# Nothing is stored: each run works the state out from GitHub (scripts/release_train.py).
#   - On every run of the train job: first promote the canary's (Tico Team) release to stable (TIDY) once it is approved,
#     not held and healthy (docs/releasing.md#approval). With RELEASE_NEEDS_PERSON off, a release whose notes list no
#     High risk item is approved automatically; otherwise a person approves it.
#   - On every push to main, whenever a Release validation run finishes, on a manual run, and every 20 minutes as a
#     backstop for a missed event (at :05, :25 and :45): ship the first green candidate (tag it, publish it with
#     release.yml as not latest, update the canary, then mark it latest); otherwise, when no validation is running and
#     main's head has none yet, validate main's head as the next patch (ci.yml).
#   - A red or cancelled candidate goes on the one `release-train` issue, once; the next release that ships closes it.
#     A tag whose release did not publish gets its Release workflow once more after 30 minutes.
#   - A candidate that ships also gets its before and after pictures on its approval issue (release-shots.yml, in the
#     shots and approval-shots jobs). Those run after the train job: nothing in it waits for them, and neither does
#     approval.
# The guard is read-only and outside the concurrency group, so a push with nothing to do costs one small GitHub-hosted
# job and never queues behind, or displaces, a hotfix. Every job that acts (train here, hotfix in hotfix.yml) shares the
# `release-train` group, so a push and a finished run can never both start a build or a release.
# Schedules, pushes and finished runs act only when the repository variable RELEASE_TRAINS is `on`; a manual run always acts.
name: Release train
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Release train (manual, {0})', github.actor)
  || github.event_name == 'schedule' && 'Release train check'
  || github.event_name == 'workflow_run' && format('Release train: {0}', github.event.workflow_run.display_title)
  || format('Release train: push {0}', github.sha) }}

on:
  schedule:
    - cron: '5-59/20 * * * *'    # backstop: a step if an event was missed, and a release waiting for stable or latest
  push:
    branches: [main]
  workflow_run:
    workflows: [Release validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read     # validation and hotfix runs
      contents: read    # tags, releases, main
      issues: read      # whether a red candidate is already on the release-train issue
    outputs:
      go: ${{ steps.guard.outputs.go }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release_train.py
            scripts/release_notes.py
            scripts/release_increment.py
            scripts/pr_checks.py
            templates/catalog/release-notes/software/rollout.py
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TRAINS: ${{ vars.RELEASE_TRAINS }}
          RELEASE_NEEDS_PERSON: ${{ vars.RELEASE_NEEDS_PERSON }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/release_train.py guard

  train:
    needs: guard
    if: needs.guard.outputs.go == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    concurrency:
      group: release-train
      cancel-in-progress: false
    permissions:
      actions: write    # dispatches Release validation, and release.yml on the new tag
      contents: write   # creates the version tag, marks the release latest
      issues: write     # the release-train issue, and each candidate's approval issue
      packages: write   # points the images' latest tags at the release once the canary is healthy
      pull-requests: read  # the merged pull requests in a candidate's release notes
      checks: read      # their checks
    outputs:
      shipped: ${{ steps.step.outputs.shipped }}  # 'true' when the canary runs a candidate and its approval issue is open
      version: ${{ steps.step.outputs.version }}
      sha: ${{ steps.step.outputs.sha }}
      base: ${{ steps.step.outputs.base }}  # the release stable runs: what the candidate's pictures compare with
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CANARY_URL: ${{ vars.CANARY_URL }}
      STABLE_URL: ${{ vars.STABLE_URL }}
      CANARY_UPDATE_KEY: ${{ secrets.CANARY_UPDATE_KEY }}
      STABLE_UPDATE_KEY: ${{ secrets.STABLE_UPDATE_KEY }}
      RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
      RELEASE_NEEDS_PERSON: ${{ vars.RELEASE_NEEDS_PERSON }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_TITLE: ${{ github.event.workflow_run.display_title }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The whole history and tree at main: an incremental validation's plan selects the changes since its anchor
          # (scripts/release_increment.py), with the same selection the merge queue uses.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: step
        name: Promote the approved release, then ship the first green candidate or validate main
        run: python3 scripts/release_train.py step
      # The job reports its own outcome; this covers a job that died or timed out before it could.
      - name: Report a train step that did not finish
        if: always() && steps.checkout.outcome == 'success' && steps.step.outputs.reported != 'true'
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          import release_train as t
          gh = t.GitHub(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"])
          t.report(gh, False, ["The release train job ended before it reported (canceled, timed out or crashed); see the run log."])
          EOF

  # A shipped candidate's before and after pictures (release-shots.yml). They run after the train job, outside its lane:
  # the canary is updated before they start, and no train job needs them.
  shots:
    needs: train
    if: always() && needs.train.outputs.shipped == 'true'
    permissions:
      contents: write   # the release shots push their pictures to the release-evidence branch
    uses: ./.github/workflows/release-shots.yml
    with:
      base: ${{ needs.train.outputs.base }}
      head: ${{ needs.train.outputs.sha }}
      version: ${{ needs.train.outputs.version }}

  approval-shots:
    needs: [train, shots]
    if: always() && needs.train.outputs.shipped == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read    # downloads the shots artifact of this run
      contents: read   # the release scripts (sparse checkout)
      issues: write    # the candidate's approval issue
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release_train.py
            scripts/release_notes.py
            scripts/release_increment.py
            scripts/pr_checks.py
            templates/catalog/release-notes/software/rollout.py
          sparse-checkout-cone-mode: false
      # With no artifact (the shots job ended before it uploaded), the download fails and the issue says the pictures
      # could not be made, with this run's URL.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: release-shots-${{ needs.train.outputs.version }}
          path: ${{ runner.temp }}/release-shots
      - name: Put the pictures on the approval issue
        env:
          VERSION: ${{ needs.train.outputs.version }}
        run: python3 scripts/release_train.py shots-into-approval "$VERSION" "$RUNNER_TEMP/release-shots/release-shots.md"
