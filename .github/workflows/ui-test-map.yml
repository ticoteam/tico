name: UI test map

# Measures which browser scripts run each UI file's code, and publishes the map to the ci/ui-test-map branch as its only
# file, ui-test-map.json. Weekly, and on demand from main. The map is data: this workflow writes it and nobody edits it by
# hand. Nothing is committed to main and no pull request is opened: the PR checks fetch that one file (pr-checks.yml).
# Measuring runs on GitHub-hosted runners (the repo is public), so it does not wait on RunsOn.
#
# The push trigger is temporary: it measures the branch that adds this workflow, before the workflow is on main, where a
# dispatch can find it. Remove it in the change that merges.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [chris/rel-ui-test-map]

permissions:
  contents: read

concurrency:
  group: ui-test-map
  cancel-in-progress: false

jobs:
  measure:
    name: measure shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh browser-measure
      - name: Run this shard's browser scripts under the coverage hook
        timeout-minutes: 60
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
          TICO_UI_BUNDLE: off
          TICO_UI_COVERAGE: ${{ runner.temp }}/measure/coverage
          TICO_UI_TIMINGS: ${{ runner.temp }}/measure/timings-${{ matrix.shard }}.json
          TICO_UI_SCRIPT_TIMEOUT: '300'
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/ui-coverage.cjs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure"
          mapfile -t names < <(python3 scripts/ui_test_map.py shard "$SHARD" 8)
          node scripts/ui-tests.cjs -j 2 "${names[@]}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-${{ matrix.shard }}
          path: ${{ runner.temp }}/measure
          retention-days: 7
          if-no-files-found: warn

  boot:
    name: boot baseline (the app loaded once, nothing else)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh browser-measure
      - name: Load the app once under the coverage hook
        timeout-minutes: 10
        env:
          TICO_UI_BUNDLE: off
          TICO_UI_COVERAGE: ${{ runner.temp }}/measure/coverage
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/ui-coverage.cjs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/measure"
          node --require "$GITHUB_WORKSPACE/ui/tests/support/browser.cjs" scripts/ui-boot-baseline.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-boot
          path: ${{ runner.temp }}/measure
          retention-days: 7
          if-no-files-found: error

  build:
    name: build the map from the measured run
    needs: [measure, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measure-*
          path: ${{ runner.temp }}/measured
          merge-multiple: true
      - name: Build the map (fails if the boot baseline or a browser script has no coverage record)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/map"
          python3 scripts/ui_test_map.py build --measured "$RUNNER_TEMP/measured" \
            --out "$RUNNER_TEMP/map/ui-test-map.json" --main-sha "$MAIN_SHA" --run "$RUN_URL" \
            --summary "$RUNNER_TEMP/map/summary.md"
      - name: Check the map's schema
        run: python3 scripts/ui_test_map.py check --map "$RUNNER_TEMP/map/ui-test-map.json"
      - name: Summary
        run: cat "$RUNNER_TEMP/map/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-map
          path: ${{ runner.temp }}/map
          retention-days: 30

  publish:
    name: publish the map to ci/ui-test-map
    needs: build
    # Only the weekly run and a dispatch from main publish. A branch run measures and stops here.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MAIN_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-test-map
          path: ${{ runner.temp }}/map
      - name: Check the map's schema before it leaves this run
        run: python3 scripts/ui_test_map.py check --map "$RUNNER_TEMP/map/ui-test-map.json"
      - name: Publish the map as the only file on ci/ui-test-map (force-pushed)
        run: |
          set -euo pipefail
          blob=$(git hash-object -w "$RUNNER_TEMP/map/ui-test-map.json")
          tree=$(printf '100644 blob %s\tui-test-map.json\n' "$blob" | git mktree)
          message=$(printf 'UI test map from main %s\n\nMeasured by %s\n' "$MAIN_SHA" "$RUN_URL")
          commit=$(GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL="$BOT_EMAIL" \
            GIT_COMMITTER_NAME='github-actions[bot]' GIT_COMMITTER_EMAIL="$BOT_EMAIL" \
            git commit-tree "$tree" -m "$message")
          git push --force origin "$commit:refs/heads/ci/ui-test-map"
          echo "Published $commit to ci/ui-test-map (main $MAIN_SHA)" >> "$GITHUB_STEP_SUMMARY"
