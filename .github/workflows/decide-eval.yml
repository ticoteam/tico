name: Decide Low evaluation

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Pinned Gateway version for the current Decide Low
        type: string
        default: tico-decide-low-1.1
      candidate:
        description: Dated OpenRouter Decisions model ID (empty runs the baseline alone)
        type: string
      endpoint:
        description: Paid OpenRouter endpoint slug for the candidate
        type: string

permissions:
  contents: read

jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Compare pinned decision models
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          ENDPOINT: ${{ inputs.endpoint }}
          TICO_GATEWAY_KEY: ${{ secrets.TICO_GATEWAY_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.DECIDE_EVAL_OPENROUTER_KEY }}
        run: |
          set -o pipefail
          args=()
          if [ -n "$CANDIDATE$ENDPOINT" ]; then args+=(--candidate "$CANDIDATE" --endpoint "$ENDPOINT"); fi
          python -m evals.pipeline_judge.run --models "$BASELINE" "${args[@]}" --out decide-results | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: decide-eval
          path: decide-results/
