# Keeps the main-branch caches PR checks (pr-checks.yml) restore from fresh, now that main pushes run no PR checks.
# It runs on GitHub-hosted runners, as PR checks do, so the caches it saves are GitHub's own: a pull request reads its
# own caches and main's; caches it saves stay with it. GitHub evicts a cache unused for seven days, and a repository's
# caches share 10 GB, so the least recently used go first. Each job here first looks its keys up without downloading
# anything: a hit ends the job in about a minute, and only a missing key (a dependency, toolchain or runner-image change,
# or an evicted entry) builds and saves it. Every key and path below must match its step in pr-checks.yml
# (scripts/tests/test_pr_checks.py).
name: PR caches

on:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths:
      - backend/requirements*.txt
      - package-lock.json
      - scripts/ci_install.sh
      - scripts/playwright-system-packages.json
      - scripts/rust_checks.sh
      - scripts/pinned_tool.sh
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - .github/workflows/pr-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-browser:
    # pip, the installed venv, npm, the Playwright browsers and the browser system packages: what a browser shard's
    # Install fills.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk only when under 30 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 30
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/venv
          key: venv-ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements-dev.txt', 'scripts/ci_install.sh') }}
          lookup-only: true
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          lookup-only: true
      - name: Runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: system
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-system
          key: playwright-system-ubuntu24-x64-${{ steps.image.outputs.version }}-${{ hashFiles('package-lock.json', 'scripts/ci_install.sh', 'scripts/playwright-system-packages.json') }}
          lookup-only: true
      - name: Use the canonical Ubuntu package mirror
        if: steps.python.outputs.cache-hit != 'true' || steps.venv.outputs.cache-hit != 'true' || steps.node.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true' || steps.system.outputs.cache-hit != 'true'
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Fill the missing caches (saved when the job ends)
        if: steps.python.outputs.cache-hit != 'true' || steps.venv.outputs.cache-hit != 'true' || steps.node.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true' || steps.system.outputs.cache-hit != 'true'
        timeout-minutes: 11
        run: bash scripts/ci_install.sh browser-cache

  pinned-tools:
    # shellcheck and actionlint (scripts/pinned_tool.sh): what the static checks job and a queue group's plan job restore.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tico/tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pinned_tool.sh') }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/pinned_tool.sh shellcheck --version && bash scripts/pinned_tool.sh actionlint -version

  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk only when under 30 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 30
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runner-rs -> target
            relay-rs -> target
            tools/release-command -> target
            tools/trust-list-check -> target
          shared-key: pr-rust-lint
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/rust_checks.sh

  desktop-app:
    # The desktop app's compiled dependencies: what the desktop app PR job's clippy and test steps restore.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk only when under 40 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 40
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          shared-key: pr-desktop
          cache-on-failure: true
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Rust 1.92.0 and the Linux build dependencies (as the desktop app PR job installs them)
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: app
        # Builds what the PR job's clippy and test steps build, so their caches are saved.
        run: cargo +1.92.0 clippy --locked --all-targets && cargo +1.92.0 test --locked --no-run

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk only when under 30 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 30
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner-rs -> target
          shared-key: pr-conformance
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: runner-rs
        # The conformance tests build the release runner (runner_support/engine.py) and run cargo test.
        run: cargo build --release --locked && cargo test --locked --no-run
