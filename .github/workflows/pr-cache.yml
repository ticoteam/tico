# Keeps the main-branch caches PR checks (pr-checks.yml) restore from fresh, now that main pushes run no PR checks.
# A pull request reads its own caches and main's; caches it saves stay with it. GitHub evicts a cache unused for seven
# days, and the RunsOn cache (extras=s3-cache) follows the same branch rules and expires every entry ten days after it
# is saved, however often it is read. Each job here first looks its keys up without downloading anything: a hit ends
# the job in about a minute, and only a missing key (a dependency, toolchain or runner-image change, or an expired entry)
# builds and saves it. Every key and path below must match its step in pr-checks.yml (scripts/tests/test_pr_checks.py).
name: PR caches

on:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths:
      - backend/requirements*.txt
      - package-lock.json
      - scripts/ci_install.sh
      - scripts/playwright-system-packages.json
      - scripts/rust_checks.sh
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - .github/workflows/pr-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-browser:
    # pip, npm, the Playwright browsers and the browser system packages: what a browser shard's Install fills.
    runs-on: runs-on=${{ github.run_id }}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-x64/extras=s3-cache
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          lookup-only: true
      - name: Runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: system
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/playwright-system
          key: playwright-system-ubuntu24-x64-${{ steps.image.outputs.version }}-${{ hashFiles('package-lock.json', 'scripts/ci_install.sh', 'scripts/playwright-system-packages.json') }}
          lookup-only: true
      - name: Use the canonical Ubuntu package mirror
        if: steps.python.outputs.cache-hit != 'true' || steps.node.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true' || steps.system.outputs.cache-hit != 'true'
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Fill the missing caches (saved when the job ends)
        if: steps.python.outputs.cache-hit != 'true' || steps.node.outputs.cache-hit != 'true' || steps.browsers.outputs.cache-hit != 'true' || steps.system.outputs.cache-hit != 'true'
        timeout-minutes: 11
        run: bash scripts/ci_install.sh browser-cache

  rust-lint:
    runs-on: runs-on=${{ github.run_id }}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-x64/extras=s3-cache
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runner-rs -> target
            relay-rs -> target
            tools/release-command -> target
            tools/trust-list-check -> target
          shared-key: pr-rust-lint
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/rust_checks.sh

  conformance:
    runs-on: runs-on=${{ github.run_id }}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-x64/extras=s3-cache
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner-rs -> target
          shared-key: pr-conformance
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: runner-rs
        # The conformance tests build the release runner (runner_support/engine.py) and run cargo test.
        run: cargo build --release --locked && cargo test --locked --no-run

  recorder:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: recorder
          shared-key: pr-recorder
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: recorder
        run: cargo test --locked --features desktop,cli --no-run
