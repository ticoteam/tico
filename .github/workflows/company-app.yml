# Company values come only from a private repository secret. This workflow never publishes to GitHub.
name: Company desktop app
on:
  workflow_call:
    inputs:
      company:
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    # Do not cache branded binaries into caches a generic public build could restore (the cache step only restores).
    runs-on: ${{ matrix.os }}
    env:
      TICO_COMPANY_APPS: ${{ secrets.TICO_COMPANY_APPS }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Artifact encryption dependency
        shell: bash
        run: python -m pip install "$(grep '^cryptography==' backend/requirements.txt)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Restores the generic desktop build's cache (dependencies and the Tauri CLI) and never saves: branded
      # build output must not reach a cache a public build could restore. The app crate itself always recompiles,
      # since its build script reruns when the company identity in the environment changes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app
          shared-key: desktop
          save-if: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Configure private company app
        shell: bash
        run: python scripts/company_apps.py configure --company '${{ inputs.company }}'
      - name: Apple signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Keychain output can contain certificate subject names.
          exec >/dev/null 2>&1
          [ -n "$APPLE_CERTIFICATE" ] || exit 0
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm certificate.p12
      - name: Apple signing and notarization, only when the secrets exist
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An empty APPLE_SIGNING_IDENTITY makes the bundler try to sign with nothing; only a
          # real identity goes into the environment. Without one, tauri.conf.json signs ad hoc.
          [ -n "$IDENTITY" ] && echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          [ -n "$ID" ] && echo "APPLE_ID=$ID" >> "$GITHUB_ENV"
          [ -n "$PASSWORD" ] && echo "APPLE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          [ -n "$TEAM" ] && echo "APPLE_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          true
      - name: Build private company app
        shell: bash
        run: python scripts/company_apps.py build --company '${{ inputs.company }}' --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Encrypt company bundles
        shell: bash
        run: python scripts/company_apps.py pack --company '${{ inputs.company }}' --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: company-${{ inputs.company }}-${{ matrix.target }}
          path: out/bundles.enc
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TICO_COMPANY_APPS: ${{ secrets.TICO_COMPANY_APPS }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Configure and mask private publish values
        run: python scripts/company_apps.py configure --publishing --company '${{ inputs.company }}'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: company-${{ inputs.company }}-*
          path: encrypted
      - name: Artifact encryption dependency
        run: python -m pip install "$(grep '^cryptography==' backend/requirements.txt)"
      - name: Decrypt this company's bundles
        run: python scripts/company_apps.py unpack --company '${{ inputs.company }}'
      - name: Assume this company's publisher role
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ env.COMPANY_ROLE }}
          aws-region: us-west-2
          mask-aws-account-id: true
          role-session-name: tico-company-${{ github.run_id }}
      - run: pip install "$(grep '^boto3==' backend/requirements.txt)"
      - name: Publish company bundles and updater manifest
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: python scripts/company_apps.py publish --company '${{ inputs.company }}'
      - name: Report company publication failure
        if: failure()
        run: echo '::error::Company publication failed for ${{ inputs.company }}; public release and other companies continue.'
