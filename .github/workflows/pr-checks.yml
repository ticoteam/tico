# Read-only PR checks. Main keeps the full default suite; Release validation is independent.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  # A newer push to a pull request cancels its superseded run. Each main push has its own group and always
  # completes, so every main commit gets full-suite results and timings. Release validation never cancels a gate.
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      caddy: ${{ steps.plan.outputs.caddy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Restore measured timings from the latest successful full main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-timings
          run=$(gh run list --workflow pr-checks.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || run=''
          if [ -n "$run" ]; then
            gh run download "$run" --name pr-python-timings --dir previous-timings || echo "No measured timings yet; use collected counts this run"
          fi
      - name: Select affected tests and four measured Python groups
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py plan --event "$EVENT" --base "$BASE" --timings previous-timings/durations.json'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-check-plan
          path: ci-plan.json
          retention-days: 7
      - name: Selection receipt
        run: |
          { echo '### Test selection'; echo '```json'; cat ci-plan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  tests:
    needs: plan
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-check-plan
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: matrix.suite == 'browser'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: matrix.suite == 'browser'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: matrix.suite == 'browser'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/playwright-system
          key: playwright-system-ubuntu24-x64-${{ steps.image.outputs.version }}-${{ hashFiles('package-lock.json', 'scripts/ci_install.sh', 'scripts/playwright-system-packages.json') }}
      - name: Use the canonical Ubuntu package mirror on every shard
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci_install.sh "$SUITE"
      - if: matrix.suite == 'conformance'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner-rs -> target
          shared-key: pr-conformance
      - name: Run selected tests
        env:
          SUITE: ${{ matrix.suite }}
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" "$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py run "$SUITE"
      - if: always() && startsWith(matrix.suite, 'python-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.suite }}
          path: ci-results/*.xml
          retention-days: 7
          if-no-files-found: warn

  caddy-linux:
    needs: plan
    if: needs.plan.outputs.caddy == 'true'
    name: caddy-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_CADDY_CONTAINER_QA: '1'
      TICO_CADDY_EXPECTED_ARCH: ${{ matrix.arch }}
      TICO_CADDY_TEST_IMAGE: tico-caddy-qa:current
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build this source's server image locally; never publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: tico-caddy-qa:current
          build-args: |
            TICO_VERSION=dev
            TICO_COMMIT=${{ github.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=tico-${{ matrix.arch }}
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Actual pinned Linux Caddy runtime and lifecycle
        env:
          TICO_CADDY_TEST_OUTPUT: ${{ runner.temp }}/caddy-runtime-evidence
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q -m slow -n 0 backend/tests/test_caddy_container.py'
      - name: Preserve fixture receipts and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/caddy-runtime-evidence/
          if-no-files-found: warn

  timings:
    name: PR job timings
    if: always()
    needs: [plan, tests, caddy-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: results-python-*
          path: ci-results
          merge-multiple: true
      - name: Per-job timings linked from the PR check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | python3 scripts/pr_checks.py receipt >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Record measured per-file times
        if: github.event_name == 'push' && needs.tests.result == 'success'
        run: python3 scripts/pr_checks.py durations
      - if: github.event_name == 'push' && needs.tests.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-python-timings
          path: durations.json
          retention-days: 30
      - name: Required checks passed
        if: always()
        env:
          PLAN: ${{ needs.plan.result }}
          TESTS: ${{ needs.tests.result }}
          CADDY: ${{ needs.caddy-linux.result }}
        run: |
          test "$PLAN" = success
          test "$TESTS" = success
          case "$CADDY" in success|skipped) ;; *) exit 1 ;; esac
