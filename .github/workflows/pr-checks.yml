# PR checks and the merge queue run on GitHub-hosted Ubuntu runners (free for this public repository), so they cost no
# RunsOn minutes. RunsOn runs only release validation (ci.yml) and remote-run.yml.
# Two tiers. Each push to a pull request runs the cheap checks (plan, static). A ready pull request from this repository
# also runs the plan's selected tests and factory simulation, so its `checks` passes only when they pass. A fork's pull
# request keeps the cheap checks only, and a draft runs nothing.
# A merge queue group (the merge_group event, once per queue group) runs everything else: the tests the group's merged
# change selects, the factory simulation when the change reaches what it runs (scripts/pr_checks.py factory_reason), the
# Rust and desktop checks, the macOS recorder tests and the Linux Caddy image. The group selects from its own base and
# head. Static checks run in the group too: its merge commit is the one that lands on main, and a migration timestamp can
# collide with a change queued ahead of it.
# A failed `tests` or `factory-sim` leg cancels its whole run (its last step), in a queue group or a pull request. The
# `checks` job still runs (always()) and fails, so the queue drops a failing group within about a minute.
# `checks` is the one required check. It fails when a job it needs failed or was cancelled; a skipped job passes. A draft
# pull request runs nothing.
# A skipped run proves nothing on its own: Tico reads a head whose every check was skipped as pending (backend/github.py
# _overall). Converting a pull request back to a draft starts no run: such a run would cancel the one in progress on the
# same head, and a cancelled check keeps the review gate blocking that head (backend/review_gate.py).
# A pull request's own push runs the cheap checks whether or not it comes from a fork. A fork's tests run only once a
# maintainer queues it.
# Without main pushes, pr-cache.yml keeps the main-branch caches the queue groups restore from fresh.
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

# The base each change is checked against: a queue group's base, or a pull request's base sha.
env:
  BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}

concurrency:
  # A newer push to a pull request cancels its superseded run. A queue group's ref is unique, and nothing cancels it.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      caddy: ${{ steps.plan.outputs.caddy }}
      factory: ${{ steps.plan.outputs.factory }}
      factory_shards: ${{ steps.plan.outputs.factory_shards }}
      recorder: ${{ steps.recorder.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Restore measured timings from a recent successful Release validation run
        # Optional: missing/expired artifacts stop immediately; transient errors get only 90s of retry backoff.
        # Release validation runs the same pytest flags these jobs pass (pr_checks.PYTEST_FLAGS), slow tests included.
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-timings
          # The newest of the last five successful runs that has the artifact: one without it (older than the timings
          # job, or expired) is skipped at once; a transient error spends the short retry budget once and ends the walk.
          runs=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --status success --limit 5 --json databaseId --jq '.[].databaseId') || runs=''
          for run in $runs; do
            if log=$(bash scripts/ci/retry.sh --max-attempts 3 --clear previous-timings --permanent 'HTTP (404|410)|no (valid )?artifacts? (match|found)' -- gh run download "$run" --name test-timings --dir previous-timings); then
              printf '%s\n' "$log"; echo "Timings from Release validation run $run"; break
            fi
            printf '%s\n' "$log"
            case $log in *'failed permanently'*) ;; *) break ;; esac
          done
          [ -f previous-timings/durations.json ] || echo "No measured timings yet; use collected counts this run"
      - name: Select affected tests and size measured Python and browser groups
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CHECK_HEAD: ${{ github.event.merge_group.head_sha || 'HEAD' }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py plan --event "$EVENT" --base "$BASE_SHA" --head "$CHECK_HEAD" --timings previous-timings/durations.json'
      # Tico Recorder changed (recorder/): the recorder job runs its macOS checks in a merge queue group. Detected here
      # on both tiers, so no VM starts only to diff the branch; the plan's checkout is full-depth.
      - name: Recorder changed
        id: recorder
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -q '^recorder/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-check-plan
          path: ci-plan.json
          retention-days: 7
      - name: Selection receipt
        run: |
          { echo '### Test selection'; echo '```json'; cat ci-plan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  tests:
    # Merge queue groups, and a pull request from this repository once it is ready (a draft has no plan; a fork's pull
    # request runs none of these).
    needs: plan
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      actions: write # the last step cancels the run when a suite fails
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - name: Free disk (GitHub-hosted runners start with about 14 GB free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-check-plan
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Every suite compiles the UI's TypeScript (scripts/ci_install.sh); only browser suites install Playwright.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: startsWith(matrix.suite, 'browser-')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.suite, 'browser-')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/playwright-system
          key: playwright-system-ubuntu24-x64-${{ steps.image.outputs.version }}-${{ hashFiles('package-lock.json', 'scripts/ci_install.sh', 'scripts/playwright-system-packages.json') }}
      - name: Use the canonical Ubuntu package mirror on every shard
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci_install.sh "$SUITE"
      - if: matrix.suite == 'conformance'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner-rs -> target
          shared-key: pr-conformance
      - name: Run selected tests
        env:
          SUITE: ${{ matrix.suite }}
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" "$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py run "$SUITE"
      - if: always() && (startsWith(matrix.suite, 'python-') || startsWith(matrix.suite, 'browser-') || matrix.suite == 'contracts')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.suite }}
          path: ci-results/*
          retention-days: 7
          if-no-files-found: warn
      # Fail fast: a failed suite stops the other legs and any other job in the run at once. `checks` still reports it.
      - name: Cancel the run when a suite failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "$GITHUB_RUN_ID"

  factory-sim:
    # Merge queue groups, and a pull request from this repository once it is ready, when the plan selects the factory
    # simulation (scripts/pr_checks.py factory_reason). Seed 1 of every scenario, in one VM per group of the sim's own
    # packing (timings.json; run.py --shard), four scenarios at a time on each. Release validation runs seeds 1-3 (ci.yml).
    # A draft and a fork's pull request never run it.
    needs: plan
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && needs.plan.outputs.factory == 'true' }}
    permissions:
      contents: read
      actions: write # the last step cancels the run when the sim fails
    name: factory sim ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.factory_shards) }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Run this group of the factory sim
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -W ignore -m evals.factory.run --seeds 1 --shard "$SHARD" -j 4 2>&1 \
            | tee "$RUNNER_TEMP/sim.log"
      - if: always()
        name: Summary
        run: |
          { echo '### Factory sim, group ${{ matrix.shard }}'; echo '```'
            awk '/^== /{h=$0; next} /^ +(FAIL|NOTE) /{if(h){print h; h=""} print} /scenario runs in/' "$RUNNER_TEMP/sim.log"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Cancel the run when the sim failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel "$GITHUB_RUN_ID"

  static:
    # Every change, on both tiers: pinned ruff against its baseline (no new findings or suppressions), basedpyright on
    # the backend against its baseline (strict for new modules), migration names, the UI's generated API types, the
    # OpenAPI document, the runner wire contract, shell scripts (shellcheck) and workflows (actionlint). Seconds each
    # once installed; tools are pinned. The UI's strict TypeScript rule (scripts/check_ui_strict.py) runs here too.
    name: static checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: New migrations have unique UTC timestamps
        env:
          EVENT: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            # The group's own base and merge commit: every change queued ahead of it is already in the base.
            python3 scripts/check_migration_order.py --base "$BASE_SHA" --head "$QUEUE_HEAD" --base-name main
            exit 0
          fi
          # Checkout has full history; refresh the base tip because the PR event's base SHA can be stale.
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          python3 scripts/check_migration_order.py --base "refs/remotes/origin/$BASE_BRANCH" --head "$PR_HEAD" --base-name "$BASE_BRANCH"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python && "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check uv==0.13.0
      - name: Python lint
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" LINT_BASE_REF="$BASE_SHA" bash scripts/lint.sh
      - name: Types (basedpyright baseline, strict new modules)
        env:
          PYRIGHT_BASE_REF: ${{ env.BASE_SHA }}
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_types.sh
      - name: UI types
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_ui_types.sh --base "$BASE_SHA"
      - name: OpenAPI document (docs/openapi/v2.json is what the generator writes)
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" python3 -m backend.openapi_v2 --check
      - name: UI lint setup
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: UI lint
        run: bash scripts/check_ui_lint.sh --base "$BASE_SHA"
      - name: UI strict (new UI code is TypeScript; each .ts file type-checks strictly)
        run: python3 scripts/check_ui_strict.py --base "$BASE_SHA"
      - name: UI routes
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_ui_routes.sh --base "$BASE_SHA"
      - name: Runner wire contract
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/check_wire_contract.py'
      - name: Shell scripts (shellcheck, pinned)
        run: bash scripts/shell_lint.sh
      - name: Workflows (actionlint, pinned)
        run: bash scripts/pinned_tool.sh actionlint

  rust-lint:
    # Merge queue groups only: rustfmt and clippy -D warnings (scripts/rust_checks.sh) when a crate it checks changed.
    name: rust lint
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Free disk (GitHub-hosted runners start with about 14 GB free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust changed
        id: changed
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(runner-rs|relay-rs|tools/release-command|tools/trust-list-check|contracts/runner)/|^scripts/rust_checks\.sh$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runner-rs -> target
            relay-rs -> target
            tools/release-command -> target
            tools/trust-list-check -> target
          shared-key: pr-rust-lint
      - if: steps.changed.outputs.run == 'true'
        run: bash scripts/rust_checks.sh

  desktop-app:
    # Merge queue groups only. The Tauri desktop app (app/): rustfmt, clippy -D warnings and its unit tests, on Linux with
    # the build dependencies app.yml installs. Nothing runs when no app file changed.
    name: desktop app
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Free disk (GitHub-hosted runners start with about 14 GB free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: App changed
        id: changed
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -q '^app/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        name: Rust 1.92.0 with rustfmt and clippy (the version scripts/rust_checks.sh pins)
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - if: steps.changed.outputs.run == 'true'
        name: Linux build dependencies (the ones app.yml installs)
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          shared-key: pr-desktop
          # A failing run keeps its compiled dependencies, so the next push does not start from nothing.
          cache-on-failure: true
      - if: steps.changed.outputs.run == 'true'
        name: rustfmt
        working-directory: app
        run: cargo +1.92.0 fmt --check
      - if: steps.changed.outputs.run == 'true'
        name: clippy
        working-directory: app
        run: cargo +1.92.0 clippy --locked --all-targets -- -D warnings
      - if: steps.changed.outputs.run == 'true'
        name: Python for the updater test (the hub backend it serves from, installed as the Python suites install it)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --retries 1 --timeout 30 -r backend/requirements-dev.txt
      - if: steps.changed.outputs.run == 'true'
        name: unit tests
        working-directory: app
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: cargo +1.92.0 test --locked

  recorder:
    # The Rust crate with the desktop feature (the window, the updater), on macOS: it links the system frameworks.
    # Merge queue groups only, when the plan sees a change under recorder/.
    name: recorder tests
    needs: plan
    if: ${{ github.event_name == 'merge_group' && needs.plan.outputs.recorder == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: recorder
          shared-key: pr-recorder
      - name: Rust 1.92.0 for the format and lint step (the version scripts/rust_checks.sh pins)
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - name: Format and lint, with the desktop and cli features
        working-directory: recorder
        run: |
          cargo +1.92.0 fmt --check
          cargo +1.92.0 clippy --locked --all-targets --features desktop,cli -- -D warnings
      - name: Tests with the desktop feature
        working-directory: recorder
        run: cargo test --locked --features desktop,cli

  caddy-linux:
    # Merge queue groups only, when the plan selects the Caddy image.
    needs: plan
    if: ${{ github.event_name == 'merge_group' && needs.plan.outputs.caddy == 'true' }}
    name: caddy-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64}
          - {arch: arm64}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_CADDY_CONTAINER_QA: '1'
      TICO_CADDY_EXPECTED_ARCH: ${{ matrix.arch }}
      TICO_CADDY_TEST_IMAGE: tico-caddy-qa:current
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Free disk (GitHub-hosted runners start with about 14 GB free)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build this source's server image locally; never publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: tico-caddy-qa:current
          build-args: |
            TICO_VERSION=dev
            TICO_COMMIT=${{ github.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=tico-${{ matrix.arch }}
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Actual pinned Linux Caddy runtime and lifecycle
        env:
          TICO_CADDY_TEST_OUTPUT: ${{ runner.temp }}/caddy-runtime-evidence
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q -m slow -n 0 backend/tests/test_caddy_container.py'
      - name: Preserve fixture receipts and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/caddy-runtime-evidence/
          if-no-files-found: warn

  timings:
    name: PR job timings
    # Merge queue groups only. A failed tests or factory-sim leg cancels the run, and a canceled run ends here: a final job
    # queued after the cancellation can wait for a RunsOn runner that never comes. It gates nothing: the receipt is cosmetic.
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    needs: [plan, tests, factory-sim, caddy-linux, static, rust-lint, desktop-app, recorder]
    runs-on: ubuntu-24.04
    # Four minutes: checkout and the artifact download run before the receipt, which is capped at one minute below.
    # A hang in the receipt canceled the whole job at three minutes on #2487.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: results-*
          path: ci-results
          merge-multiple: true
      # Cosmetic: a GitHub API error or hang here leaves the receipt incomplete and never fails or cancels the gate.
      - name: Per-job timings linked from the PR check
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | python3 scripts/pr_checks.py receipt >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  checks:
    # The one required check, on every pull request to main and on the merge queue. It fails when a job it needs failed or
    # was cancelled. A skipped job passes: a pull request skips the queue-only jobs, a fork's skips the tests and the sim,
    # and a draft pull request skips every job.
    name: checks
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [plan, static, tests, factory-sim, rust-lint, desktop-app, recorder, caddy-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Needed jobs passed or were skipped
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          FACTORY_SIM: ${{ needs.factory-sim.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          DESKTOP_APP: ${{ needs.desktop-app.result }}
          RECORDER: ${{ needs.recorder.result }}
          CADDY: ${{ needs.caddy-linux.result }}
        run: |
          status=0
          check() {
            case "$2" in
              success | skipped) ;;
              *) echo "::error::$1 ended with $2" >&2; status=1 ;;
            esac
          }
          check plan "$PLAN"
          check static "$STATIC"
          check tests "$TESTS"
          check factory-sim "$FACTORY_SIM"
          check rust-lint "$RUST_LINT"
          check desktop-app "$DESKTOP_APP"
          check recorder "$RECORDER"
          check caddy-linux "$CADDY"
          exit "$status"
