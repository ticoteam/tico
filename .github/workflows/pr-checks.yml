# The default Python and core browser suites on every pull request and main push, on free GitHub-hosted VMs,
# so a failing test shows on the PR instead of at Release validation. Read-only: no secrets, no publication.
# The Python suite runs as three file groups balanced by test count (python-1/2/3), one per VM, like Release validation.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: python-1, shard: '1/3'}
          - {suite: python-2, shard: '2/3'}
          - {suite: python-3, shard: '3/3'}
          - {suite: browser, shard: ''}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0   # release tags + history: test_changelog compares shipped sections with their tags (skips without them)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/requirements-dev.txt') }}
      - name: Use the canonical Ubuntu package mirror
        # Azure's mirror can stall browser dependency downloads until the job times out.
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r backend/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium webkit
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
      - name: Python tests (default suite, file group ${{ matrix.shard }}, every core)
        if: matrix.shard != ''
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
          TICO_PR_SHARD: ${{ matrix.shard }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/release_checks.py --shard "$TICO_PR_SHARD"'
      - name: Core browser tests
        if: matrix.suite == 'browser'
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" node scripts/ui-tests.cjs

  caddy-linux:
    name: caddy-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_CADDY_CONTAINER_QA: '1'
      TICO_CADDY_EXPECTED_ARCH: ${{ matrix.arch }}
      TICO_CADDY_TEST_IMAGE: tico-caddy-qa:current
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build this source's server image locally; never publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: tico-caddy-qa:current
          build-args: |
            TICO_VERSION=dev
            TICO_COMMIT=${{ github.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=tico-${{ matrix.arch }}
      - name: Install existing pinned test requirements
        run: |
          python3 -m venv "$RUNNER_TEMP/caddy-venv"
          "$RUNNER_TEMP/caddy-venv/bin/python" -m pip install -r backend/requirements-dev.txt
      - name: Actual pinned Linux Caddy runtime and lifecycle
        env:
          TICO_CADDY_TEST_OUTPUT: ${{ runner.temp }}/caddy-runtime-evidence
        run: '"$RUNNER_TEMP/caddy-venv/bin/python" -m pytest -q -m slow -n 0 backend/tests/test_caddy_container.py'
      - name: Preserve fixture receipts and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/caddy-runtime-evidence/
          if-no-files-found: warn
