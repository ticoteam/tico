# The default Python and core browser suites on every pull request and main push, on free GitHub-hosted VMs,
# so a failing test shows on the PR instead of at Release validation. Read-only: no secrets, no publication.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [python, browser]
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'backend/requirements-dev.txt') }}
      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r backend/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium webkit
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
      - name: Python tests (default suite, every core)
        if: matrix.suite == 'python'
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -q -n auto'
      - name: Core browser tests
        if: matrix.suite == 'browser'
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" node scripts/ui-tests.cjs
