# PR checks and the merge queue run on GitHub-hosted Ubuntu runners (free for this public repository), so they cost no
# RunsOn minutes. RunsOn runs only release validation (ci.yml) and remote-run.yml.
# Two tiers. Each push to a pull request runs the cheap checks (plan, static). A ready pull request from this repository
# also runs a light plan's tests (scripts/pr_checks.py NARROW, `plan --light`): the Python tests its change reaches
# directly, the smoke set when that drops any, capped at ten VMs; the browser scripts and the Caddy job only when it
# touches their own inputs. A change to a release-only browser script, its helpers or the UI file it is named after
# runs that script, and a template, skill or CLI change runs the slow CLI and template sweeps (pr_checks.py rules 6
# and 7). Its `checks` passes only when they pass. The merge queue group is the
# gate: its plan goes one level further (two, at most nineteen Python VMs) and keeps every other job's condition. A fork's
# pull request keeps the cheap checks only, and a draft runs nothing.
# A ready pull request from this repository also runs every other job a queue group runs, under the same conditions, so
# a failure shows before the change is enqueued: the Rust lint, desktop, macOS recorder and Linux Caddy jobs when the
# change touches what they check. The plan decides (scripts/pr_checks.py queue_jobs, caddy), so an untouched job starts
# no VM, on a pull request and in a group alike. Only the cosmetic timing receipt is queue-only.
# A merge queue group (the merge_group event, once per queue group) runs them all again on its merge commit: the tests
# the group's merged change reaches within two levels (release validation runs the rest), and the same Rust lint,
# desktop, recorder and Caddy jobs. The group's base is the head of the group
# queued ahead of it (main for the first), so it selects from its own pull request's change, tested on top of everything
# ahead of it. The static checks job runs on the pull request only; the group's plan job runs every static check again
# on the merge commit that lands on main (scripts/ci/merge_commit_checks.sh), since a change queued ahead can break one
# (a migration timestamp, a route, a lint rule).
# A failed `tests` leg cancels its whole run (its last step), in a queue group or a pull request. The
# `checks` job still runs (always()) and fails, so the queue drops a failing group within about a minute. The failing
# leg ends "cancelled" too (its own cancel stops it), so `checks` names the leg and step that failed.
# `checks` is the one required check. It fails when a job it needs failed or was cancelled; a skipped job passes. A draft
# pull request runs nothing.
# A skipped run proves nothing on its own: Tico reads a head whose every check was skipped as pending (backend/github.py
# _overall). Converting a pull request back to a draft starts no run: such a run would cancel the one in progress on the
# same head, and a cancelled check keeps the review gate blocking that head (backend/review_gate.py).
# A pull request's own push runs the cheap checks whether or not it comes from a fork. A fork's tests run only once a
# maintainer queues it.
# Without main pushes, pr-cache.yml keeps the main-branch caches the queue groups restore from fresh.
name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: read

# The base each change is checked against: a queue group's base, or a pull request's base sha.
env:
  BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}

concurrency:
  # A newer push to a pull request cancels its superseded run. A queue group's ref is unique, and nothing cancels it.
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write # cancels the older merge queue groups of the same pull request
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      caddy: ${{ steps.plan.outputs.caddy }}
      rust_lint: ${{ steps.plan.outputs.rust_lint }}
      desktop: ${{ steps.plan.outputs.desktop }}
      recorder: ${{ steps.plan.outputs.recorder }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The installed venv pr-cache.yml saves on main: a hit turns Install's pip step into a check that every pin is
      # already satisfied. Restore only: a pull request or queue group never saves one (its scope helps no other run).
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/venv
          key: venv-ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements-dev.txt', 'scripts/ci_install.sh') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Restore measured timings from a recent successful Release validation run
        # Optional: missing/expired artifacts stop immediately; transient errors get only 90s of retry backoff.
        # Release validation runs the same pytest flags these jobs pass (pr_checks.PYTEST_FLAGS), slow tests included.
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-timings
          # The newest of the last five successful runs that has the artifact: one without it (older than the timings
          # job, or expired) is skipped at once; a transient error spends the short retry budget once and ends the walk.
          runs=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --status success --limit 5 --json databaseId --jq '.[].databaseId') || runs=''
          for run in $runs; do
            if log=$(bash scripts/ci/retry.sh --max-attempts 3 --clear previous-timings --permanent 'HTTP (404|410)|no (valid )?artifacts? (match|found)' -- gh run download "$run" --name test-timings --dir previous-timings); then
              printf '%s\n' "$log"; echo "Timings from Release validation run $run"; break
            fi
            printf '%s\n' "$log"
            case $log in *'failed permanently'*) ;; *) break ;; esac
          done
          [ -f previous-timings/durations.json ] || echo "No measured timings yet; use collected counts this run"
      # A merge queue group supersedes the older groups of its pull request: a rebuilt queue entry has a new head. The
      # concurrency group cannot key on the number (an expression cannot read it from head_ref), so this step cancels
      # those older queued and running runs. It runs for merge_group only, so a pull request's own runs are never listed,
      # and it never cancels its own run. It cancels only a group GitHub has already dropped (its gh-readonly-queue ref
      # returns 404): a cancelled group that is still live fails `checks` and ejects its pull request.
      # Continue-on-error: a failed cancel leaves the older group to finish alone.
      - name: Cancel older queue groups for this pull request
        if: github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          for status in queued in_progress; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/pr-checks.yml/runs?event=merge_group&status=$status&per_page=100" > "$RUNNER_TEMP/runs-$status.json"
          done
          "$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py cancel-superseded --head-ref "$HEAD_REF" --run-number "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/runs-queued.json" "$RUNNER_TEMP/runs-in_progress.json"
      # A queue group's merge commit is what lands on main, and a change queued ahead can break this one's static checks
      # (a migration timestamp, a route one removes and the other calls, a lint rule one turns on). The group runs every
      # static check on it here (scripts/ci/merge_commit_checks.sh), beside the test selection (which uses one core),
      # rather than on a static checks VM. The step after the selection reports the result.
      # shellcheck and actionlint come from GitHub release downloads, which return 504 now and then; a cached copy (keyed on
      # the pinned versions and hashes in scripts/pinned_tool.sh) skips the download.
      - name: Cache pinned tools
        if: github.event_name == 'merge_group'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tico/tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pinned_tool.sh') }}
      - name: Start the merge commit checks
        if: github.event_name == 'merge_group'
        env:
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # set +e: the step's shell runs with -e, and a failed check must still write its status.
          ( set +e; PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/ci/merge_commit_checks.sh "$BASE_SHA" "$QUEUE_HEAD"
            echo "$?" > "$RUNNER_TEMP/merge-checks.status" ) > "$RUNNER_TEMP/merge-checks.log" 2>&1 &
      - name: Select affected tests and size measured Python and browser groups
        id: plan
        # Both tiers plan light (scripts/pr_checks.py NARROW): a pull request the tests its change reaches directly, at
        # most ten VMs; a queue group two levels, at most nineteen; each with the smoke set when it drops any. Release
        # validation's incremental and daily full runs cover what a group leaves out.
        env:
          EVENT: ${{ github.event_name }}
          CHECK_HEAD: ${{ github.event.merge_group.head_sha || 'HEAD' }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py plan --event "$EVENT" --base "$BASE_SHA" --head "$CHECK_HEAD" --timings previous-timings/durations.json --light'
      - name: Merge commit checks
        if: github.event_name == 'merge_group'
        timeout-minutes: 8
        run: |
          until [ -f "$RUNNER_TEMP/merge-checks.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/merge-checks.log"
          exit "$(cat "$RUNNER_TEMP/merge-checks.status")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-check-plan
          path: ci-plan.json
          retention-days: 7
      - name: Selection receipt
        run: |
          { echo '### Test selection'; echo '```json'; cat ci-plan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  tests:
    # Merge queue groups, and a pull request from this repository once it is ready (a draft has no plan; a fork's pull
    # request runs none of these).
    needs: plan
    if: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      actions: write # the last step cancels the run when a suite fails
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # A queue group's VMs are sized to the 330-second job target (pr_checks.QUEUE_MAX_JOB_SECONDS), setup included.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk only when under 30 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 30
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-check-plan
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The installed venv pr-cache.yml saves on main: a hit turns Install's pip step into a check that every pin is
      # already satisfied. Restore only: a pull request or queue group never saves one (its scope helps no other run).
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/venv
          key: venv-ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements-dev.txt', 'scripts/ci_install.sh') }}
      # Every suite compiles the UI's TypeScript (scripts/ci_install.sh); only browser suites install Playwright.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - if: startsWith(matrix.suite, 'browser-')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Runner image version
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.suite, 'browser-')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/playwright-system
          key: playwright-system-ubuntu24-x64-${{ steps.image.outputs.version }}-${{ hashFiles('package-lock.json', 'scripts/ci_install.sh', 'scripts/playwright-system-packages.json') }}
      - name: Use the canonical Ubuntu package mirror on every shard
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci_install.sh "$SUITE"
      - if: matrix.suite == 'conformance'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: runner-rs -> target
          shared-key: pr-conformance
      - name: Run selected tests
        env:
          SUITE: ${{ matrix.suite }}
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        # --quarantine: a test listed in ci/quarantine/ (it failed and passed on one commit) runs but cannot fail the
        # suite. Release validation never passes it (scripts/flake_quarantine.py).
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" "$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py run --quarantine "$SUITE"
      - if: always() && (startsWith(matrix.suite, 'python-') || startsWith(matrix.suite, 'browser-') || matrix.suite == 'contracts' || matrix.suite == 'conformance')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.suite }}
          path: ci-results/*
          retention-days: 7
          if-no-files-found: warn
      # Fail fast: a failed suite stops the other legs and any other job in the run at once. `checks` still reports it.
      # Every leg, this one too, then ends "cancelled", so an error annotation first names the suite and its first failing
      # tests: a reader (or a bot) of the run sees a failure, not a cancel.
      - name: Cancel the run when a suite failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUITE: ${{ matrix.suite }}
        run: |
          failed=$("$RUNNER_TEMP/venv/bin/python" scripts/pr_checks.py failed ci-results 2>/dev/null || true)
          echo "::error title=${SUITE} failed::${failed:-see the job log}. The run was cancelled on purpose (fail fast), so the other legs show cancelled."
          gh run cancel "$GITHUB_RUN_ID"

  static:
    # Every push to a pull request that is not a draft (a queue group runs the same list on its merge commit in its plan
    # job instead, scripts/ci/merge_commit_checks.sh): pinned ruff against its baseline (no new findings or
    # suppressions), basedpyright on the backend against its baseline (strict for new modules), migration names, the UI's generated API types, the
    # OpenAPI document, the runner wire contract, shell scripts (shellcheck) and workflows (actionlint). Seconds each
    # once installed; tools are pinned. The UI's strict TypeScript rule (scripts/check_ui_strict.py) runs here too, and
    # its Node counterpart for scripts/ and recorder/ (scripts/check_node_types.py).
    name: static checks
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: New migrations have unique UTC timestamps
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Checkout has full history; refresh the base tip because the PR event's base SHA can be stale.
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          python3 scripts/check_migration_order.py --base "refs/remotes/origin/$BASE_BRANCH" --head "$PR_HEAD" --base-name "$BASE_BRANCH"
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The installed venv pr-cache.yml saves on main: a hit turns Install's pip step into a check that every pin is
      # already satisfied. Restore only: a pull request or queue group never saves one (its scope helps no other run).
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/venv
          key: venv-ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements-dev.txt', 'scripts/ci_install.sh') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python && "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check uv==0.13.0
      - name: Python lint
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" LINT_BASE_REF="$BASE_SHA" bash scripts/lint.sh
      - name: Types (basedpyright baseline, strict new modules)
        env:
          PYRIGHT_BASE_REF: ${{ env.BASE_SHA }}
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_types.sh
      - name: UI types
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_ui_types.sh --base "$BASE_SHA"
      - name: OpenAPI spec (generated, never committed, generates the same bytes twice)
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" python3 -m backend.openapi_v2 --check
      - name: API guide tags (docs/api.md follows the spec's tags)
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" python3 scripts/build_api_docs.py --check
      - name: UI lint setup
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: UI lint
        run: bash scripts/check_ui_lint.sh --base "$BASE_SHA"
      - name: UI strict (new UI code is TypeScript; each .ts file type-checks strictly)
        run: python3 scripts/check_ui_strict.py --base "$BASE_SHA"
      - name: Node types (the scripts under scripts/ and recorder/, and the Recorder window, type-check strictly, no baseline)
        run: python3 scripts/check_node_types.py
      - name: UI routes
        run: PATH="$RUNNER_TEMP/venv/bin:$PATH" bash scripts/check_ui_routes.sh --base "$BASE_SHA"
      - name: UI source suffixes (each .js UI scanner also reads .ts; text only)
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/check_ui_source_suffixes.py'
      - name: Runner wire contract
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/check_wire_contract.py'
      - name: Coverage pragmas carry a reason
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/diff_coverage.py pragmas --base "$BASE_SHA" --head HEAD'
      - name: Test imports (no file imports a test module; shared names live in helpers/)
        run: python3 scripts/check_test_imports.py --base "$BASE_SHA"
      # shellcheck and actionlint come from GitHub release downloads, which return 504 now and then; a cached copy (keyed on
      # the pinned versions and hashes in scripts/pinned_tool.sh) skips the download.
      - name: Cache pinned tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tico/tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pinned_tool.sh') }}
      - name: Shell scripts (shellcheck, pinned)
        run: bash scripts/shell_lint.sh
      - name: Workflows (actionlint, pinned)
        run: bash scripts/pinned_tool.sh actionlint

  rust-lint:
    # Merge queue groups, and a ready pull request from this repository: rustfmt and clippy -D warnings
    # (scripts/rust_checks.sh) when the plan sees a change to a crate it checks (pr_checks.QUEUE_JOB_PATHS). No VM starts
    # when none changed.
    name: rust lint
    needs: plan
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && needs.plan.outputs.rust_lint == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk only when under 30 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runner-rs -> target
            relay-rs -> target
            tools/release-command -> target
            tools/trust-list-check -> target
          shared-key: pr-rust-lint
      - run: bash scripts/rust_checks.sh

  desktop-app:
    # Merge queue groups, and a ready pull request from this repository. The Tauri desktop app (app/): rustfmt, clippy
    # -D warnings and its unit tests, on Linux with the build dependencies app.yml installs. No VM starts when the plan
    # sees no app file changed.
    name: desktop app
    needs: plan
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && needs.plan.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk only when under 40 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 40
      - name: Rust 1.92.0 with rustfmt and clippy (the version scripts/rust_checks.sh pins)
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - name: Linux build dependencies (the ones app.yml installs)
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app -> target
          shared-key: pr-desktop
          # A failing run keeps its compiled dependencies, so the next push does not start from nothing.
          cache-on-failure: true
      - name: rustfmt
        working-directory: app
        run: cargo +1.92.0 fmt --check
      - name: clippy
        working-directory: app
        run: cargo +1.92.0 clippy --locked --all-targets -- -D warnings
      - name: Python for the updater test (the hub backend it serves from, installed as the Python suites install it)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --retries 1 --timeout 30 -r backend/requirements-dev.txt
      - name: unit tests
        working-directory: app
        env:
          TICO_PYTHON: ${{ runner.temp }}/venv/bin/python
        run: cargo +1.92.0 test --locked

  recorder:
    # The Rust crate with the desktop feature (the window, the updater), on macOS: it links the system frameworks.
    # Merge queue groups, and a ready pull request from this repository, when the plan sees a change under recorder/.
    name: recorder tests
    needs: plan
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && needs.plan.outputs.recorder == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: recorder
          shared-key: pr-recorder
      - name: Rust 1.92.0 for the format and lint step (the version scripts/rust_checks.sh pins)
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: The window's scripts (TypeScript, stripped into recorder/dist, which the desktop build embeds)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node recorder/build-ui.cjs
      - name: Format and lint, with the desktop and cli features
        working-directory: recorder
        run: |
          cargo +1.92.0 fmt --check
          cargo +1.92.0 clippy --locked --all-targets --features desktop,cli -- -D warnings
      - name: Tests with the desktop feature
        working-directory: recorder
        run: cargo test --locked --features desktop,cli

  caddy-linux:
    # Merge queue groups, and a ready pull request from this repository, when the plan selects the Caddy image.
    needs: plan
    if: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) && needs.plan.outputs.caddy == 'true' }}
    name: caddy-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64}
          - {arch: arm64}
    env:
      PYTHONUNBUFFERED: '1'
      TICO_CADDY_CONTAINER_QA: '1'
      TICO_CADDY_EXPECTED_ARCH: ${{ matrix.arch }}
      TICO_CADDY_TEST_IMAGE: tico-caddy-qa:current
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free disk only when under 40 GB free (hosted ubuntu-24.04 x64 runners start with about 85 GB)
        run: bash scripts/ci/free_disk.sh 40
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The installed venv pr-cache.yml saves on main: a hit turns Install's pip step into a check that every pin is
      # already satisfied. Restore only: a pull request or queue group never saves one (its scope helps no other run).
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/venv
          key: venv-ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements-dev.txt', 'scripts/ci_install.sh') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build this source's server image locally; never publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: tico-caddy-qa:current
          build-args: |
            TICO_VERSION=dev
            TICO_COMMIT=${{ github.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=tico-${{ matrix.arch }}
      - name: Install (five minutes per attempt, one retry)
        timeout-minutes: 11
        run: bash scripts/ci_install.sh python
      - name: Actual pinned Linux Caddy runtime and lifecycle
        env:
          TICO_CADDY_TEST_OUTPUT: ${{ runner.temp }}/caddy-runtime-evidence
        # --quarantine: as in the python legs (scripts/flake_quarantine.py). The JUnit report is the per-test evidence a
        # later run reads, uploaded below as results-<job>.
        run: 'mkdir -p ci-results && "$RUNNER_TEMP/venv/bin/python" -m pytest -q -m slow -n 0 --quarantine --junitxml=ci-results/caddy-linux-${{ matrix.arch }}.xml backend/tests/test_caddy_container.py'
      - name: Preserve fixture receipts and redacted failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/caddy-runtime-evidence/
          if-no-files-found: warn
      - name: Upload the JUnit report (quarantine evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-caddy-linux-${{ matrix.arch }}
          path: ci-results/*
          retention-days: 7
          if-no-files-found: warn

  timings:
    name: PR job timings
    # Merge queue groups only. A failed tests leg cancels the run, and a canceled run ends here: a final job
    # queued after the cancellation can wait for a RunsOn runner that never comes. It gates nothing: the receipt is cosmetic.
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    needs: [plan, tests, caddy-linux, static, rust-lint, desktop-app, recorder]
    runs-on: ubuntu-24.04
    # Four minutes: checkout and the artifact download run before the receipt, which is capped at one minute below.
    # A hang in the receipt canceled the whole job at three minutes on #2487.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: results-*
          path: ci-results
          merge-multiple: true
      # Cosmetic: a GitHub API error or hang here leaves the receipt incomplete and never fails or cancels the gate.
      - name: Per-job timings linked from the PR check
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | python3 scripts/pr_checks.py receipt >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  checks:
    # The one required check, on every pull request to main and on the merge queue. It fails when a job it needs failed or
    # was cancelled. A skipped job passes: a change that does not reach a job skips it, a fork's pull request skips the
    # tests and the Rust, desktop, recorder and Caddy jobs, and a draft pull request skips every job.
    name: checks
    if: ${{ always() && !github.event.pull_request.draft }}
    needs: [plan, static, tests, rust-lint, desktop-app, recorder, caddy-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Needed jobs passed or were skipped
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          DESKTOP_APP: ${{ needs.desktop-app.result }}
          RECORDER: ${{ needs.recorder.result }}
          CADDY: ${{ needs.caddy-linux.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          cancelled=0
          check() {
            case "$2" in
              success | skipped) ;;
              cancelled) echo "::error::$1 ended with cancelled" >&2; status=1; cancelled=1 ;;
              *) echo "::error::$1 ended with $2" >&2; status=1 ;;
            esac
          }
          check plan "$PLAN"
          check static "$STATIC"
          check tests "$TESTS"
          check rust-lint "$RUST_LINT"
          check desktop-app "$DESKTOP_APP"
          check recorder "$RECORDER"
          check caddy-linux "$CADDY"
          # A failed leg cancels the whole run, itself included, so its job reads "cancelled". Name the step that
          # really failed, or say that nothing did (cancelled from outside: a superseded queue group, or by hand).
          if [ "$cancelled" = 1 ]; then
            # shellcheck disable=SC2016 # $job is a jq variable, not a shell one.
            failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name != "checks") | .name as $job | .steps[]? | select(.conclusion == "failure") | "\($job): \(.name)"' \
              2>/dev/null | paste -sd ';' - | sed 's/;/; /g') || failed=''
            if [ -n "$failed" ]; then
              echo "::error::Failed: ${failed}. Fail fast then cancelled the other legs."
            else
              echo "::error::No step failed: the run was cancelled from outside (a superseded queue group, or by hand)."
            fi
          fi
          exit "$status"
      # The diff coverage gate (scripts/diff_coverage.py): every statement this change adds to backend/ and clients/ must
      # run under the tests above, on a queue group and on a ready pull request from this repository (the runs that have
      # the tests job; this job skips drafts). It runs after the last job, so it costs a checkout and two artifact
      # downloads. Its own step fails the check and lists each statement no test ran.
      - if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-check-plan
      - if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: results-*
          path: ci-results
          merge-multiple: true
      - name: Diff coverage gate (added statements must run under the tests)
        if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: python3 scripts/diff_coverage.py gate --plan ci-plan.json --results ci-results
