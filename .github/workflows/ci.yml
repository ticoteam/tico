# One release check for one candidate, split across isolated native VMs that run side by side.
# The VMs are RunsOn instances in Tico's own AWS account (dispatched runs only, never fork code).
# TICO_CI_HOSTED=true runs them on GitHub-hosted runners instead (docs/releasing.md#tests-on-a-pr).
# No PR/push tests, schedule or publication: the release window (train.yml), a hotfix (hotfix.yml) or a person dispatches
# it for an exact commit and version, and release.yml and the release window find the run by its title.
# It builds the release once: the Linux runner and relay binaries and the three images for both architectures, pushed by
# digest only. The gate tests those binaries and images, and release.yml publishes exactly them for the tag, so what
# shipped is what was tested. The Mac binaries are built by release.yml after the tag (no gate part runs on a Mac, and a
# GitHub macOS runner can take 5-15 minutes to start), or carried forward when the runner sources did not change.
name: Release validation
run-name: Validate ${{ inputs.candidate_sha }} as ${{ inputs.version }} from ${{ inputs.previous_release }}${{ inputs.anchor != '' && format(' (incremental on {0})', inputs.anchor) || '' }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable candidate commit (40 lowercase hex characters)
        required: true
        type: string
      previous_release:
        description: Published stable release for install/upgrade/rollback
        required: true
        default: v0.3.48
        type: string
      version:
        description: The version this candidate will be released as (vX.Y.Z); it is built into the images
        required: true
        type: string
      anchor:
        description: Incremental only; the full commit SHA of the green validation (full or incremental) this one builds on. Empty runs the full validation
        required: false
        default: ''
        type: string
      carried:
        description: Incremental only; a JSON list of the failed tests carried from open red validations (scripts/release_increment.py)
        required: false
        default: ''
        type: string
      anchor_previous:
        description: Incremental only; the published release the anchor validated against (its product part runs when the previous release differs)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: manual-release-validation
  cancel-in-progress: false

jobs:
  # The ceiling on full validations: at most 10 a UTC day, manual dispatches included, counted from GitHub before any
  # RunsOn VM starts. A hard backstop: the automatic window already dispatches at most one full validation a day
  # (scripts/release_increment.py full_within_day). Incremental runs are not counted; every job that starts a VM waits here.
  ceiling:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Count today's full validations
        if: inputs.anchor == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CAP: '10'
        run: |
          today=$(date -u +%Y-%m-%d)
          count=$(gh api --paginate "repos/$REPO/actions/workflows/ci.yml/runs?event=workflow_dispatch&created=$today&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.created_at | startswith(\"$today\")) | select(.display_title | contains(\" (incremental on \") | not) | .id" | wc -l | tr -d ' ')
          echo "$count full validations started today (UTC $today) besides this one"
          if [ "$count" -ge "$CAP" ]; then echo "::error::$CAP full runs today; ceiling reached"; exit 1; fi

  # What to validate: the requested candidate against the requested published release.
  candidate:
    needs: ceiling
    # An incremental validation runs on GitHub-hosted runners: its plan is made here, and it is small.
    runs-on: ${{ (vars.TICO_CI_HOSTED == 'true' || inputs.anchor != '') && 'ubuntu-24.04' || format('runs-on={0}/volume=30gb:gp3:125mbs:3000iops/runner=2cpu-linux-x64/family=m8+m7+m6+r8+r7/extras=s3-cache', github.run_id) }}
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      previous: ${{ steps.pick.outputs.previous }}
      version: ${{ steps.pick.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - id: pick
        env:
          SHA: ${{ inputs.candidate_sha }}
          PREVIOUS: ${{ inputs.previous_release }}
          VERSION: ${{ inputs.version }}
          ANCHOR: ${{ inputs.anchor }}
          CARRIED: ${{ inputs.carried }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate_sha must be a full commit SHA"; exit 1; }
          [[ "$PREVIOUS" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::previous_release must be vX.Y.Z"; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version must be vX.Y.Z"; exit 1; }
          [[ -z "$ANCHOR" || "$ANCHOR" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::an incremental validation names its anchor commit"; exit 1; }
          [[ -z "$CARRIED" || "$CARRIED" == \[*\] ]] || { echo "::error::carried failures are a JSON list"; exit 1; }
          { echo "sha=$SHA"; echo "previous=$PREVIOUS"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"
      # Controls from the reviewed workflow commit: the gate's VMs are the full validation's, or the incremental plan's.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: validation-control
          sparse-checkout: |
            scripts/release_increment.py
            scripts/pr_checks.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # An incremental validation makes its plan from the candidate's history (the anchor is an ancestor of main).
      - if: inputs.anchor != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        if: inputs.anchor != ''
        env:
          ANCHOR: ${{ inputs.anchor }}
          HEAD: ${{ inputs.candidate_sha }}
          CARRIED: ${{ inputs.carried }}
          ANCHOR_PREVIOUS: ${{ inputs.anchor_previous }}
          PREVIOUS: ${{ inputs.previous_release }}
        run: |
          plan="$(python3 validation-control/scripts/release_increment.py plan --root candidate --base "$ANCHOR" --head "$HEAD" --carried "$CARRIED" --anchor-previous "$ANCHOR_PREVIOUS" --previous "$PREVIOUS")"
          printf 'plan=%s\n' "$plan" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
        run: echo "matrix=$(python3 validation-control/scripts/release_increment.py matrix "$PLAN")" >> "$GITHUB_OUTPUT"

  # The runner and screen relay for Linux, built once from the candidate, reusing compiled dependencies from a cache only
  # main writes. Linux builds are static (musl): the images, Linux checkouts and
  # the gate all run these same files. Spot VMs: an interrupted build is rerun automatically and pushes by digest again.
  native-linux:
    needs: candidate
    strategy:
      matrix:
        include:
          - {arch: x64, name: linux-x86_64, target: x86_64-unknown-linux-musl}
          - {arch: arm64, name: linux-arm64, target: aarch64-unknown-linux-musl}
    runs-on: ${{ (vars.TICO_CI_HOSTED == 'true' || inputs.anchor != '') && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') || format('runs-on={0}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-{1}{2}', github.run_id, matrix.arch, matrix.arch == 'x64' && '/family=m8+m7+m6+r8+r7' || '') }}
    timeout-minutes: 20
    steps:
      - name: Free disk on a GitHub-hosted runner (about 14 GB free there; RunsOn's volume is 30 GB)
        if: vars.TICO_CI_HOSTED == 'true' || inputs.anchor != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Install Rust and musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup toolchain install 1.92 --profile minimal --target "$TARGET" && rustup default 1.92
      # Every gate part waits for this build (about 3 min uncached). Cache compiled dependencies as on macOS: keyed on
      # Cargo.lock, toolchain and target; only Release validation runs on main write it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            runner-rs -> target
            relay-rs -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tico-runner and tico-screen-relay
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
          TICO_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          export CC_x86_64_unknown_linux_musl=musl-gcc CC_aarch64_unknown_linux_musl=musl-gcc
          # Two crates with their own target directories, built side by side; both must succeed.
          (cd runner-rs && cargo build --release --locked --target "$TARGET") & runner=$!
          (cd relay-rs && cargo build --release --locked --target "$TARGET") & relay=$!
          status=0
          wait "$runner" || { echo "::error::tico-runner did not build"; status=1; }
          wait "$relay" || { echo "::error::tico-screen-relay did not build"; status=1; }
          [ "$status" = 0 ] || exit 1
          # The binary must report the release it is built for (build.rs stamps TICO_VERSION), or the release stops here.
          # Release validation runs this file from main against the frozen candidate, so a candidate from before the
          # stamp (#1905: its build.rs does not read TICO_VERSION, and the runner has no --release) skips the check.
          if grep -q TICO_VERSION runner-rs/build.rs; then
            want="${TICO_VERSION#v}"
            got="$("runner-rs/target/$TARGET/release/tico-runner" --release)"
            [ "$got" = "$want" ] || { echo "::error::tico-runner --release says '$got', release is '$want'"; exit 1; }
          else
            echo "::notice::runner-rs/build.rs predates the release stamp; tico-runner --release not checked"
          fi
          mkdir -p dist
          gzip -9 -c "runner-rs/target/$TARGET/release/tico-runner" > "dist/tico-runner-$NAME.gz"
          gzip -9 -c "relay-rs/target/$TARGET/release/tico-screen-relay" > "dist/tico-screen-relay-$NAME.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-${{ matrix.name }}
          path: dist/*.gz
          retention-days: 30
          if-no-files-found: error

  # The three images for both architectures, with the version baked in and the binaries above copied in, pushed by
  # digest only: no tag points at them until release.yml promotes this run's digests for the version tag.
  # They start with the candidate, not after native-linux: VM start, checkout and buildx setup run while the binaries
  # build, and the server and runner images wait for them below (the updater image has no Rust binaries).
  images:
    needs: candidate
    strategy:
      fail-fast: true
      matrix:
        image: [tico, tico-runner, tico-updater]
        platform: [amd64, arm64]
    # Each architecture builds natively: emulating npm and pip installs is slow and flaky.
    runs-on: ${{ (vars.TICO_CI_HOSTED == 'true' || inputs.anchor != '') && (matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') || format('runs-on={0}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-{1}{2}/extras=s3-cache', github.run_id, matrix.platform == 'arm64' && 'arm64' || 'x64', matrix.platform != 'arm64' && '/family=m8+m7+m6+r8+r7' || '') }}
    timeout-minutes: 30
    permissions:
      actions: read   # watches this run's native-linux build
      contents: read
      packages: write
    steps:
      - name: Free disk on a GitHub-hosted runner (about 14 GB free there; RunsOn's volume is 30 GB)
        if: vars.TICO_CI_HOSTED == 'true' || inputs.anchor != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the release Linux binaries
        if: matrix.image != 'tico-updater'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.platform == 'arm64' && 'linux-arm64' || 'linux-x86_64' }}
        run: |
          for _ in $(seq 150); do
            job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              -q "[.jobs[] | select((.name | startswith(\"native-linux (\")) and (.name | contains(\"$NAME\"))) | {status, conclusion}]")"
            [ "$(jq 'length' <<<"$job")" = 1 ] || { echo "::error::The native-linux $NAME build was not found."; exit 1; }
            if [ "$(jq -r '.[0].status' <<<"$job")" = completed ]; then
              [ "$(jq -r '.[0].conclusion' <<<"$job")" = success ] && exit 0
              echo "::error::The release Linux binaries did not build."; exit 1
            fi
            sleep 5
          done
          echo "::error::The release Linux binaries were not built within 12 minutes."; exit 1
      - if: matrix.image != 'tico-updater'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-${{ matrix.platform == 'arm64' && 'linux-arm64' || 'linux-x86_64' }}
          path: ${{ runner.temp }}/native
      - name: Stage the binaries for the image
        if: matrix.image != 'tico-updater'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "dist/native/$PLATFORM"
          for name in tico-runner tico-screen-relay; do
            gunzip -c "$RUNNER_TEMP"/native/"$name"-linux-*.gz > "dist/native/$PLATFORM/$name"
          done
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image == 'tico' && 'server' || matrix.image == 'tico-runner' && 'runner' || 'updater' }}
          platforms: linux/${{ matrix.platform }}
          build-args: |
            NATIVE=prebuilt
            TICO_VERSION=${{ needs.candidate.outputs.version }}
            TICO_COMMIT=${{ needs.candidate.outputs.sha }}
            TICO_REPOSITORY=${{ github.repository }}
          outputs: type=image,name=ghcr.io/ticoteam/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}-${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$DIGEST" > "$RUNNER_TEMP/digest/$NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digest/*
          retention-days: 30
          if-no-files-found: error

  # Each VM runs one part of the candidate's own `release_checks.py --release`; together they are the whole gate.
  # Each part is sized to about 5 minutes on its VM (4 vCPUs, the largest size these parts use). The parts start with
  # the candidate, not after the Linux binaries: each one's setup runs while native-linux builds them, and waits for them
  # below before it runs its tests.
  # Product also waits for the image builds itself.
  gate:
    needs: candidate
    name: ${{ matrix.name }}
    permissions:
      contents: read
      actions: read   # product watches this run's image builds; every part watches the Linux binary build
    # The gate needs 35 GiB free (Docker images, browsers, Rust targets); the default RunsOn disk leaves about 10.
    # Spot, like every RunsOn job: RunsOn reruns a part whose VM is reclaimed (twice at most), and AWS does not bill a
    # Spot VM reclaimed in its first hour. Disks use the free gp3 speed (125 MiB/s).
    # Every part runs on 4 vCPUs; more shards, not bigger VMs, for speed.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The VMs: the full validation's (release_increment.full_matrix), or an incremental plan's (--plan).
      matrix: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    # An incremental validation's python and browser VMs run on hosted runners; its product and desktop VMs need the
    # 35 GiB disk and the Docker images, so they stay on RunsOn.
    runs-on: ${{ (vars.TICO_CI_HOSTED == 'true' || (inputs.anchor != '' && matrix.part != 'product' && matrix.part != 'desktop')) && 'ubuntu-24.04' || format('runs-on={0}/runner={1}/family=m8+m7+m6+r8+r7/volume=80gb:gp3:125mbs:3000iops/extras=s3-cache', github.run_id, matrix.runner) }}
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      PREVIOUS_RELEASE: ${{ needs.candidate.outputs.previous }}
      CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
      TICO_VALIDATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      TICO_RELEASE_PART: ${{ matrix.part }}
      TICO_RELEASE_SHARD: ${{ matrix.shard }}
      # An incremental plan's python or browser VM runs its suite (scripts/pr_checks.py run) from the candidate's checkout.
      TICO_INCREMENT_SUITE: ${{ needs.candidate.outputs.plan != '' && matrix.part != 'product' && matrix.part != 'desktop' && matrix.name || '' }}
      TICO_PYTHON_WORKERS: ${{ matrix.workers }}
      TICO_UI_JOBS: '3'
      TICO_UI_SLOWDOWN: '2'
      TICO_BROWSER_CHANNEL: ''
      PYTHONUNBUFFERED: '1'
      # The slowest tests of each part, so a part that outruns the others shows what holds it.
      PYTEST_ADDOPTS: '--durations=25'
    steps:
      - name: Free disk on a GitHub-hosted runner (about 14 GB free there; RunsOn's volume is 30 GB)
        if: vars.TICO_CI_HOSTED == 'true' || (inputs.anchor != '' && matrix.part != 'product' && matrix.part != 'desktop')
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Validate inputs before checkout
        env:
          TICO_HOSTED_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CANDIDATE_SHA']), 'A full lowercase commit SHA is required'
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['PREVIOUS_RELEASE']), 'A stable previous release is required'
          # A RunsOn VM is a self-hosted runner, but like a GitHub-hosted one it is launched for this job alone.
          kind = os.environ['TICO_HOSTED_ENVIRONMENT']
          instance = os.environ.get('RUNS_ON_INSTANCE_ID', '')
          if kind == 'self-hosted' and re.fullmatch(r'i-[0-9a-f]{8,17}', instance) \
                  and os.environ.get('RUNNER_NAME', '').startswith(f'runs-on--{instance}--'):
              kind = 'runs-on'
          assert kind in ('github-hosted', 'runs-on'), 'A GitHub-hosted or RunsOn VM is required'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'TICO_HOSTED_ENVIRONMENT={kind}\n')
          PY
      # Controls come from the reviewed workflow commit; builds/tests come only from the candidate.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: validation-control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Runtime and disposable capacity preflight
        run: python3 validation-control/scripts/hosted_release_check.py prepare
      # Caches hold downloads only (npm tarballs, browsers, compiled Cargo dependencies); every job still
      # installs from the candidate's pinned lock files and builds the candidate's own crates from source.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Install Python test prerequisites
        working-directory: candidate
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          # uv installs the same pinned lock as pip, in seconds instead of about a minute.
          python3 -m pip install --disable-pip-version-check uv==0.13.1
          python3 -m uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" -r backend/requirements-dev.txt
          # The UI's TypeScript, compiled as the image compiles it (backend/ui_build.py refuses a missing build). A
          # candidate from before the build step has nothing to compile.
          if [ -f scripts/build-ui.cjs ]; then npm ci --no-audit --no-fund && npm run --silent build:ui; fi
      # One real collection validates the filesystem shard plan while native-linux is still building. The other
      # 27 Python VMs never collect the whole suite; python-1 has about two minutes of binary-wait slack here.
      - name: Check Python shard coverage during the native build
        if: matrix.name == 'python-1'
        working-directory: candidate
        run: |
          # Frozen candidates predating filesystem sharding still collect on each shard.
          if grep -q -- '--check-shard-coverage' scripts/release_checks.py; then
            "$RUNNER_TEMP/release-venv/bin/python" scripts/release_checks.py --check-shard-coverage --release
          fi
      # The browser VM runs the browser tests; for a candidate frozen before --part existed, the helper runs its whole
      # gate on the product VM instead, so that VM needs browsers too.
      - name: Does this VM run browser tests
        id: browsers
        run: |
          needed=false
          if [ "$TICO_RELEASE_PART" = browser ]; then needed=true
          elif [ "$TICO_RELEASE_PART" = product ] && ! grep -q "add_argument('--part'" candidate/scripts/release_checks.py
          then needed=true; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - if: steps.browsers.outputs.needed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - if: steps.browsers.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('candidate/package-lock.json') }}
      - name: Use the canonical Ubuntu package mirror
        if: steps.browsers.outputs.needed == 'true'
        # Keep the signed Ubuntu packages; avoid Azure mirror stalls before tests start.
        run: |
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browsers
        if: steps.browsers.outputs.needed == 'true'
        working-directory: candidate
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      # The release's own Linux binaries, where a checkout's build would be; hosted_release_check.py run checks on
      # every VM that their build ids match the candidate's sources. Setup above overlaps their build: wait for the
      # native-linux x86_64 job to finish, and fail this part if that build did not succeed. Only product, desktop
      # and python-1/python-2 (the native test files, release_checks.py NATIVE_SHARDS) need them; the others start at once.
      # A candidate frozen before native-first python shards may put native tests on any python VM: all of them wait.
      - name: Does this VM need the release binaries
        id: binaries
        env:
          TICO_MATRIX_BINARIES: ${{ matrix.binaries }}
        run: |
          needed=true
          if [ "$TICO_MATRIX_BINARIES" = no ]; then needed=false
            if [ "$TICO_RELEASE_PART" = python ] && ! grep -q native_first candidate/scripts/release_checks.py
            then needed=true; fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Wait for the release Linux binaries
        if: steps.binaries.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 150); do
            job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              -q '[.jobs[] | select((.name | startswith("native-linux (")) and (.name | contains("linux-x86_64"))) | {status, conclusion}]')"
            [ "$(jq 'length' <<<"$job")" = 1 ] || { echo "::error::The native-linux x86_64 build was not found."; exit 1; }
            if [ "$(jq -r '.[0].status' <<<"$job")" = completed ]; then
              [ "$(jq -r '.[0].conclusion' <<<"$job")" = success ] && exit 0
              echo "::error::The release Linux binaries did not build."; exit 1
            fi
            sleep 10
          done
          echo "::error::The release Linux binaries were not built within 25 minutes."; exit 1
      - if: steps.binaries.outputs.needed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runner-linux-x86_64
          path: ${{ runner.temp }}/native
      - name: Place the release binaries
        if: steps.binaries.outputs.needed == 'true'
        working-directory: candidate
        run: |
          mkdir -p runner-rs/target/release relay-rs/target/release
          gunzip -c "$RUNNER_TEMP/native/tico-runner-linux-x86_64.gz" > runner-rs/target/release/tico-runner
          gunzip -c "$RUNNER_TEMP/native/tico-screen-relay-linux-x86_64.gz" > relay-rs/target/release/tico-screen-relay
          chmod 0755 runner-rs/target/release/tico-runner relay-rs/target/release/tico-screen-relay
      # Tests that build other Rust code still find a toolchain.
      - name: Install Rust
        if: matrix.part != 'browser'
        run: |
          rustup toolchain install 1.92 --profile minimal
          rustup default 1.92
      # The Tauri app's Linux build dependencies, as .github/workflows/app.yml installs them.
      - name: Desktop build dependencies
        if: matrix.part == 'desktop'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpulse-dev
      - if: matrix.part == 'desktop'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: candidate/app -> target
          shared-key: release-desktop
      # The product part tests the release's own images (amd64, this VM's architecture), pulled by digest, once the
      # three amd64 builds have finished. The arm64 builds finish on their own; release-check needs every image.
      - if: matrix.part == 'product'
        name: Wait for the release images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 120); do
            images="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              -q '[.jobs[] | select((.name | startswith("images (")) and (.name | contains("amd64"))) | {status, conclusion}]')"
            failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$images")"
            [ "$failed" = 0 ] || { echo "::error::An image build did not succeed."; exit 1; }
            [ "$(jq '[.[] | select(.status == "completed")] | length' <<<"$images")" = 3 ] && exit 0
            sleep 10
          done
          echo "::error::The images were not built within 20 minutes."
          exit 1
      - if: matrix.part == 'product'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*-amd64
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - if: matrix.part == 'product'
        name: Select the release images
        run: |
          d="$RUNNER_TEMP/digests"
          images="server=ghcr.io/ticoteam/tico@$(cat "$d/tico-amd64")"
          images="$images,runner=ghcr.io/ticoteam/tico-runner@$(cat "$d/tico-runner-amd64")"
          images="$images,updater=ghcr.io/ticoteam/tico-updater@$(cat "$d/tico-updater-amd64")"
          { echo "TICO_RELEASE_IMAGES=$images"; echo "TICO_RELEASE_VERSION=$CANDIDATE_VERSION"; } >> "$GITHUB_ENV"
      - name: Write the python part's junit report (xunit1), for the shard timings
        if: matrix.part == 'python'
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          echo "PYTEST_ADDOPTS=$PYTEST_ADDOPTS -o junit_family=xunit1 --junitxml=$RUNNER_TEMP/junit/python-${TICO_RELEASE_SHARD//\//-of-}.xml" >> "$GITHUB_ENV"
      - name: Write the browser part's per-script seconds (ui-tests.cjs TICO_UI_TIMINGS), for the PR check groups
        if: matrix.part == 'browser'
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          echo "TICO_UI_TIMINGS=$RUNNER_TEMP/junit/browser-${TICO_RELEASE_SHARD//\//-of-}.json" >> "$GITHUB_ENV"
      - name: Write the incremental plan this VM runs from
        if: needs.candidate.outputs.plan != ''
        env:
          PLAN: ${{ needs.candidate.outputs.plan }}
        run: printf '%s\n' "$PLAN" > "$RUNNER_TEMP/increment-plan.json"
      - name: Run the candidate's unchanged release gate, this part
        # The helper takes its slice only from --part/--shard (argparse), never from the environment.
        run: |
          set -- --part "$TICO_RELEASE_PART"
          [ -z "$TICO_RELEASE_SHARD" ] || set -- "$@" --shard "$TICO_RELEASE_SHARD"
          [ -z "$TICO_INCREMENT_SUITE" ] || set -- "$@" --plan "$RUNNER_TEMP/increment-plan.json" --suite "$TICO_INCREMENT_SUITE"
          "$RUNNER_TEMP/release-venv/bin/python" validation-control/scripts/hosted_release_check.py run "$@"
      - name: Collect only bounded validation logs
        if: always()
        run: |
          if [ -f validation-control/scripts/hosted_release_check.py ]; then
            python3 validation-control/scripts/hosted_release_check.py collect
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ runner.temp }}/release-validation-report
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && (matrix.part == 'python' || matrix.part == 'browser')
        with:
          name: release-junit-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: ${{ runner.temp }}/junit
          retention-days: 30
          if-no-files-found: warn

  # The factory simulation (evals/factory): scripted bots work the candidate's Dev board on a fake clock, seeds 1-3,
  # packed into seven groups of about equal time, each VM running four scenarios at a time (-j 4). A failed check
  # fails the release; NOTE lines (tickets that ran long) go in the job summary for the Release Manager. A candidate
  # frozen before the sim could shard skips it.
  factory-sim:
    needs: candidate
    # An incremental validation runs the sim only when its plan says a change reaches it (release_increment.plan_for).
    if: needs.candidate.outputs.plan == '' || fromJSON(needs.candidate.outputs.plan).factory
    name: factory-sim-${{ matrix.shard }}
    runs-on: ${{ (vars.TICO_CI_HOSTED == 'true' || inputs.anchor != '') && 'ubuntu-24.04' || format('runs-on={0}/volume=30gb:gp3:125mbs:3000iops/runner=4cpu-linux-x64/family=m8+m7+m6+r8+r7/extras=s3-cache', github.run_id) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1', '2', '3', '4', '5', '6', '7']
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Free disk on a GitHub-hosted runner (about 14 GB free there; RunsOn's volume is 30 GB)
        if: vars.TICO_CI_HOSTED == 'true' || inputs.anchor != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Does the candidate shard the sim
        id: has
        run: |
          if grep -q 'add_argument("--shard"' candidate/evals/factory/run.py 2>/dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "The candidate has no sharded factory sim; skipped." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.has.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - if: steps.has.outputs.run == 'true'
        name: Install
        working-directory: candidate
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          python3 -m pip install --disable-pip-version-check uv==0.13.1
          python3 -m uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r backend/requirements-dev.txt
      - if: steps.has.outputs.run == 'true'
        name: Run this group of the factory sim
        working-directory: candidate
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -W ignore -m evals.factory.run --seeds 1-3 --shard "$SHARD/7" -j 4 2>&1 \
            | tee "$RUNNER_TEMP/sim.log"
      - if: always() && steps.has.outputs.run == 'true'
        name: Summary
        run: |
          { echo "### Factory sim, group ${{ matrix.shard }} of 7"; echo '```'
            awk '/^== /{h=$0; next} /^ +(FAIL|NOTE) /{if(h){print h; h=""} print} /scenario runs in/' "$RUNNER_TEMP/sim.log"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Per-file and per-script seconds from this gate's reports, in the format PR checks size their groups from
  # (scripts/pr_checks.py durations). Optional: it never changes the release verdict or the run's conclusion.
  test-timings:
    needs: gate
    # A full validation's timings only: an incremental one measures a part of the gate.
    if: inputs.anchor == ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/pr_checks.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-junit-${{ github.run_id }}-*
          path: ci-results
          merge-multiple: true
      - run: python3 scripts/pr_checks.py durations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings
          path: durations.json
          retention-days: 30

  # The one verdict: the release passes only when every part passed and the Linux binaries and images built.
  release-check:
    needs: [candidate, gate, factory-sim, images]
    if: always()
    # Only compares results: GitHub-hosted starts in seconds, where a RunsOn VM boots for ~20 s at the run's very end.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the release gate passed
        env:
          GATE: ${{ needs.gate.result }}
          SIM: ${{ needs.factory-sim.result }}
          IMAGES: ${{ needs.images.result }}
          PLAN: ${{ needs.candidate.outputs.plan }}
        run: |
          echo "Release gate parts: $GATE; factory sim: $SIM; images: $IMAGES"
          # An incremental validation's plan may leave the factory sim out: a skipped sim is then the plan's choice.
          sim_ok=false
          [ "$SIM" = success ] && sim_ok=true
          [ "$SIM" = skipped ] && [ -n "$PLAN" ] && [ "$(jq -r .factory <<<"$PLAN")" = false ] && sim_ok=true
          test "$GATE" = success && [ "$sim_ok" = true ] && test "$IMAGES" = success
