[package]
name = "tico-screen-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license-file = "../LICENSE"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
subtle = "2"
# Server certificates verify against the OS trust store, the bundled webpki-roots list where there is none (crate::tls).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
webpki-roots = "1"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
sha2 = "0.10"
