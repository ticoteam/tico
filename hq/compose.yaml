# Tico HQ: the collector behind the anonymous usage count (PRIVACY.md, docs/telemetry.md). It is a separate
# service with its own database. It is never part of a customer's Tico, and it will not start without TICO_HQ_KEY.
#
#   cp hq/.env.example hq/.env      # set TICO_HQ_KEY and pick a front door
#   docker compose -f hq/compose.yaml --env-file hq/.env up -d --build
#
# The service listens on 127.0.0.1:8770. Give it its own public hostname with ONE of the profiles below, and do not put
# it behind Cloudflare Access: installs call it without signing in. A proxy that logs requests would log the query
# string (the install ID), so leave that logging off there too.
#   COMPOSE_PROFILES=cloudflared   an HQ-only tunnel (HQ_TUNNEL_TOKEN, HQ_DOMAIN). HQ writes the tunnel's route at every
#                                  start: HQ_DOMAIN to http://hq:8770, anything else a 404. Use this next to a Tico
#                                  that already holds ports 80 and 443.
#   COMPOSE_PROFILES=caddy         automatic HTTPS for HQ_DOMAIN on ports 80 and 443 (a host of its own).
#   COMPOSE_PROFILES=backup        add to either: Litestream copies the database to HQ_BACKUP_URL.
name: tico-hq

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  hq:
    <<: *hardening
    build: .
    image: tico-hq:local
    read_only: true
    tmpfs: [/tmp]
    environment:
      TICO_HQ_KEY: ${TICO_HQ_KEY:?set TICO_HQ_KEY in hq/.env to run the collector}
      # Where the real client address comes from behind a proxy: X-Forwarded-For (caddy) or CF-Connecting-IP
      # (cloudflared). Used only for the in-memory rate limit. Empty: the connection's own address.
      HQ_CLIENT_IP_HEADER: ${HQ_CLIENT_IP_HEADER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The team's key for the support ticket routes (docs/support.md). Empty: those routes answer 404.
      HQ_STAFF_KEY: ${HQ_STAFF_KEY:-}
      HQ_JUDGE_KEY: ${HQ_JUDGE_KEY:-}
      HQ_JUDGE_URL: ${HQ_JUDGE_URL:-}
      # The public hostname: the tunnel's route (cloudflared) and the certificate (caddy).
      HQ_DOMAIN: ${HQ_DOMAIN:-}
      # POST /v1/recruit (hq/recruit.py): without a key, suggestions come from the local recommender only.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HQ_RECRUIT_MODEL: ${HQ_RECRUIT_MODEL:-}
      HQ_RECRUIT_DAILY_CAP: ${HQ_RECRUIT_DAILY_CAP:-}
      # The setup page on tico.team (hq/onboarding.py): which page origins may call /v1/onboarding (default
      # https://tico.team), and whether the per-session counts are kept (on; empty or anything else: off).
      HQ_ONBOARDING_ORIGINS: ${HQ_ONBOARDING_ORIGINS:-}
      HQ_ONBOARDING_COUNTS: ${HQ_ONBOARDING_COUNTS:-}
    volumes:
      - hq-data:/data
      # The cloudflared service's route, written by HQ at every start (hq/tunnel.py). No secret in it.
      - hq-tunnel:/tunnel
    ports: ["127.0.0.1:8770:8770"]

  caddy:
    <<: *hardening
    profiles: [caddy]
    image: caddy:2-alpine
    # No `log` block: Caddy's access log is off by default, and stays off so a query string never reaches a file.
    command: caddy reverse-proxy --from ${HQ_DOMAIN:-} --to hq:8770
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [hq]

  # Always run with the route HQ writes (HQ_DOMAIN to http://hq:8770, a 404 for the rest): a tunnel run with only its
  # token and no route of its own (a locally managed one) logs "No ingress rules" and answers 503. A tunnel whose Public
  # Hostname is set in the Cloudflare dashboard keeps that route: cloudflared prefers what Cloudflare holds. The file is
  # world-readable (0644 in a 0755 volume) because cloudflared runs as its own non-root user; it holds no secret.
  cloudflared:
    <<: *hardening
    profiles: [cloudflared]
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate --config /tunnel/cloudflared.yml run
    environment:
      TUNNEL_TOKEN: ${HQ_TUNNEL_TOKEN:-}
    volumes:
      - hq-tunnel:/tunnel:ro
    depends_on:
      hq: {condition: service_healthy}

  # Optional backups of the one SQLite file, continuously, to any S3-compatible bucket (the same tool the Tico server
  # uses). Set HQ_BACKUP_URL=s3://bucket/path and, for R2 or MinIO, HQ_BACKUP_ENDPOINT. Restore: see docs/telemetry.md.
  backup:
    <<: *hardening
    profiles: [backup]
    image: litestream/litestream:0.5.17
    # The hq image's user (hq/Dockerfile): it owns /data/hq.db; as root with no capabilities Litestream cannot read it.
    user: "10005:10005"
    command: replicate
    environment:
      HQ_BACKUP_URL: ${HQ_BACKUP_URL:-}
      HQ_BACKUP_ENDPOINT: ${HQ_BACKUP_ENDPOINT:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - hq-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on: [hq]

volumes:
  hq-data:
  hq-tunnel:
  caddy-data:
  caddy-config:
