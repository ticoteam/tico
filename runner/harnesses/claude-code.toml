# Anthropic Claude Code. Signs in with a Claude subscription (link, then a code pasted back).
id = "claude-code"
name = "Claude Code"
host = "claude"
runtime = "claude"
executable = "claude"
providers = ["anthropic"]

[install]
method = "npm"
package = "@anthropic-ai/claude-code"

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'

[update]
policy = "latest"

[auth]
methods = ["subscription", "api-key"]
api_key_env = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY"]

[login]
command = ["auth", "login", "--claudeai"]
terminal = true
paste_code = true

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
terminal_login = ["auth", "login"]
api_keys = "computer"
subscription_marker = "signed in"
subscription_profiles = true
profile_home = "HOME"
profile_dirs = [".claude"]
weekly_usage = "turns"
account = "status-json"
mcp_transports = ["http", "sse"]
# An expired stored token is refreshed by the first turn, so turns wait for one to land before the rest start.
serial_cold_start = true
compaction = true
# A message for the running turn is written into it (stream-json input, needs a CLI that echoes it).
steer = true
resume_command = "claude --resume"
model_list = "host"
repo_permission_lint = true
repo_commands = true

[capabilities.sign_in_status]
check = "json"
args = ["auth", "status", "--json"]
field = "loggedIn"
method_field = "authMethod"
ready_detail = "Signed in with Claude"
missing_detail = "Claude login required"
timeout_s = 30
