# The catch-all: pi runs any provider that has no CLI of its own, with an OpenRouter API key
# (docs/harnesses.md explains why pi and not OpenCode or aider).
id = "pi"
name = "pi (multi-provider)"
host = "pi"
runtime = "pi"
executable = "pi"
catch_all = true
providers = ["deepseek", "moonshot", "mistral", "openrouter"]

[install]
method = "npm"
package = "@earendil-works/pi-coding-agent"

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'

[update]
policy = "latest"

[auth]
methods = ["api-key"]
api_key_env = ["OPENROUTER_API_KEY"]

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
api_keys = "bot"
mcp_transports = ["http"]
resume_command = "pi --resume"
model_list = "host"
# pi reads its key from the turn environment and keeps its agent dir in $HOME, so a leased turn user signs in.
isolated_user = true
# Compact at sets pi's compaction.reserveTokens (hosts/pi.rs reserve_tokens); pi's `compaction_end` marks the compaction.
compaction = true
compaction_events = true

[capabilities.sign_in_status]
check = "bot-key"
