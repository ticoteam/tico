[pytest]
# `slow` tests (real git, Docker, real servers, long timers) are left out by default; `pytest -m slow` runs only them,
# `pytest -m ""` runs everything. scripts/release_checks.py --release runs them.
# Several bots run the full suite at once on one box: cap the workers at 8 (an explicit -n, as
# scripts/release_checks.py passes, still wins).
addopts = --import-mode=importlib -n 8 -p no:warnings -m "not slow"
# A passing test's tmp_path (each holds a ~3 MB hub database) is removed when the test ends, before the kernel's 30 s
# writeback: with no per-commit sync (conftest.py) its pages are dropped unwritten. Keeping every directory of the last
# three runs had bot test suites writing ~15 MB/s each to the team host's shared disk. Failed tests keep theirs.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
markers =
    slow: real processes, Docker or long timers; opt-in (pytest -m slow), run at release
