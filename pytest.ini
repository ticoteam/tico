[pytest]
# `slow` tests (real git, Docker, real servers, long timers) are left out by default; `pytest -m slow` runs only them,
# `pytest -m ""` runs everything. scripts/release_checks.py --release runs them.
# Several bots run the full suite at once on one box: as many workers as cores are free, 1 to 8 (conftest.py
# pytest_xdist_auto_num_workers; an explicit -n, as scripts/release_checks.py passes, still wins).
addopts = --import-mode=importlib -n auto -m "not slow"
# A passing test's tmp_path (each holds a ~3 MB hub database) is removed when the test ends, before the kernel's 30 s
# writeback: with no per-commit sync (conftest.py) its pages are dropped unwritten. Keeping every directory of the last
# three runs had bot test suites writing ~15 MB/s each to the team host's shared disk. Failed tests keep theirs.
# A default test takes well under a second: a hung one prints every thread's stack after 120 s, so a CI shard that
# times out names the test instead of ending in a bare cancel.
faulthandler_timeout = 120
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
markers =
    slow: real processes, Docker or long timers; opt-in (pytest -m slow), run at release
    alone: wall-clock budget tests; the release gate runs them by themselves after the parallel tests
# Warnings are errors: a coroutine that never ran, an exception raised in a thread or in __del__, or our own deprecated
# call fails the test that caused it. The `ignore:` lines are third-party warnings we cannot fix yet, one each with its
# library and reason above it. scripts/pytest_warning_ignores.py (run by scripts/lint.sh) keeps their count from growing.
filterwarnings =
    error
    # fastapi's test client is starlette's, which warns that httpx is deprecated there. Stays until the httpx2 move.
    # Starlette's warning is its own class (a UserWarning, not a DeprecationWarning), so the category names that class.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    # FastAPI gives each non-embedded request body the field alias "body" (fastapi/dependencies/utils.py), and pydantic
    # warns that the alias has no effect where FastAPI validates it. Stays until FastAPI stops setting it.
    ignore:The 'alias' attribute with value 'body' was provided to the `Field\(\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning
