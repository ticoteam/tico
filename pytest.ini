[pytest]
# `slow` tests (real git, Docker, real servers, long timers) are left out by default; `pytest -m slow` runs only them,
# `pytest -m ""` runs everything. scripts/release_checks.py --release runs them.
# Several bots run the full suite at once on one box: as many workers as cores are free, 1 to 8 (conftest.py
# pytest_xdist_auto_num_workers; an explicit -n, as scripts/release_checks.py passes, still wins).
addopts = --import-mode=importlib -n auto -m "not slow"
# A passing test's tmp_path (each holds a ~3 MB hub database) is removed when the test ends, before the kernel's 30 s
# writeback: with no per-commit sync (conftest.py) its pages are dropped unwritten. Keeping every directory of the last
# three runs had bot test suites writing ~15 MB/s each to the team host's shared disk. Failed tests keep theirs.
# A default test takes well under a second: a hung one prints every thread's stack after 120 s, so a CI shard that
# times out names the test instead of ending in a bare cancel.
faulthandler_timeout = 120
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
markers =
    slow: real processes, Docker or long timers; opt-in (pytest -m slow), run at release
    flaky: listed in scripts/flaky-tests.json (owner, reason, exit date); one retry if the first attempt fails (conftest.py)
    alone: wall-clock budget tests; the release gate runs them by themselves after the parallel tests
# Warnings are errors: a coroutine that never ran, an exception raised in a thread or in __del__, or our own deprecated
# call fails the test that caused it. The `ignore:` lines are third-party warnings we cannot fix yet, one each with its
# library and reason above it; the `follow-up: fix leak` ones are our own leaks and come out when each is fixed.
# scripts/pytest_warning_ignores.py (run by scripts/lint.sh) keeps their count from growing.
filterwarnings =
    error
    # fastapi's test client is starlette's, which warns that httpx is deprecated there. Stays until the httpx2 move.
    # Starlette's warning is its own class (a UserWarning, not a DeprecationWarning), so the category names that class.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    # FastAPI sets the field alias "body" on a body it embeds (_get_body_field, fastapi/dependencies/utils.py). Pydantic
    # warns that the alias has no effect where FastAPI validates that field, traced through FastAPI's request_body_to_args
    # into pydantic's TypeAdapter. No project code sets alias="body", and a minimal FastAPI app on fastapi 0.141.1 with
    # pydantic 2.14.1 did not reproduce the warning, so the exact trigger is unconfirmed. Stays until FastAPI drops the alias.
    ignore:The 'alias' attribute with value 'body' was provided to the `Field\(\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning
    # follow-up: fix leak. Each of these is a ResourceWarning for an object that was garbage-collected while still open: other
    # sqlite connections, sockets, files, scandir iterators, urllib HTTPError responses, and a subprocess.Popen that was never
    # waited on. The module that raises one depends on which code releases the object, so they are scoped by message; the
    # subprocess one is also scoped to its module. The HTTPError sources are not all traced yet: some tests build a response
    # and never close it (test_hq_tickets, test_decide_gateway), and an HTTPError is also a URLError, so a handler that
    # catches URLError or OSError can hold one unclosed.
    ignore:unclosed database in <sqlite3\.Connection:ResourceWarning
    ignore:unclosed <socket\.socket:ResourceWarning
    ignore:unclosed <ssl\.SSLSocket:ResourceWarning
    ignore:unclosed file <_io\.:ResourceWarning
    ignore:unclosed scandir iterator:ResourceWarning
    ignore:Implicitly cleaning up <HTTPError:ResourceWarning
    ignore:subprocess \d+ is still running:ResourceWarning:subprocess$
