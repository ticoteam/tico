# Tico server: the app and its database, one front door, and the updater. It runs no bots: computers
# join with a one-time code (docker/runner.compose.yaml, or a Mac). See docs/install.md.
#   docker compose up -d                       # front door and updater chosen by COMPOSE_PROFILES in .env
#   docker compose pull && docker compose up -d   # update
name: tico

x-image: &image ${TICO_IMAGE:-ghcr.io/ticoteam/tico}:${TICO_TAG:-latest}

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  server:
    <<: *hardening
    image: *image
    command: server
    # A runner on the same host (docker/runner.compose.yaml, cpu_shares 512) yields the CPU to the server and its
    # front doors when they compete; the weights are relative, so they suit any machine size and cost nothing idle.
    cpu_shares: 4096
    read_only: true
    tmpfs: [/tmp]
    environment:
      TICO_TEAM_NAME:
      TICO_COMPANY_NAME:
      TICO_OWNER_EMAIL:
      TICO_OWNER_NAME:
      TICO_BLOCK_EXTERNAL_INVITES:
      TICO_TOKEN_ALERT_INPUT:
      TICO_CREDENTIAL_ADMINS:
      TICO_CREDENTIAL_KMS_KEY:
      TICO_PROCESSING_OPERATORS:
      TICO_ALB_ARN:
      TICO_ALB_REGION:
      TICO_DOMAIN:
      TICO_DOMAIN_ALIASES:
      TICO_PORT: ${TICO_PORT:-8765}
      TICO_PUBLIC_URL:
      # Visuals in replies (backend/visuals.py): a separate site of their own; unset = pictures, video and audio only.
      TICO_VISUAL_ORIGIN:
      TICO_VISUAL_SECRET:
      # Local Caddy serving is a separate opt-in; a visual origin may belong to an external CDN.
      TICO_CADDY_VISUALS:
      # The Company page's own origin (docs/company-page.md), served by the Caddy front door; unset = no page origin.
      TICO_READER_ORIGIN:
      # Where the page's public files are written; unset = the data directory's company-page-public folder.
      TICO_COMPANY_PAGE_DIR:
      TICO_RUNNER_URL:
      TICO_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-tico}
      TICO_SERVER_NETWORK: ${TICO_SERVER_NETWORK:-${COMPOSE_PROJECT_NAME:-tico}_default}
      # A Tico our team runs for a company (own or invited); unset is self-hosted (backend/config.py).
      TICO_HOSTED:
      TICO_ENVIRONMENT_ID:
      TICO_AUTH_PROXY:
      # TICO_AUTH_PROXY=owner-link: the hash of the hosted owner's first sign-in link (backend/owner_link.py).
      TICO_OWNER_LINK_HASH:
      TICO_OIDC_ISSUER:
      TICO_OIDC_CLIENT_ID:
      TICO_OIDC_CLIENT_SECRET:
      TICO_OIDC_ALLOWED_DOMAINS:
      TICO_OIDC_LABEL:
      TICO_CORS_ORIGINS:
      TICO_CLIENT_IP_HEADER:
      # Forwarded client addresses are believed only from loopback (the server's own relay), the two front doors'
      # fixed addresses on the edge network below, and its dynamic range, where only this server and the tunnel's hold
      # live, so each visitor keeps their own rate-limit bucket.
      TICO_TRUSTED_PROXIES: ${TICO_TRUSTED_PROXIES:-127.0.0.1/32,::1/128,${TICO_CADDY_ADDRESS:-172.30.254.2}/32,${TICO_CLOUDFLARED_ADDRESS:-172.30.254.3}/32,${TICO_EDGE_DYNAMIC_RANGE:-172.30.254.8/29}}
      TICO_GOOGLE_OAUTH_CLIENT_ID:
      TICO_GOOGLE_OAUTH_CLIENT_SECRET:
      TICO_ACCESS_ISSUER:
      TICO_ACCESS_AUDIENCE:
      TICO_GITHUB_OWNER:
      TICO_ENABLED_PROVIDERS:
      TICO_DEFAULT_RUNTIME:
      TICO_DEFAULT_MODEL:
      TICO_BACKUP:
      TICO_BACKUP_URL:
      TICO_BACKUP_ENDPOINT:
      TICO_BACKUP_REGION:
      TICO_BACKUP_SYNC_INTERVAL:
      TICO_INITIALIZE_EMPTY:
      TICO_SCHEDULER:
      TICO_REHEARSAL:
      LITESTREAM_ACCESS_KEY_ID:
      LITESTREAM_SECRET_ACCESS_KEY:
      TICO_BLOB_BUCKET:
      TICO_BLOB_REGION:
      TICO_BLOB_ENDPOINT:
      TICO_BLOB_CREDENTIALS:
      TICO_BLOB_ACCESS_KEY_ID:
      TICO_BLOB_SECRET_ACCESS_KEY:
      TICO_UPLOAD_MAX_BYTES:
      TICO_S3_VIEW_URLS:
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      GEMINI_API_KEY:
      XAI_API_KEY:
      OPENROUTER_API_KEY:
      TICO_GATEWAY_KEY:
      TICO_GATEWAY_SECRET_ARN:
      TICO_GATEWAY_URL:
      # The recommended setup's choices (scripts/install.sh --recommended), read on the server's first start.
      TICO_GATEWAY_INVITE:
      TICO_INSTALL_PRESET:
      TICO_SAMPLE_COMPANY:
      TICO_COMPANY_FILE_B64:
      # A starter plan too big for the env (Tico's hosted servers): the file setup copied to ./company-file, mounted below.
      TICO_COMPANY_FILE:
      TICO_MODELS_PRESET:
      TYPESAFE_API_KEY:
      TICO_TYPESAFE_SECRET_ARN:
      TICO_DECISIONS_DAILY_CALLS_OWNER:
      TICO_DECISIONS_DAILY_CALLS_HUMAN:
      TICO_DECISIONS_DAILY_CALLS_BOT:
      TICO_DECISIONS_MONTHLY_USD:
      TICO_DECISIONS_JEV_USD_PER_MTOK_INPUT:
      TICO_DECISIONS_JEV_USD_PER_MTOK_OUTPUT:
      TICO_RULES_MONTHLY_USD:
      TICO_RULE_CHECK_LEVEL:
      TICO_RULES_CHECK_DAILY:
      TICO_RULE_CHECK_CONCURRENCY:
      TICO_DECISIONS_IDEA_TRIAGE:
      TICO_STALE_REVIEW:
      TICO_TOPIC_FRESH:
      TICO_STALL_TRIAGE:
      TICO_UPDATER_URL:
      TICO_UPDATE_CHECK:
      TICO_SUPPORT:
      # Letting Tico support in from a request (docs/support.md); off unless this is on.
      TICO_SUPPORT_ACCESS:
      TICO_TELEMETRY:
      DO_NOT_TRACK:
      TICO_TELEMETRY_DEBUG:
      TICO_HQ_URL:
      TICO_INBOUND_KEY:
      TICO_INBOUND_URL:
      # HQ's read-only staff key, on the Tico team's own server only: its Health page shows HQ's nightly billing check.
      TICO_HQ_STAFF_READ_KEY:
      TICO_GITHUB_REVIEW_ROLE:
      TICO_TITLE_LINT:
      # Naming, a mounted integrations folder, the AWS region (KMS, Secrets Manager, S3) and the AWS identity the server
      # must run as. Unset keeps the defaults.
      TICO_APP_NAME:
      TICO_ASSISTANT_NAME:
      TICO_INTEGRATIONS_DIR:
      AWS_REGION:
      AWS_DEFAULT_REGION:
      TICO_EXPECTED_AWS_ACCOUNT:
      TICO_EXPECTED_AWS_ROLE:
    volumes:
      - tico-data:/data
      - tico-control:/control
      # Continuous local copy of the database and attachments when TICO_BACKUP_URL is unset. A separate
      # volume, so deleting tico-data alone loses nothing; it is still on this server's disk.
      - tico-backups:/backups
      # The Cloudflare tunnel's route for TICO_DOMAIN, written at every start for the cloudflared service below.
      - tico-tunnel:/tunnel
      # Complete Caddy generations and its supervisor, produced before the server becomes healthy.
      - tico-caddy:/caddy-generated
      # The starter plan setup copied here at first boot, when it was too big for the env (TICO_COMPANY_FILE). A folder,
      # read-only, so a server without one (or an update from before it) still starts. Setup names the host folder by
      # its absolute path: the updater runs Compose with another project directory, where ./ is not this folder.
      # Without the setting it is an empty volume, so no install gets a host folder it never asked for.
      - ${TICO_COMPANY_FILE_DIR:-tico-company-file}:/run/tico/company-file:ro
    # Loopback only: for health checks and TICO_AUTH_PROXY=none test installs.
    ports: ["127.0.0.1:${TICO_PORT:-8765}:8765"]
    networks: [default, edge]

  # Slack: DMs and @mentions reach your bots. Same image, its own process, an outbound websocket only
  # (Socket Mode), so no port and no public URL. Off unless COMPOSE_PROFILES includes slack. The tokens
  # are pasted in Settings > Slack and stored encrypted in the database, not in .env. See docs/slack.md.
  slack:
    <<: *hardening
    profiles: [slack]
    image: *image
    command: slack-gateway
    read_only: true
    tmpfs: [/tmp]
    healthcheck: {disable: true}  # the image's check probes the server's port; Health shows this service
    environment:
      TICO_TEAM_NAME:
      TICO_COMPANY_NAME:
      TICO_OWNER_EMAIL:
      TICO_OWNER_NAME:
      TICO_BLOCK_EXTERNAL_INVITES:
      TICO_CREDENTIAL_ADMINS:
      TICO_CREDENTIAL_KMS_KEY:
      TICO_PROCESSING_OPERATORS:
      TICO_ALB_ARN:
      TICO_ALB_REGION:
      TICO_DOMAIN:
      TICO_PORT: ${TICO_PORT:-8765}
      TICO_PUBLIC_URL:
      TICO_RUNNER_URL:
      TICO_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-tico}
      TICO_SERVER_NETWORK: ${TICO_SERVER_NETWORK:-${COMPOSE_PROJECT_NAME:-tico}_default}
      # A Tico our team runs for a company (own or invited); unset is self-hosted (backend/config.py).
      TICO_HOSTED:
      # Sign-in settings: the gateway loads the same settings as the server and refuses to start when the
      # selected proxy (oidc, cloudflare) is missing its own.
      TICO_AUTH_PROXY:
      # TICO_AUTH_PROXY=owner-link: the hash of the hosted owner's first sign-in link (backend/owner_link.py).
      TICO_OWNER_LINK_HASH:
      TICO_OIDC_ISSUER:
      TICO_OIDC_CLIENT_ID:
      TICO_OIDC_CLIENT_SECRET:
      TICO_OIDC_ALLOWED_DOMAINS:
      TICO_OIDC_LABEL:
      TICO_ACCESS_ISSUER:
      TICO_ACCESS_AUDIENCE:
      TICO_REHEARSAL:
      TICO_ENABLED_PROVIDERS:
      TICO_DEFAULT_RUNTIME:
      TICO_DEFAULT_MODEL:
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      GEMINI_API_KEY:
      XAI_API_KEY:
      OPENROUTER_API_KEY:
      TICO_GATEWAY_KEY:
      TICO_GATEWAY_SECRET_ARN:
      TICO_GATEWAY_URL:
      TYPESAFE_API_KEY:
      TICO_TYPESAFE_SECRET_ARN:
      TICO_DECISIONS_DAILY_CALLS_OWNER:
      TICO_DECISIONS_DAILY_CALLS_HUMAN:
      TICO_DECISIONS_DAILY_CALLS_BOT:
      TICO_DECISIONS_MONTHLY_USD:
      TICO_DECISIONS_JEV_USD_PER_MTOK_INPUT:
      TICO_DECISIONS_JEV_USD_PER_MTOK_OUTPUT:
      SLACK_TEAM_ID:
      SLACK_APP_ID:
      TICO_SLACK_ROUTE_THRESHOLD:
      TICO_SLACK_ASK_THRESHOLD:
      TICO_SLACK_MAX_RECIPIENTS:
      TICO_SLACK_DIGEST_MINUTES:
      TICO_SLACK_DIGEST_CAP:
      TICO_SLACK_SECRET_ARN:
      TICO_TELEMETRY:
      DO_NOT_TRACK:
      TICO_APP_NAME:
      TICO_ASSISTANT_NAME:
      TICO_INTEGRATIONS_DIR:
      AWS_REGION:
      AWS_DEFAULT_REGION:
      TICO_EXPECTED_AWS_ACCOUNT:
      TICO_EXPECTED_AWS_ROLE:
    volumes:
      - tico-data:/data
    depends_on:
      server: {condition: service_healthy}

  # Front door 1: automatic HTTPS for the app and an explicitly enabled restricted visual origin.
  # A private supervisor validates each generated snapshot and removes stale sites before replacing it.
  caddy:
    <<: *hardening
    profiles: [caddy]
    cpu_shares: 4096
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    entrypoint: ["/bin/sh", "/generated/supervisor.sh"]
    command: []
    tmpfs: [/tmp]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    networks:
      edge: {ipv4_address: "${TICO_CADDY_ADDRESS:-172.30.254.2}"}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - tico-caddy:/generated:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/generated/supervisor.sh", "health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 1s
      retries: 3
    depends_on:
      server: {condition: service_healthy}

  # Front door 2: a named Cloudflare tunnel. No ports. It always runs with a small config, written by the
  # server from TICO_DOMAIN, that routes TICO_DOMAIN to the hold below (http://hold:8080) and answers anything else
  # with a 404; without it a tunnel that has no route of its own (a reused, locally managed one) answers 503. A tunnel
  # whose Public Hostname is set in the Cloudflare dashboard keeps that route: cloudflared prefers what Cloudflare holds.
  # cloudflared reads the file only when it starts. It is ingress.yml: a cloudflared from an older compose file reads
  # cloudflared.yml, which only an older server writes (straight to server:8765), so the changed command is what moves
  # an install over. The update that brings it recreates cloudflared once, after the hold answers (the updater starts
  # with --no-deps, so it starts the hold and checks it first); a hold that does not come up rolls the update back,
  # and cloudflared keeps the old route.
  cloudflared:
    <<: *hardening
    profiles: [cloudflared]
    cpu_shares: 4096
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: tunnel --no-autoupdate --config /tunnel/ingress.yml run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      edge: {ipv4_address: "${TICO_CLOUDFLARED_ADDRESS:-172.30.254.3}"}
    volumes:
      - tico-tunnel:/tunnel:ro
    depends_on:
      server: {condition: service_healthy}
      hold: {condition: service_started}

  # Between the tunnel and the server, since cloudflared cannot retry: while the server restarts (an update, a deploy)
  # a request waits here and then gets its normal answer, the policy of the Caddy front door (backend/caddy_assets.py)
  # and the cell router (setup/cell.py). A dial that fails is tried again every 250 ms for up to 30 s; after a
  # connection opened only a GET is retried, so a write is never sent twice; what still fails is a plain 503 with
  # Retry-After, never a 502. SSE and other unknown-length answers are flushed as they come (Caddy's own rule); there is
  # no reload, so a WebSocket stays open as long as both ends keep it. It must be up through the restart it covers, so
  # it waits for nothing, and its config is written out here rather than in a file: the pinned image and this
  # definition do not change with a release, so an update never recreates it. It believes forwarded client addresses
  # only from cloudflared, and the server believes it (TICO_TRUSTED_PROXIES).
  hold:
    <<: *hardening
    profiles: [cloudflared]
    cpu_shares: 4096
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    entrypoint: ["/bin/sh", "-c", "printf '%s' \"$$TICO_HOLD_CADDYFILE\" > /tmp/Caddyfile && exec caddy run --config /tmp/Caddyfile --adapter caddyfile"]
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_add: [NET_BIND_SERVICE]   # caddy's binary carries this as a file capability; exec fails without it
    environment:
      TICO_HOLD_CADDYFILE: |
        {
          admin off
          auto_https off
          persist_config off
          servers {
            trusted_proxies static ${TICO_CLOUDFLARED_ADDRESS:-172.30.254.3}/32
          }
        }
        http://:8080 {
          reverse_proxy server:8765 {
            lb_try_duration 30s
            lb_try_interval 250ms
          }
          handle_errors {
            header Retry-After 5
            respond "Tico is starting. Try again in a few seconds." 503
          }
        }
    networks: [edge]

  # Behind the in-app "Update now" button. It holds the Docker socket, which is root on this host; the
  # server runs no bots, so nothing untrusted shares the host. On through COMPOSE_PROFILES and
  # TICO_UPDATER_URL in .env; it has no published port. An update also replaces this file and the rest of the
  # release's bundle (never .env), snapshots the database first (restored if the update is rolled back), and then
  # replaces the updater itself: a short-lived helper from the new updater image recreates this service and puts the
  # old one back if the new one does not stay up. TICO_UPDATER_TAG pins it (default TICO_TAG).
  # Settings reach the server through the explicit list above rather than `env_file: .env`, which would also
  # hand it secrets meant for other services (CLOUDFLARE_TUNNEL_TOKEN).
  updater:
    <<: *hardening
    profiles: [updater]
    image: ${TICO_UPDATER_IMAGE:-ghcr.io/ticoteam/tico-updater}:${TICO_UPDATER_TAG:-${TICO_TAG:-latest}}
    read_only: true
    tmpfs: [/tmp]
    cap_add: [DAC_OVERRIDE]  # the socket is root:docker 0660, and .env belongs to whoever installed
    environment:
      TICO_IMAGE: ${TICO_IMAGE:-ghcr.io/ticoteam/tico}
      DOCKER_CONFIG: /tmp/.docker
      TICO_UPDATER_BUNDLE: ${TICO_UPDATER_BUNDLE:-always}   # never: releases that exist only as local tags (docker/smoke.sh)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tico-control:/control:ro
      - ./:/project

# The front doors reach the server only over this network, from fixed addresses the server trusts for forwarded
# client addresses (TICO_TRUSTED_PROXIES above). Nothing else joins it. Containers given no fixed address (the server
# and the hold) draw from the upper half of the range, so they never take a front door's. If the subnet clashes with a
# network on this computer, set TICO_EDGE_SUBNET, TICO_EDGE_DYNAMIC_RANGE, TICO_CADDY_ADDRESS and TICO_CLOUDFLARED_ADDRESS in .env.
networks:
  edge:
    ipam:
      config:
        - subnet: ${TICO_EDGE_SUBNET:-172.30.254.0/28}
          ip_range: ${TICO_EDGE_DYNAMIC_RANGE:-172.30.254.8/29}

volumes:
  tico-data:
  tico-company-file:
  tico-backups:
  tico-control:
  tico-tunnel:
  tico-caddy:
  caddy-data:
  caddy-config:
