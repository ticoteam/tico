# Questions for the Librarian eval (docs/librarian.md). `cite` lists the fixture docs (paths under fixture/) a good
# answer must cite, all of them. `contains` checks literal labels and commands; `facts` binds a value or polarity to a
# subject and predicate (a limited fact spot check, not a full semantic grade). `unknown: true` marks a question the docs do not answer: the right answer starts "Not in the docs."
questions:
  - id: refund-window
    question: How long do customers have to ask for a refund?
    cite: [finance/refunds.md]
    facts:
      - subject: "refund|customer"
        predicate: "within|days|window"
        value: "14 days"
  - id: monthly-refund
    question: Can a customer on a monthly plan get a refund?
    cite: [finance/refunds.md]
    facts:
      - subject: "monthly"
        predicate: "refund(?:able|s)?"
        polarity: negative
  - id: refund-approval
    question: Who has to approve a refund over $500, and who is that person?
    cite: [finance/refunds.md, company/about.md]
    contains: ["Ana"]
  - id: studio-price
    question: How much does the Studio plan cost per month?
    cite: [sales/pricing.md]
    facts:
      - subject: "studio"
        predicate: "cost|price|month|\\$"
        value: "$29"
  - id: discount-limit
    question: How big a discount can a salesperson give without asking anyone?
    cite: [sales/pricing.md]
    facts:
      - subject: "discount|sales"
        predicate: "discount|give|offer"
        value: "10%"
  - id: support-hours
    question: When is support open?
    cite: [support/hours-and-sla.md]
    contains: ["8am", "6pm"]
  - id: team-sla
    question: How quickly do we first reply to a customer on the Team plan?
    cite: [support/hours-and-sla.md]
    contains: ["4 business hours"]
  - id: release-cadence
    question: How often do we ship a release?
    cite: [engineering/release-process.md]
    contains: ["second Tuesday"]
  - id: freeze
    question: When does the code freeze start ahead of a release?
    cite: [engineering/release-process.md]
    contains: ["Monday"]
  - id: retention
    question: How long do we keep a customer's data after they cancel?
    cite: [security/data-retention.md]
    contains: ["90 days"]
  - id: first-week
    question: What does a new hire have to finish in their first week?
    cite: [people/onboarding.md]
    contains: ["security training"]
  - id: gift-cards
    question: Do we sell gift cards?
    unknown: true
  - id: wifi
    question: What is the password for the office wifi?
    unknown: true
  - id: hermes-connect
    question: How do I pair my Hermes profile with Tico, and what command do I run in Hermes afterwards?
    manual: [hermes-agents]
    contains: ["hermes_agent.py pair", "/reload-mcp"]
  - id: openclaw-connect
    question: How do I connect my OpenClaw profile to Tico, and what does it need before it can answer?
    manual: [openclaw-agents]
    contains: ["hermes_agent.py pair --harness openclaw", "model"]
  - id: change-instructions
    question: How do I change a bot's Instructions in Tico, or edit its repository, and get the changes onto its Computer?
    manual: [using-tico]
    contains: ["Instructions", "BotOps", "commit", "push"]
    facts:
      - subject: "computer|checkout"
        predicate: "updat|pull|sync"
        polarity: positive
  - id: add-human-signin
    question: How do I add a human teammate and let them sign in when Tico uses Cloudflare Access or Cognito?
    manual: [people]
    contains: ["Humans", "Add manually", "Cloudflare Access", "Cognito"]
    facts:
      - subject: "email|address"
        predicate: "allow|add"
        polarity: positive
  - id: copy-credential-grants
    question: How do I copy a bot, what is included, and what happens to its Credential grants when I am a Credential administrator?
    manual: [creating-bots]
    contains: ["automatically", "Credential", "Routine"]
    facts:
      - subject: "credential|grant"
        predicate: "automatic"
        polarity: positive
      - subject: "secret|env"
        predicate: "cop(?:y|ied)"
        polarity: negative
  - id: reopen-task
    question: How do I undo marking a task Done and reopen it, and what happens to its history?
    manual: [using-tico]
    contains: ["Undo", "Reopen", "history"]
