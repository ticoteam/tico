    /* Stand-ins for the macOS traffic lights the real window draws at (18, 22). */

    .traffic i { width: 12px; height: 12px; border-radius: 6px; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.2); }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }
  </style>
