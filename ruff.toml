# Lint config for the Python code. Ruff is pinned: `uvx ruff@0.15.9`. A bare `uvx ruff@0.15.9 check` reads this file alone
# and reports every finding, and formatting reads it too. The gate is scripts/lint.sh; CONTRIBUTING.md explains how the
# findings that exist today are counted and kept from growing.
#
# Production code is checked for bugs with the rule families below. Style rules (E501, I, UP, ...) are not enforced.
# Tico Recorder's benchmarks are uv scripts that shell out to `security` and to paid speech APIs. They are run by hand
# (recorder/bench/README.md), not part of the product, and their subprocess calls are left as written.
extend-exclude = ["recorder/bench"]
target-version = "py312"
line-length = 120

# Formatting (`uvx ruff@0.15.9 format`, checked by scripts/lint.sh). Only layout changes: quotes stay as written.
# These files are excluded from formatting only (not from linting, which still reads them).
[format]
quote-style = "preserve"
# Applied migrations are frozen. A start refuses a database whose recorded checksum no longer matches its file
# (backend/migrations/__init__.py), so every file below stays as it is. New migrations are formatted like the rest.
# renames_data.py is written by scripts/cleanup/gen_map.py, whose --check compares its text.
