# Lint config for the Python code. Ruff is pinned: `uvx ruff@0.15.9`. A bare `uvx ruff@0.15.9 check` reads this file alone
# and reports every finding, and formatting reads it too. The gate is scripts/lint.sh; CONTRIBUTING.md explains how the
# findings that exist today are counted and kept from growing.
#
# Production code is checked for bugs with the rule families below. Style rules (E501, I, UP, ...) are not enforced.
# Tico Recorder's benchmarks are uv scripts that shell out to `security` and to paid speech APIs. They are run by hand
# (recorder/bench/README.md), not part of the product, and their subprocess calls are left as written.
extend-exclude = ["recorder/bench"]
# Excluded files stay excluded when a tool names them (scripts/check.sh passes changed files): a shipped migration
# was reformatted that way and installs refused to start on it.
force-exclude = true
target-version = "py312"
line-length = 120

# Formatting (`uvx ruff@0.15.9 format`, checked by scripts/lint.sh). Only layout changes: quotes stay as written.
# These files are excluded from formatting only (not from linting, which still reads them).
[format]
quote-style = "preserve"
# renames_data.py is frozen data: the renames that shipped (backend/migrations/renames.py reads it).
exclude = [
    "backend/migrations/renames_data.py",
]

[lint]
select = [
    "F", "E9", "B", "PLE", "PLW1510", "ASYNC", "DTZ", "S110", "BLE001", "PGH004",
    "RUF006", "RUF100", "S113", "S602", "E722", "T10", "PLW0711",
]

# Test code gets only undefined names (F821), unused locals (F841) and syntax errors (E9). Pytest fixtures
# make the rest noisy (F811 redefinitions, unused fixture imports, ...).
[lint.extend-per-file-ignores]
"**/tests/**" = [
    "B", "PLE", "PLW1510", "ASYNC", "DTZ", "S110", "BLE001", "PGH004", "F401", "F402", "F403", "F404", "F405",
    "F406", "F407", "F501", "F502", "F503", "F504", "F505", "F506", "F507", "F508", "F509", "F521", "F522", "F523",
    "F524", "F525", "F541", "F601", "F602", "F621", "F622", "F631", "F632", "F633", "F634", "F701", "F702", "F704",
    "F706", "F707", "F722", "F811", "F822", "F823", "F842", "F901",
    "RUF006", "RUF100", "S113", "S602", "E722", "T10", "PLW0711"
]
"**/test_*.py" = [
