# A Tico runner box: a Linux or cloud machine that runs bots for a Tico server. See docs/install.md.
#   easiest: `sh install.sh --runner --url https://your-tico --code <one-time code> --label <name>` (the release's installer)
#   by hand: write .env with TICO_URL=https://your-tico, TICO_CODE=<one-time code>, TICO_RUNNER_LABEL=<name>,
#   TICO_TAG and TICO_UPDATER_TAG=<the server's release, vX.Y.Z>, then `docker compose -f runner.compose.yaml up -d`
# The code from Settings > Computers > Add computer is used once, at the first start; the login and the bots'
# repositories stay in the runner-home volume, so later starts and updates need no code.
# The updater sidecar keeps this runner on the release its server runs (docs/updates.md). It alone holds the
# Docker socket; set TICO_RUNNER_PINNED=1 in .env to keep the runner where it is.
name: tico-runner

services:
  runner:
    image: ${TICO_RUNNER_IMAGE:-ghcr.io/ticoteam/tico-runner}:${TICO_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-tico-runner}
    command: ["join", "--url", "${TICO_URL:-}", "--code", "${TICO_CODE:-}", "--label", "${TICO_RUNNER_LABEL:-runner}"]
    init: true
    restart: unless-stopped
    # The entrypoint starts as root only to prepare the volume, then runs the supervisor as the runner's own
    # user (which owns runner.json) holding these five capabilities, so that every process that runs bot code
    # can drop to the unprivileged `bot` user with none (SECURITY.md).
    user: "0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETUID]
    # Each running turn holds about 30 processes and threads (its harness, tools and their workers), so the limit
    # covers the highest capacity a runner honours (256) with room left; at 2048 a runner at capacity 100 could not
    # start new turns ("Resource temporarily unavailable") while the host had plenty to spare.
    pids_limit: 12288
    # The memory cap: TICO_RUNNER_MEMORY in .env ("27g"), or the installer's and updater's default for this host
    # (docker/runner-memory.sh). Unset, empty or 0 means no limit. With no swap beyond the limit, the kernel ends bot
    # processes inside this cgroup instead of letting the host thrash.
    mem_limit: ${TICO_RUNNER_MEMORY:-0}
    memswap_limit: ${TICO_RUNNER_MEMORY:-0}
    # On a host it shares with the server (compose.yaml, cpu_shares 4096), bot work yields the CPU when they compete,
    # and when memory runs out the kernel ends bot processes before the server. Raising the score needs no privilege.
    cpu_shares: 512
    oom_score_adj: 500
    stop_grace_period: 15m
    environment:
      TICO_RUNNER_KIND: docker
      TICO_RUNNER_COMPOSE: "1"   # lets the runner tell a compose install from a bare `docker run` when it hints at an update
      TICO_RUNNER_PINNED: ${TICO_RUNNER_PINNED:-0}
      TICO_UPDATER_URL: http://updater:8080
      # TICO_SCREEN=1 in .env offers this computer's screen to the web app; install.sh writes it for a new runner, and an
      # .env without the line keeps the screen off (docs/install.md).
      TICO_SCREEN: ${TICO_SCREEN:-}
    volumes:
      - runner-home:/home/runner
      - runner-control:/control:ro

  updater:
    image: ${TICO_UPDATER_IMAGE:-ghcr.io/ticoteam/tico-updater}:${TICO_UPDATER_TAG:-latest}
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]  # the socket is root:docker 0660, .env belongs to whoever installed, the token is ticorun's
    read_only: true
    tmpfs: [/tmp]
    environment:
      TICO_UPDATER_MODE: runner
      TICO_COMPOSE_FILE: runner.compose.yaml
      TICO_IMAGE: ${TICO_RUNNER_IMAGE:-ghcr.io/ticoteam/tico-runner}
      DOCKER_CONFIG: /tmp/.docker
      TICO_UPDATER_BUNDLE: ${TICO_UPDATER_BUNDLE:-always}   # never: releases that exist only as local tags (docker/smoke.sh)
      TICO_UPDATER_PULL: ${TICO_UPDATER_PULL:-always}
      TICO_HEALTH_SECONDS: ${TICO_HEALTH_SECONDS:-180}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-control:/control
      - ./:/project

volumes:
  # TICO_RUNNER_HOME_VOLUME=tico-runner reuses the volume of a runner started with a bare `docker run`.
  runner-home:
    name: ${TICO_RUNNER_HOME_VOLUME:-${COMPOSE_PROJECT_NAME:-tico-runner}_runner-home}
  runner-control:
