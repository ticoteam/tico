# Seed roster of humans for a new team environment: who exists, which group they are in, and
# which bot their notes go to. `clients/environments.py` copies it in, filling in the
# owner given at creation. Add colleagues in the app once the environment is running.
#
#   default_user  primary human of any bot no rule below claims
#   teams         a bot belongs to a group when its reports_to chain reaches that group's root
#   primary_for   group names and/or bot slugs this human is the primary human of ("*" is all)
#   bot           the bot slug this human's notes go to; null means "decide by the note"

default_user: {{owner_id}}
developers: [{{owner_id}}]

# The owner is in no group: bots that report straight to them sit at the top of the team list, beside them.
teams: {}

people:
  - id: {{owner_id}}
    name: {{owner_name}}
    email: {{owner_email}}
    title: Owner
    primary_for: ["*"]
    bot: null
    reports_to: null
