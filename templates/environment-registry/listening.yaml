# Where Listening sends the posts it saves (backend/listening.py). Optional: with no destinations a
# saved post is scored and kept, and goes nowhere.
#
# Each destination has one receiving bot. The decision model scores every saved post
# against the typed questions in questions/listening-item.json; a post goes to every destination
# whose `category` score reaches `threshold`, unless its `unless` category also reaches its own
# threshold (a vendor's promotion is not a lead). `readers` may read the destination but never resolve it.
#
# destinations:
#   leads:
#     category: lead              # a question id in questions/listening-item.json
#     threshold: 0.75
#     receiver: bot:sales-operations-manager     # the bot that accepts or rejects each item
#     unless: {category: vendor_pitch, threshold: 0.70}
#     what: a small-team lead who might use the product, kept with what the post tells us
#   content:
#     category: content
#     threshold: 0.75
#     receiver: bot:content-owner
#     readers: [bot:research]
#     what: a question or pain point a useful post could answer
destinations: {}
