name: outbound-sales-owner                     # the slug: it matches the repository bot-outbound-sales-owner and the label owner:outbound-sales-owner
display_name: "Outbound Sales Owner"
labels: [owner:outbound-sales-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: outbound-run
    title: Weekday outbound run
    cron: "0 8 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/outbound-run.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-outbound-readout
    title: Weekly outbound read-out
    cron: "30 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-outbound-readout.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "account sites, news, job posts, company posts and public profiles of roles; no forms, no messages, no accounts"
