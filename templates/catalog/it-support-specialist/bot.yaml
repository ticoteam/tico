name: it-support-specialist                     # the slug: it matches the repository bot-it-support-specialist and the label owner:it-support-specialist
display_name: "IT Support Specialist"
labels: [owner:it-support-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-it-page
    title: Weekly IT page
    cron: "30 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-it-page.md
    labels: [priority:p2]
    enabled: false

tools: []
