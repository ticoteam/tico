name: revenue-accountant                     # the slug: it matches the repository bot-revenue-accountant and the label owner:revenue-accountant
display_name: "Revenue Accountant"
labels: [owner:revenue-accountant]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: monthly-revenue-close
    title: Monthly revenue close pack
    cron: "0 9 2 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-revenue-close.md
    labels: [priority:p2]
    enabled: false

# Exports arrive as files on a task. A read-only tool for the books, bank, billing or payroll
# system is the owner's to add, with `can: [read]` only and never a write, pay or send.
tools: []
