name: cro-owner                     # the slug: it matches the repository bot-cro-owner and the label owner:cro-owner
display_name: "CRO Owner"
labels: [owner:cro-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on both, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once; from then on Tico's rows are the routines
# (docs/routines.md).
routines:
  - id: watch
    title: Watch CRO
    cron: "0 7 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find CRO ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "the team's conversion pages as a visitor sees them, and competitors' pages; no forms, no accounts, no checkouts"
# Uncomment when the team's product analytics is connected. Read is enough: a test is never started or stopped from here.
#   - service: web-analytics
#     identity: "the team's analytics account"
#     can: [read]
#     env: ANALYTICS_API_KEY
#     note: "funnel counts by day and segment; read only, never a write"
