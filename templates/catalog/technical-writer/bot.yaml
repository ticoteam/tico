name: technical-writer                     # the slug: it matches the repository bot-technical-writer and the label owner:technical-writer
display_name: "Technical Writer"
labels: [owner:technical-writer]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-docs-drift
    title: Weekly docs drift report
    cron: "0 10 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-docs-drift.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads merged pull requests and the docs repository; drafts doc changes on the task; requested commits use the repository Tools"
# Writing to GitHub is the owner's decision, not the template's: the team's GitHub App token can write, so the only
# thing between this bot and a public comment is its declared access and its
# instructions. It stays read only; requested changes need granted write access.
