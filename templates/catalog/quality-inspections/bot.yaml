name: quality-inspections                     # the slug: it matches the repository bot-quality-inspections and the label owner:quality-inspections
display_name: "Quality & Inspections"
labels: [owner:quality-inspections]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-quality-page
    title: Weekly quality page
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-quality-page.md
    labels: [priority:p2]
    enabled: false

tools: []
