name: returns-and-refunds-specialist                         # the slug: it matches the repository bot-returns-and-refunds-specialist and the label owner:returns-and-refunds-specialist
display_name: "Returns and Refunds Specialist"
labels: [owner:returns-and-refunds-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-returns-report
    title: Weekly returns report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-returns-report.md
    labels: [priority:p2]
    enabled: false

