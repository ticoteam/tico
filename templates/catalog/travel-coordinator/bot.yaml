name: travel-coordinator                     # the slug: it matches the repository bot-travel-coordinator and the label owner:travel-coordinator
display_name: "Travel Coordinator"
labels: [owner:travel-coordinator]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-trips-page
    title: Weekly trips page
    cron: "0 10 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-trips-page.md
    labels: [priority:p2]
    enabled: false

tools: []
