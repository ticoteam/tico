name: corporate-manager         # the slug: it matches the repository bot-corporate-manager and the label owner:corporate-manager
display_name: "Corporate Manager"
labels: [owner:corporate-manager]
reads: []                            # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 30

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). It reads the corporate owners' reports. Legal and Finance are private pipelines managed by their own Owners.
routines:
  - id: weekly-corporate-summary
    title: Weekly corporate summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-corporate-summary.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. Tico itself (tasks, updates, reports, the org) needs no entry.
tools: []
