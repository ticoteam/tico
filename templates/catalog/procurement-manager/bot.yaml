name: procurement-manager                     # the slug: it matches the repository bot-procurement-manager and the label owner:procurement-manager
display_name: "Procurement Manager"
labels: [owner:procurement-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-purchase-digest
    title: Weekly purchase requests digest
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-purchase-digest.md
    labels: [priority:p2]
    enabled: false

# Public research needs no key. Optional, uncomment when connected (changing access is an owner
# decision). Reading a mailbox where quotes arrive may only ever read and draft.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "vendor sites, trust pages, documentation and public reviews; no forms, no sign-ups, no messages"
# Optional, uncomment when connected:
#   - service: gmail
#     identity: "purchasing@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads the quotes vendors sent and leaves a draft; never files or sends"
