name: fpa-analyst                     # the slug: it matches the repository bot-fpa-analyst and the label owner:fpa-analyst
display_name: "FP&A Analyst"
labels: [owner:fpa-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

# What the Tico AI Gateway gives this bot when nobody picked a model: its group's pick at this level.
gateway:
  level: low

routines:
  - id: weekly-spend-report
    title: Weekly spend report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-spend-report.md
    labels: [priority:p2]
    enabled: false

# Card and bank exports arrive as files on a task, so no access is declared: the bot reads what a
# human attaches, and never gets an account that can move money.
tools: []
