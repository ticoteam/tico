name: assistant                     # the slug: it matches the repository bot-assistant and the label owner:assistant
display_name: "{{assistant_name}}"
labels: [owner:assistant]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Routines this bot owns. The server runs the clock and turns each occurrence into a task.
# The morning message runs once a day for the whole Assistant, not per person: for each person it sends at most one
# message (`tico assistant morning`), or none on a quiet day. The id stays `daily-sweep` for installs that have it.
# See docs/routines.md for the shape.
routines:
  - id: daily-sweep
    title: Morning message
    cron: "0 8 * * *"                 # runs in the company's timezone (no timezone: the team default applies)
    template: playbooks/daily-sweep.md
    labels: [priority:p2]

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value. Store a Credential in Tico and grant it to this bot;
# the runner delivers it during a run. Declaring access here does not create a grant.
# tools:
#   - service: mail
#     identity: "desk@example.com"
#     can: [read, draft]          # send only with send access; Tico's sending policy decides
#     env: MAIL_CREDENTIALS
#     note: "reads and drafts on its own mailbox; never files and never sends"
tools: []
