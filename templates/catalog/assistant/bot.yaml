name: coo                     # the slug: it matches the repository bot-coo and the label owner:coo
display_name: "{{assistant_name}}"
labels: [owner:coo]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts the draft on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# Routines this bot owns. The server runs the clock and turns each occurrence into a task.
# The daily sweep runs once a day for the whole Assistant, not per person: it tidies each person's
# queue and files one card per person. See docs/routines.md for the shape.
routines:
  - id: daily-sweep
    title: Daily sweep of each person's queue
    cron: "0 8 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/daily-sweep.md
    labels: [priority:p2]

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value. Store a Credential in Tico and grant it to this bot;
# the runner delivers it during a run. Declaring access here does not create a grant.
# tools:
#   - service: mail
#     identity: "desk@example.com"
#     can: [read, draft]          # send only with outbound_send: true
#     env: MAIL_CREDENTIALS
#     note: "reads and drafts on its own mailbox; never files and never sends"
tools: []
