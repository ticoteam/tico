name: reputation-manager
display_name: "Reputation Manager"
labels: [owner:reputation-manager]
reads: []                           # other bot repositories this one may clone read-only
slack_channel: "#marketing"

# Public text is written at high effort: every reply this bot drafts is read by a stranger.
max_run_minutes: 60

# One sweep to start with. A midweek pass earns its place once someone has read a month of these.
routines:
  - id: weekly-review-sweep
    title: Weekly review sweep
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-review-sweep.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. A browser access also names `sites:`, so the tool can refuse every other host.
tools:
  - service: aside
    identity: "the team browser (Aside)"
    can: [read]
    sites: [yelp.com, bbb.org, google.com, trustpilot.com, capterra.com, g2.com, getapp.com,
            softwareadvice.com, glassdoor.com, indeed.com, apps.apple.com, play.google.com, sitejabber.com]
    note: "reads every listing; on a sign in wall or a challenge, record the surface as blocked. Until the owner turns execution on, requested execution needs browser act access; public replies stay drafts until a person turns mail sending on in Tico"
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "review pages and the platforms' own policy pages; no forms, messages, or account creation"
  - service: slack
    identity: "the team workspace"
    can: [read]
    channels: [marketing]
    env: SLACK_BOT_TOKEN
    note: "reads the internal marketing channel; posting is off"
# For requested browser actions, grant `can: [read, act]` on the Aside entry. Stay within the
# requested batch: report/flag, owner reply, BBB answer, claim or category. Public replies stay
# drafts until a person turns mail sending on in Tico. To post requested digests internally, grant the Slack entry
# `can: [read, post]` (internal channels only).
