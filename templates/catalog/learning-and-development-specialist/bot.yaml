name: learning-and-development-specialist                     # the slug: it matches the repository bot-learning-and-development-specialist and the label owner:learning-and-development-specialist
display_name: "Learning and Development Specialist"
labels: [owner:learning-and-development-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-training-tracker
    title: Weekly training tracker
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-training-tracker.md
    labels: [priority:p2]
    enabled: false

tools: []
# There is deliberately no learning-platform entry: completion records arrive as exports on tasks, and a human
# enrolls people and buys courses within the requested budget and Tools.
