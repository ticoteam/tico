name: tax-specialist                     # the slug: it matches the repository bot-tax-specialist and the label owner:tax-specialist
display_name: "Tax Specialist"
labels: [owner:tax-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: monthly-tax-calendar
    title: Monthly tax calendar
    cron: "0 9 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-tax-calendar.md
    labels: [priority:p2]
    enabled: false

# Exports arrive as files on a task. A read-only integration with the books, bank, billing or payroll
# system is the owner's to add, with `can: [read]` only and never a write, pay or send.
# Optional, uncomment when connected. Never send: drafts only.
# tools:
#   - service: gmail
#     identity: "the mailbox where tax notices arrive"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads what arrives; never replies, forwards, files or sends"
tools: []
