name: growth-manager                     # the slug: it matches the repository bot-growth-manager and the label owner:growth-manager
display_name: "Growth Manager"
labels: [owner:growth-manager]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on all three, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once; from then on Tico's automations
# are the routines (docs/routines.md).
routines:
  - id: weekly-growth-summary
    title: Weekly growth summary
    cron: "0 14 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-growth-summary.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-growth-meeting
    title: Weekly growth meeting
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-meeting.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-numbers
    title: Weekly numbers
    cron: "0 7 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-numbers.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Tico itself (tasks, updates, reports, calendar, meetings) needs no entry: every run has it.
# Optional, uncomment when connected. Neither entry may ever carry write or send.
# tools:
#   - service: close-crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CLOSE_API_KEY
#     note: "leads, opportunities and stages; read only, never a write"
tools: []
