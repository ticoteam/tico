name: search-ads-owner                 # the slug: it matches the repository bot-search-ads-owner and the label owner:search-ads-owner
display_name: "Search Ads Owner"
labels: [owner:search-ads-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: watch
    title: Watch Search Ads
    cron: "0 7 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find Search Ads ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

# The ads account is read through a Tool a person grants in Tico (or exports attached to a task), so no access is
# declared here: the bot never gets an account that can change a bid, a budget, a keyword or a bidding strategy unless
# an owner grants one.
tools: []
