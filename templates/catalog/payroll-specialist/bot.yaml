name: payroll-specialist                     # the slug: it matches the repository bot-payroll-specialist and the label owner:payroll-specialist
display_name: "Payroll Specialist"
labels: [owner:payroll-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: pre-payroll-change-summary
    title: Pre-payroll change summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/pre-payroll-change-summary.md
    labels: [priority:p2]
    enabled: false

# Exports arrive as files on a task. A read-only tool with the books, bank, billing or payroll
# system is the owner's to add, with `can: [read]` only and never a write, pay or send.
tools: []
