name: support-operations-specialist                     # the slug: it matches the repository bot-support-operations-specialist and the label owner:support-operations-specialist
display_name: "Support Operations Specialist"
labels: [owner:support-operations-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

# Cron runs Mondays 1-7 of the month; the playbook skips a run that is not the month's first Monday.
routines:
  - id: monthly-helpdesk-audit
    title: Monthly help desk audit
    cron: "0 9 1-7 * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-helpdesk-audit.md
    labels: [priority:p3]
    enabled: false

# Optional, uncomment when connected. Add write, modify or delete only for the requested systems and work.
# tools:
#   - service: zendesk
#     identity: "a read-only admin or an API token scoped to read"
#     can: [read]
#     env: ZENDESK_API_TOKEN
#     note: "reads triggers, automations, SLA policies, macros, tags and a ticket sample; never a change"
tools: []
