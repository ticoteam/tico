name: recruiter                     # the slug: it matches the repository bot-recruiter and the label owner:recruiter
display_name: "Recruiter"
labels: [owner:recruiter]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-hiring-pipeline
    title: Weekly hiring pipeline summary
    cron: "0 10 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-hiring-pipeline.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. Reading the hiring mailbox lets a screening summary start from the real
# application instead of a pasted one. The calendar is already readable by every bot.
# tools:
#   - service: gmail
#     identity: "jobs@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads applications and leaves each candidate reply as a draft until a person turns mail sending on in Tico; requested actions use the granted Tools"
