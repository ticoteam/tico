name: escalations-manager                     # the slug: it matches the repository bot-escalations-manager and the label owner:escalations-manager
display_name: "Escalations Manager"
labels: [owner:escalations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: daily-escalation-digest
    title: Daily escalation digest
    cron: "30 8 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/daily-escalation-digest.md
    labels: [priority:p1]
    enabled: false

# Optional, uncomment what the setup says is connected. No entry may ever carry write or send.
# tools:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads escalated threads for the timeline; never drafts, files or sends"
#   - service: github
#     identity: "the product repositories the owner lists for this bot"
#     can: [read]
#     note: "reads the linked engineering issues; never comments or edits"
tools: []
