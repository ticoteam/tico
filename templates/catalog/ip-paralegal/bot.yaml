name: ip-paralegal                     # the slug: it matches the repository bot-ip-paralegal and the label owner:ip-paralegal
display_name: "IP Paralegal"
labels: [owner:ip-paralegal]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: monthly-ip-watch
    title: Monthly IP watch
    cron: "0 9 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-ip-watch.md
    labels: [priority:p2]
    enabled: false

tools: []
