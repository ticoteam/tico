name: product-operations-manager                     # the slug: it matches the repository bot-product-operations-manager and the label owner:product-operations-manager
display_name: "Product Operations Manager"
labels: [owner:product-operations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-product-ops-review
    title: Weekly product ops review
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-product-ops-review.md
    labels: [priority:p2]
    enabled: false

