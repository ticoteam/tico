name: ux-researcher                     # the slug: it matches the repository bot-ux-researcher and the label owner:ux-researcher
display_name: "UX Researcher"
labels: [owner:ux-researcher]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-research-digest
    title: Weekly research digest
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-research-digest.md
    labels: [priority:p2]
    enabled: false

tools: []
# Tico itself (meetings, tasks, docs) needs no entry: every run has it. Bots read team meetings and never
# private ones. Interview notes and survey exports arrive as task attachments or in the team docs.
