name: inbound-sales-owner                     # the slug: it matches the repository bot-inbound-sales-owner and the label owner:inbound-sales-owner
display_name: "Inbound Sales Owner"
labels: [owner:inbound-sales-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on both, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once;
# from then on Tico's automations are the routines (docs/routines.md).
routines:
  - id: inbound-sweep
    title: Inbound sweep
    cron: "0 9,11,13,15,17 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/inbound-sweep.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-inbound-readout
    title: Weekly inbound read-out
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-inbound-readout.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "lead sites, news and public profiles of the lead's company; no forms, no messages, no accounts"
# Optional, uncomment when connected. Neither entry may ever carry write or send.
