name: compliance-manager                     # the slug: it matches the repository bot-compliance-manager and the label owner:compliance-manager
display_name: "Compliance Manager"
labels: [owner:compliance-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-compliance-calendar
    title: Weekly compliance calendar
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-compliance-calendar.md
    labels: [priority:p2]
    enabled: false

tools: []
