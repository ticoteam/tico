name: benefits-administrator                     # the slug: it matches the repository bot-benefits-administrator and the label owner:benefits-administrator
display_name: "Benefits Administrator"
labels: [owner:benefits-administrator]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-benefits-deadlines
    title: Weekly benefits deadlines
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-benefits-deadlines.md
    labels: [priority:p2]
    enabled: false

tools: []
# There is deliberately no broker or provider portal entry: a human submits every enrollment and change there.
# Plan documents are read through the Librarian (`tico doc ask`), which every run already has.
