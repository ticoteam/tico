name: paralegal                     # the slug: it matches the repository bot-paralegal and the label owner:paralegal
display_name: "Paralegal"
labels: [owner:paralegal]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts every draft on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: nda-desk
    title: Weekday NDA desk
    cron: "0 9 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/nda-desk.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools: []
# Optional, uncomment when connected. Inbound NDAs arrive as files on a task; reading the shared contracts
# mailbox saves forwarding them. Nothing here ever reaches the other party.
# tools:
#   - service: gmail
#     identity: "legal@example.com"
#     can: [read, draft]          # never send: outbound_send stays false
#     env: GOOGLE_SA_KEY
#     note: "reads NDA threads and leaves an internal draft; never replies to the other party"
