name: sales-operations-manager                     # the slug: it matches the repository bot-sales-operations-manager and the label owner:sales-operations-manager
display_name: "Sales Operations Manager"
labels: [owner:sales-operations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-crm-report
    title: Weekly CRM hygiene and pipeline report
    cron: "30 6 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-crm-report.md
    labels: [priority:p2]
    enabled: false

# Uncomment when the CRM is connected. Read only: this bot never carries write or send. If the team
# uses a CRM other than Close, the owner declares its own read-only entry here.
# tools:
#   - service: close-crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CLOSE_API_KEY
#     note: "GET /lead/, /opportunity/ and stage history only; ids and labels, no contact details; never a write"
tools: []
