name: investor-relations-manager                     # the slug: it matches the repository bot-investor-relations-manager and the label owner:investor-relations-manager
display_name: "Investor Relations Manager"
labels: [owner:investor-relations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: monthly-investor-update
    title: Monthly investor update draft
    cron: "0 9 3 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-investor-update.md
    labels: [priority:p2]
    enabled: false

# Optional, uncomment when the owner connects it. Read and draft only; never send.
# tools:
#   - service: gmail
#     identity: "owner@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads the owner's threads with investors so a draft answers what was asked; leaves a draft, never sends"
tools: []
