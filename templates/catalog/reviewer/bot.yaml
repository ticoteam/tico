name: reviewer                     # the slug: it matches the repository bot-reviewer and the label owner:reviewer
display_name: "Reviewer"
labels: [owner:reviewer]
shared: true
session: task
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekday-review-queue
    title: Weekday review queue
    cron: "0 9 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekday-review-queue.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads open pull requests, their diffs and checks; every review comment is a draft on the task for a human to post"
# Writing to GitHub is the owner's decision, not the template's: the team's GitHub App token can write, so the only
# thing between this bot and a public comment is its declared access and its instructions. It stays read only; a posted
# review needs granted write access.
