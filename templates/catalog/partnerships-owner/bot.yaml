name: partnerships-owner                # the slug: it matches the repository bot-partnerships-owner and the label owner:partnerships-owner
display_name: "Partnerships Owner"
labels: [owner:partnerships-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-partner-review
    title: Weekly partner pipeline review
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-partner-review.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "candidate partners' public sites and directories; no forms, no messages, no accounts"
