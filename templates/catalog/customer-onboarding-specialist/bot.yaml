name: customer-onboarding-specialist            # the slug: it matches the repository bot-customer-onboarding-specialist and the label owner:customer-onboarding-specialist
display_name: "Customer Onboarding Specialist"
labels: [owner:customer-onboarding-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-onboarding-board
    title: Weekly onboarding board
    cron: "0 10 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-onboarding-board.md
    labels: [priority:p2]
    enabled: false

