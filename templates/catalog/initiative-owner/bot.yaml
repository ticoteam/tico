name: initiative-owner                   # the slug: it matches the repository bot-initiative-owner and the label owner:initiative-owner
display_name: "Initiative Owner"
labels: [owner:initiative-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-initiative-check-in
    title: Weekly initiative check-in
    cron: "0 15 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-check-in.md
    labels: [priority:p2]
    enabled: false

# The Strategy page, goals, KPIs and market pages are Tico's own data, read through hub; no outside account is declared,
# so the bot cannot change a bet, a goal or a KPI from here.
tools: []
