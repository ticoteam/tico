name: sales-engineer              # the slug: it matches the repository bot-sales-engineer and the label owner:sales-engineer
display_name: "Sales Engineer"
labels: [owner:sales-engineer]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts every script, plan and answer on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-technical-prep
    title: Weekly technical deal prep
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-technical-prep.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "the team's public docs, changelog and status page, and a prospect's public technical pages"
# Optional, uncomment when connected. Never write: a prospect's sandbox or data is a person's to grant.
#   - service: github
#     identity: "the product repositories the owner lists for this bot"
#     can: [read]
#     note: "confirms what shipped from releases and changelogs; read only"
