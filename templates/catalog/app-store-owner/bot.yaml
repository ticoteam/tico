name: app-store-owner                          # the slug: it matches the repository bot-app-store-owner and the label owner:app-store-owner
display_name: "App Store Owner"
labels: [owner:app-store-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-app-store-review
    title: Weekly app store review
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-app-store-review.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "the public store listings, competitors' listings and each store's public rules; no developer console, no sign-in, no replies posted"
