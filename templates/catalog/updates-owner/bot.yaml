name: updates-owner                  # the slug: it matches the repository bot-updates-owner and the label owner:updates-owner
display_name: "Updates Owner"
labels: [owner:updates-owner]
reads: []                            # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 30

# The routine this bot starts with. The server seeds it once, when the Updates Owner is built in; from then on
# it is an Automation (docs/routines.md). Set the timezone to the team's own.
routines:
  - id: draft-the-company-update
    title: Draft the company update
    cron: "0 9 1 * *"
    timezone: America/Los_Angeles
    template: playbooks/draft-the-company-update.md
    labels: [priority:p2]

# It needs no tool or credential of its own: teammates' updates and reports are read through Tico.
tools: []
