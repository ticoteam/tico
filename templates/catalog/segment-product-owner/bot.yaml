name: segment-product-owner                # the slug: it matches the repository bot-segment-product-owner and the label owner:segment-product-owner
display_name: "Product Owner"
labels: [owner:segment-product-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-segment-product-review
    title: Weekly segment product review
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-segment-product-review.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Usage and support exports arrive as files attached to its tasks until an owner connects read-only reporting,
# so no access is declared: the bot never gets an account that can change the product.
# Optional, uncomment when connected. Read only.
# tools:
#   - service: crm
#     identity: "the customer records the owner lists for this bot"
#     can: [read]
#     note: "reads which segment each account is in; never edits"
#   - service: github
#     identity: "the product repositories the owner lists for this bot"
#     can: [read]
#     note: "reads issues, pull requests and releases linked to specs; never edits, labels or comments"
tools: []
