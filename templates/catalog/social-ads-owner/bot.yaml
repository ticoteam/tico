name: social-ads-owner                 # the slug: it matches the repository bot-social-ads-owner and the label owner:social-ads-owner
display_name: "Social Ads Owner"
labels: [owner:social-ads-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on both, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once; from then on Tico's rows are the routines
# (docs/routines.md).
routines:
  - id: watch
    title: Watch Social Ads
    cron: "0 7 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find Social Ads ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Ad reports arrive through the ads account Tool an owner grants, or as exports a human attaches to its task, so no
# access is declared here: the bot never gets an account that can change a bid, a budget, an audience or a creative
# unless an owner grants one.
tools: []
