name: scheduling-bookings                     # the slug: it matches the repository bot-scheduling-bookings and the label owner:scheduling-bookings
display_name: "Scheduling & Bookings"
labels: [owner:scheduling-bookings]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-bookings-page
    title: Weekly bookings page
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-bookings-page.md
    labels: [priority:p2]
    enabled: false

tools: []
