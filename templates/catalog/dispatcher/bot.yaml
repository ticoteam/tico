name: dispatcher                     # the slug: it matches the repository bot-dispatcher and the label owner:dispatcher
display_name: "Dispatcher"
labels: [owner:dispatcher]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

# What the Tico AI Gateway gives this bot when nobody picked a model: its group's pick at this level.
gateway:
  level: low

routines:
  - id: tomorrows-dispatch-plan
    title: Tomorrow's dispatch plan
    cron: "0 15 * * 1-5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/tomorrows-dispatch-plan.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. Crew calendars show leave and existing bookings:
