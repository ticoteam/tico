name: privacy-manager                     # the slug: it matches the repository bot-privacy-manager and the label owner:privacy-manager
display_name: "Privacy Manager"
labels: [owner:privacy-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-privacy-desk
    title: Weekly privacy desk
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-privacy-desk.md
    labels: [priority:p2]
    enabled: false

tools: []
