name: ux-writer                     # the slug: it matches the repository bot-ux-writer and the label owner:ux-writer
display_name: "UX Writer"
labels: [owner:ux-writer]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-copy-review
    title: Weekly interface copy review
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-copy-review.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads pull requests and diffs that change user-facing text; every review is a draft on the task for an engineer to post"
# Writing to GitHub is the owner's decision, not the template's: the team's GitHub App token can write, so the only
# thing between this bot and a public comment is its declared access and .claude/settings.json, which deny every write
# verb. It stays read only; public comments stay drafts until a person turns mail sending on in Tico; requested posts need granted write access.
