name: controller                     # the slug: it matches the repository bot-controller and the label owner:controller
display_name: "Controller"
labels: [owner:controller]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: month-end-close-review
    title: Month-end close review
    cron: "0 9 3 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/month-end-close-review.md
    labels: [priority:p2]
    enabled: false

tools: []
