name: corporate-secretary                     # the slug: it matches the repository bot-corporate-secretary and the label owner:corporate-secretary
display_name: "Corporate Secretary"
labels: [owner:corporate-secretary]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: monthly-entity-calendar
    title: Monthly entity and board calendar
    cron: "0 9 3 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-entity-calendar.md
    labels: [priority:p2]
    enabled: false

tools: []
