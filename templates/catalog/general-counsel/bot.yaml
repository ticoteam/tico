name: general-counsel                     # the slug: it matches the repository bot-general-counsel and the label owner:general-counsel
display_name: "General Counsel"
labels: [owner:general-counsel]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-legal-summary
    title: Weekly legal summary
    cron: "30 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-legal-summary.md
    labels: [priority:p2]
    enabled: false

tools: []

# Requests to the legal desk and tasks it files stay with their two participants.
private_tasks_default: true
