name: product-manager                     # the slug: it matches the repository bot-product-manager and the label owner:product-manager
display_name: "Product Manager"
labels: [owner:product-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-product-summary
    title: Weekly product summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-product-summary.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Optional, uncomment when connected. It stays read only: the roadmap and issues are
# changed by a human.
# tools:
#   - service: github
#     identity: "the product repositories the owner lists for this bot"
#     can: [read]
#     note: "reads milestones, issues and merged pull requests; never edits, labels or comments"
tools: []
