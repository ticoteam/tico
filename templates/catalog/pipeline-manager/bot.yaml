name: pipeline-manager                 # the slug: it matches the repository bot-pipeline-manager and the label owner:pipeline-manager
display_name: "Pipeline Manager"
labels: [owner:pipeline-manager]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 30

# The routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-stage-report
    title: Weekly stage report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-stage-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch beyond hub. Hub is how it reads and moves its pipeline's cards; a bot with no outside
# access lists none. Changing access is an owner decision, so the bot files a task for the owner rather than editing this file.
tools: []
