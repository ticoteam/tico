name: pipeline-manager                 # the slug: it matches the repository bot-pipeline-manager and the label owner:pipeline-manager
display_name: "Pipeline Manager"
labels: [owner:pipeline-manager]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 30

# The routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-pipeline-report
    title: Weekly pipeline report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-pipeline-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch beyond Tico. Tico is how it reads and decides its pipeline's tasks. The Engineering pipeline's
# manager reads pull requests (Changed after OK, Merged anyway) when GitHub is connected; it never writes to GitHub.
# Changing access is an owner decision, so the bot files a task for the owner rather than editing this file.
tools: []
