<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion graphics (CSS animations)</title>
<style>
  /* Colors as tokens so a brand can swap them in one place. */
  :root { --bg: #0f1412; --ink: #f4f7f5; --accent: #3ddc97; --muted: #7d8c85; }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  .stage { position: relative; width: 1920px; height: 1080px; }
  .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
  .dot.a { left: 180px; top: 760px; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) 0.1s both; }
  .dot.b { left: 280px; top: 760px; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) 0.35s both; }
  .dot.c { left: 380px; top: 760px; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) 0.6s both; }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } to { transform: translateY(-420px); opacity: 1; } }
  h1 {
    position: absolute; left: 180px; top: 300px; margin: 0;
    font-size: 150px; font-weight: 800; letter-spacing: -3px;
    animation: slide-in 1s ease-out 0.4s both;
  }
  @keyframes slide-in { from { transform: translateX(-80px); opacity: 0; clip-path: inset(0 100% 0 0); } to { transform: none; opacity: 1; clip-path: inset(0 0 0 0); } }
  .sub {
    position: absolute; left: 186px; top: 500px; margin: 0; font-size: 52px; color: var(--muted);
    animation: fade-up 0.8s ease-out 1.6s both;
  }
  @keyframes fade-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .bar {
    position: absolute; left: 0; bottom: 0; height: 12px; width: 0; background: var(--accent);
  }
  /* The bar is driven by --t-ms (the renderer sets it on :root each frame): 6000 ms = 100%. */
  .bar { width: calc(var(--t-ms, 0) / 60 * 1%); }
  .end { position: absolute; right: 180px; top: 300px; font-size: 40px; color: var(--muted);
    animation: fade-out 0.01s linear 5.99s both; }
  @keyframes fade-out { to { opacity: 0; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="dot a"></div><div class="dot b"></div><div class="dot c"></div>
    <h1>Ship it faster</h1>
    <p class="sub">Short videos from one HTML file</p>
    <div class="end">made with Tico</div>
    <div class="bar"></div>
  </div>
</body>
</html>
