<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example signup page</title>
<style>
  :root { --ink: #1d2733; --line: #cfd8e3; --brand: #2456d6; --ok: #1b7f4b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: #eef2f7; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 20px 56px; font-weight: 700; font-size: 22px; }
  main { max-width: 760px; margin: 72px auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 48px; }
  h1 { margin: 0 0 8px; font-size: 40px; }
  p.lead { margin: 0 0 32px; color: #4b5a6b; font-size: 20px; }
  label { display: block; font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; font-size: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 24px; }
  button { font-size: 20px; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 8px; padding: 14px 28px; cursor: pointer; }
  #result { margin-top: 28px; padding: 18px 20px; border-radius: 8px; background: #e7f5ee; color: var(--ok); font-size: 20px; font-weight: 600; display: none; }
  #result.show { display: block; }
</style>
</head>
<body>
  <header>Example Co</header>
  <main>
    <h1>Start your trial</h1>
    <p class="lead">Fourteen days, no card needed.</p>
    <form id="form" onsubmit="return false">
      <label for="name">Full name</label>
      <input id="name" type="text" autocomplete="off" placeholder="Your name">
      <button id="submit" type="button">Start trial</button>
    </form>
    <div id="result" role="status">Trial started. Check your inbox for the welcome note.</div>
  </main>
<script>
  // Shows the result a moment after the click, like a real signup call would.
  document.getElementById('submit').addEventListener('click', () => {
    setTimeout(() => document.getElementById('result').classList.add('show'), 400);
  });
</script>
</body>
</html>
