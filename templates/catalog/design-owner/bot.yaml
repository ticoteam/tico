name: design-owner                     # the slug: it matches the repository bot-design-owner and the label owner:design-owner
display_name: "Design Owner"
labels: [owner:design-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: monthly-brand-audit
    title: Monthly brand consistency audit
    cron: "0 10 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-brand-audit.md
    labels: [priority:p2]
    enabled: false

# Nothing to connect to start: public pages are read from the web and internal assets arrive on tasks.
tools: []
