name: success-owner                     # the slug: it matches the repository bot-success-owner and the label owner:success-owner
display_name: "Success Owner"
labels: [owner:success-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-renewal-brief
    title: Weekly renewal and health brief
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-renewal-brief.md
    labels: [priority:p2]
    enabled: false

