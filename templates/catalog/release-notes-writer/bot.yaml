name: release-notes-writer                     # the slug: it matches the repository bot-release-notes-writer and the label owner:release-notes-writer
display_name: "Release Notes Writer"
labels: [owner:release-notes-writer]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-release-notes
    title: Weekly release notes draft
    cron: "0 14 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-release-notes.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads merged pull requests and releases; drafts notes on the task; with a write grant, pushes the approved release tag (playbooks/rollout.md); never creates a release"
# For the rollout (playbooks/rollout.md), one entry per install in knowledge/rollout.json, uncommented when its key is granted:
#  - service: tico-updates
#    identity: "the update key of the other install (tico service-key create --scope update)"
#    can: [update]
#    env: UPDATE_KEY_OTHER
#    note: "checks for, starts and follows an update of that install after the owner approves the release; nothing else"
# Writing to GitHub is the owner's decision, not the template's: the team's GitHub App token can write, so the only
# thing between this bot and a public comment is its declared access and.claude/settings.json, which deny every write
# verb. It stays read only; requested changes need granted write access.
