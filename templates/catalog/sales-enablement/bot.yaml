name: sales-enablement            # the slug: it matches the repository bot-sales-enablement and the label owner:sales-enablement
display_name: "Sales Enablement Manager"
labels: [owner:sales-enablement]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-win-loss
    title: Weekly win/loss notes
    cron: "0 10 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-win-loss.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Imported calls come through
# Tico. Changing access is an owner decision, so the bot files a task for the owner rather than
# editing this file.
# Optional, uncomment when connected. Never write.
# tools:
#   - service: close-crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CLOSE_API_KEY
#     note: "closed deals, loss reasons, amounts and competitors; read only"
tools: []
