name: vendor-manager                     # the slug: it matches the repository bot-vendor-manager and the label owner:vendor-manager
display_name: "Vendor Manager"
labels: [owner:vendor-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-vendor-page
    title: Weekly vendor and renewals page
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-vendor-page.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. Renewal notices and first invoices arrive by mail:
