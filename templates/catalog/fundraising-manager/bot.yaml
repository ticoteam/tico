name: fundraising-manager                     # the slug: it matches the repository bot-fundraising-manager and the label owner:fundraising-manager
display_name: "Fundraising Manager"
labels: [owner:fundraising-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-raise-review
    title: Weekly raise review
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-raise-review.md
    labels: [priority:p2]
    enabled: false

tools: []
