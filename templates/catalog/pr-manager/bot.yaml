name: pr-manager                     # the slug: it matches the repository bot-pr-manager and the label owner:pr-manager
display_name: "PR Manager"
labels: [owner:pr-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-pr-review
    title: Weekly PR review
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-pr-review.md
    labels: [priority:p2]
    enabled: false

# Nothing to connect to start: coverage is read from the public web and pitches are prepared on the
# task. Requested pitches and releases stay drafts until a person turns mail sending on in Tico.
tools: []
