name: it-support                     # the slug: it matches the repository bot-it-support and the label owner:it-support
display_name: "IT Support Specialist"
labels: [owner:it-support]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts what it prepared on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-it-page
    title: Weekly IT page
    cron: "30 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-it-page.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools: []
# Optional, uncomment when connected. An IT help channel where people post requests:
# tools:
#   - service: slack
#     identity: the team workspace
#     can: [read]
#     channels: [it-help]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads the IT help channel for requests; never posts"
# Changing accounts in an admin console is the owner's decision: add that service with `can: [read]`
# first, and widen it when the requested work requires it.
