name: segment-marketing-owner                # the slug: it matches the repository bot-segment-marketing-owner and the label owner:segment-marketing-owner
display_name: "Marketing Owner"
labels: [owner:segment-marketing-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 45

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-segment-growth-review
    title: Weekly segment growth review
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-segment-growth-review.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Channel numbers come from Tico's growth numbers and the spend report attached to its tasks, so no
# ad account is declared: the bot never gets an account that can spend money.
# Optional, uncomment when connected. Read only.
# tools:
#   - service: crm
#     identity: "the customer records the owner lists for this bot"
#     can: [read]
#     note: "reads each account's segment; never edits"
tools: []
