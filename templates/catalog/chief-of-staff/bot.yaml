name: chief-of-staff              # the slug: it matches the repository bot-chief-of-staff and the label owner:chief-of-staff
display_name: "Chief of Staff"
labels: [owner:chief-of-staff]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 45

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-company-brief
    title: Weekly team brief
    cron: "0 15 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-company-brief.md
    labels: [priority:p2]
    enabled: false

# Tico itself (goals, tasks, updates, meetings, calendar, docs) needs no entry: every run has it.
# This bot reads nothing outside Tico, so there is nothing to declare.
tools: []
