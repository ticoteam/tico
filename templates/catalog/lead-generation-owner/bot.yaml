name: lead-generation-owner          # the slug: it matches the repository bot-lead-generation-owner and the label owner:lead-generation-owner
display_name: "Lead Generation Owner"
labels: [owner:lead-generation-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-lead-report
    title: Weekly lead report
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-lead-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "company sites, news, job posts and public directories for the lists; no forms, no messages, no accounts, no personal profiles"
# Optional, uncomment when connected. Read only: never a write, never a send.
#   - service: crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CRM_API_KEY
#     note: "leads with their source, stage, owner and first-touch time; read only, never a write"
