name: content-owner                     # the slug: it matches the repository bot-content-owner and the label owner:content-owner
display_name: "Content Owner"
labels: [owner:content-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on both, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once; from then on Tico's rows are the routines
# (docs/routines.md).
routines:
  - id: watch
    title: Watch Content
    cron: "0 7 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find Content ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value. Store a Credential in Tico and grant it to this bot;
# the runner delivers it during a run. Declaring access here does not create a grant.
# tools:
#   - service: mail
#     identity: "desk@example.com"
#     can: [read, draft]          # send only with send access; Tico's sending policy decides
#     env: MAIL_CREDENTIALS
#     note: "reads and drafts on its own mailbox; never files and never sends"
tools: []
