name: operations-manager                     # the slug: it matches the repository bot-operations-manager and the label owner:operations-manager
display_name: "Operations Manager"
labels: [owner:operations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-ops-checklist
    title: Weekly ops checklist and team summary
    cron: "30 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-ops-checklist.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. A vendor's last message helps a follow-up not repeat itself:
# tools:
#   - service: gmail
#     identity: "ops@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads vendor threads and leaves a draft follow-up; never files or sends"
