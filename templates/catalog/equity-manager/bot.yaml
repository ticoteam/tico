name: equity-manager                     # the slug: it matches the repository bot-equity-manager and the label owner:equity-manager
display_name: "Equity Manager"
labels: [owner:equity-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: monthly-cap-table-check
    title: Monthly cap table check
    cron: "0 9 5 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-cap-table-check.md
    labels: [priority:p2]
    enabled: false

tools: []
