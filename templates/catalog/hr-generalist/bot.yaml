name: hr-generalist                     # the slug: it matches the repository bot-hr-generalist and the label owner:hr-generalist
display_name: "HR Generalist"
labels: [owner:hr-generalist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-onboarding-tracker
    title: Weekly onboarding tracker
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-onboarding-tracker.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. The handbook and policies are read from the team docs in Tico
# (`tico doc`), which every run already has. There is deliberately no HR-system entry: this bot works from
# a checklist and the handbook, and a human copies anything a system needs.
