name: strategy-analyst                     # the slug: it matches the repository bot-strategy-analyst and the label owner:strategy-analyst
display_name: "Strategy Analyst"
labels: [owner:strategy-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: quarterly-plan
    title: Quarterly plan and OKR draft
    cron: "0 9 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/quarterly-plan.md
    labels: [priority:p2]
    enabled: false

tools: []
