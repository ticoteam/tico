name: logistics-coordinator                     # the slug: it matches the repository bot-logistics-coordinator and the label owner:logistics-coordinator
display_name: "Logistics Coordinator"
labels: [owner:logistics-coordinator]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-delivery-report
    title: Weekly delivery and exceptions report
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-delivery-report.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. Carrier notices and claim replies arrive by mail:
