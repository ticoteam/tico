name: hr-business-partner                     # the slug: it matches the repository bot-hr-business-partner and the label owner:hr-business-partner
display_name: "HR Business Partner"
labels: [owner:hr-business-partner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-performance-tracker
    title: Weekly performance cycle tracker
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-performance-tracker.md
    labels: [priority:p2]
    enabled: false

tools: []
# There is deliberately no HR-system or performance-tool entry: reviews and ratings are handed over on tasks by the
# HR owner, and individual content is attached to those tasks, never kept in this repository.
