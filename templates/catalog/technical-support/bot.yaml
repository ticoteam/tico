name: technical-support               # the slug: it matches the repository bot-technical-support and the label owner:technical-support
display_name: "Technical Support Engineer"
labels: [owner:technical-support]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts every prepared reply on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-tier2-report
    title: Weekly tier 2 queue report
    cron: "0 9 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-tier2-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads code and issues to check whether a bug is known; a human files and comments. Writing stays off"
# Filing issues is a human's act:.claude/settings.json denies gh issue create, comment and edit. To let
# this bot file a requested report, the owner changes `can` to [read, write] and moves
# `Bash(gh issue create *)` from `deny` to `allow`. It still never closes, labels or comments.
