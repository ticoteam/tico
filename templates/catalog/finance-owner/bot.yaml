name: finance-owner                 # the slug: it matches the repository bot-finance-owner and the label owner:finance-owner
display_name: "Finance Owner"
labels: [owner:finance-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Its work comes two ways. Events that want an answer on the day are routines below, one task per event. Everything
# that arrives in volume (rows to categorize, receipts, emailed bills) or is a standing state (reconciling) comes from
# the server's hourly Books check (backend/bookkeeper.py): plain code reads its Finance work queue and opens a task only
# when the queue has something new, so a quiet month wakes no model. The monthly report is real work every month.
# The server's daily Books watch and weekly rules digest are checks of the same kind: a task only when one finds
# something new (playbooks/books-watch.md, playbooks/rules-digest.md). The weekly cash summary is real work every Monday.
# server seeds these once, when the Finance Owner is built in; from then on Tico's rows are the routines
# (docs/routines.md). Set the timezone to the team's own.
routines:
  - id: monthly-report
    title: Monthly finance report
    cron: "0 9 3 * *"
    timezone: America/Los_Angeles
    template: playbooks/monthly-report.md
    labels: [priority:p2]
  - id: weekly-cash-summary
    title: Weekly cash summary
    cron: "30 8 * * 1"
    timezone: America/Los_Angeles
    template: playbooks/weekly-cash-summary.md
    labels: [priority:p2]
  - id: bill-due
    title: Bill due soon
    "on": finance.bill.due_soon         # quoted: YAML reads a bare `on` as true
    timezone: America/Los_Angeles
    template: playbooks/bill-due.md
    labels: [priority:p2]
  - id: invoice-overdue
    title: Invoice overdue
    "on": finance.invoice.overdue
    timezone: America/Los_Angeles
    template: playbooks/invoice-overdue.md
    labels: [priority:p3]
  - id: close-month
    title: Month ready to close
    "on": finance.period.ready
    timezone: America/Los_Angeles
    template: playbooks/close-month.md
    labels: [priority:p2]

# It needs no tool or credential of its own: Finance's books, banks and cards are reached through the tico_finance tools.
tools: []
