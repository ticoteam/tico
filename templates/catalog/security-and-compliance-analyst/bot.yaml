name: security-and-compliance-analyst                     # the slug: it matches the repository bot-security-and-compliance-analyst and the label owner:security-and-compliance-analyst
display_name: "Security and Compliance Analyst"
labels: [owner:security-and-compliance-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: monthly-controls-page
    title: Monthly evidence and controls page
    cron: "0 10 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-controls-page.md
    labels: [priority:p2]
    enabled: false

tools: []
