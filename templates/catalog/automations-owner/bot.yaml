name: automations-owner              # the slug: it matches the repository bot-automations-owner and the label owner:automations-owner
display_name: "Automations Owner"
labels: [owner:automations-owner]
reads: []                            # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 30

# The routine this bot starts with. The server seeds it once, when the Automations Owner is built in; from then on
# it is an Automation (docs/routines.md). Set the timezone to the team's own.
routines:
  - id: review-the-automations
    title: Review the automations
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles
    template: playbooks/review-the-automations.md
    labels: [priority:p3]

# It needs no tool or credential of its own: it reads and proposes through `tico automation` and tasks.
tools: []
