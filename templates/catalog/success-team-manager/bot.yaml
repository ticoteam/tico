name: success-team-manager           # the slug: it matches the repository bot-success-team-manager and the label owner:success-team-manager
display_name: "Success Team Manager"
labels: [owner:success-team-manager]
reads: []                            # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-success-summary
    title: Weekly success summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-success-summary.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. Tico itself (tasks, updates, reports, the org) needs no entry.
tools: []
