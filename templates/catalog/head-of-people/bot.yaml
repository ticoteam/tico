name: head-of-people                     # the slug: it matches the repository bot-head-of-people and the label owner:head-of-people
display_name: "Head of People"
labels: [owner:head-of-people]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-people-summary
    title: Weekly people summary
    cron: "30 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-people-summary.md
    labels: [priority:p2]
    enabled: false

tools: []
# Optional, uncomment when connected. The handbook is read through the Librarian (`tico doc ask`) and the roster
# through `tico team show`, which every run already has. There is deliberately no HR-system entry: a human copies
# anything a system needs.
