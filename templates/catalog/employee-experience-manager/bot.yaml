name: employee-experience-manager                     # the slug: it matches the repository bot-employee-experience-manager and the label owner:employee-experience-manager
display_name: "Employee Experience Manager"
labels: [owner:employee-experience-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-milestones-and-actions
    title: Weekly milestones and engagement actions
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-milestones-and-actions.md
    labels: [priority:p2]
    enabled: false

tools: []
