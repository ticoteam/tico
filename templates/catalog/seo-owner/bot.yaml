name: seo-owner                     # the slug: it matches the repository bot-seo-owner and the label owner:seo-owner
display_name: "SEO Owner"
labels: [owner:seo-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: watch
    title: Watch SEO
    cron: "0 7 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find SEO ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "the team's public pages and competitors' pages; no forms, no messages, no accounts"
