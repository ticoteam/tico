name: software-architect              # the slug: it matches the repository bot-software-architect and the label owner:software-architect
display_name: "Software Architect"
labels: [owner:software-architect]
shared: true
session: task
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: high
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts every review note and ADR on the task and requested commits use the repository Tools, and outside posts stay drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-architecture-review
    title: Weekly architecture review
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-architecture-review.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. The team's GitHub App gives the bot a short-lived
# token for the repositories the owner lists for it in Settings (docs/github-app.md).
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads design docs, ADR folders, pull requests and code; proposes ADRs as files on the task; never commits or comments"
# The token can write, so the only thing between this bot and a change on GitHub is this entry and
#.claude/settings.json, which denies every pull request write and gh api. Requested ADR commits use the granted Tools.
