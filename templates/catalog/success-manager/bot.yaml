name: success-manager           # the slug: it matches the repository bot-success-manager and the label owner:success-manager
display_name: "Success Manager"
labels: [owner:success-manager]
reads: []                            # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-success-summary
    title: Weekly success summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-success-summary.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Tico itself (tasks, updates, reports, the org) needs no entry.
tools: []
