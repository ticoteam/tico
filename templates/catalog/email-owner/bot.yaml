name: email-owner                     # the slug: it matches the repository bot-email-owner and the label owner:email-owner
display_name: "Email Owner"
labels: [owner:email-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# Declared off. Starting setup (or going live) switches on both, once, unless a person changed one first
# (Onboarding.arm_routines). `tico bot create` seeds them once; from then on Tico's rows are the routines
# (docs/routines.md).
routines:
  - id: watch
    title: Watch Email
    cron: "0 7 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/watch.md
    labels: [priority:p2]
    enabled: false
  - id: find-ideas
    title: Find Email ideas
    cron: "0 8 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/find-ideas.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Tico itself (tasks, files) needs no entry: every run has it. This bot has no access to the email platform until the
# owner grants one: until then a person puts each OK'd email live.
# Optional, uncomment when the owner wants replies to earlier campaigns readable:
# tools:
#   - service: gmail
#     identity: "marketing@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads replies to campaigns; never files or sends"
tools: []
