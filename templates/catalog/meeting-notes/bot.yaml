name: meeting-notes               # the slug: it matches the repository bot-meeting-notes and the label owner:meeting-notes
display_name: "Project Coordinator"
labels: [owner:meeting-notes]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Nothing addressed to anyone outside the team leaves: the bot puts every outside message on the task
# as a draft for a person to send.
outbound_send: false

# The first routine is declared but not armed (`enabled: false`). It runs on Tico's
# `meeting.ready` event: one task per imported team meeting, carrying the notes and transcript.
# The bot arms it with `hub automation update <id> --enable` when Setup starts; setup-done allows normal work.
# `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: meeting-notes
    title: Meeting notes draft
    "on": meeting.ready               # quoted: an unquoted `on` is read as a boolean by YAML
    template: playbooks/write-up-a-meeting.md
    labels: [priority:p3]
    enabled: false

# Tico itself (meetings, tasks, goals, docs) needs no entry: every run has it. Bots read team
# meetings and never private ones. Add a Slack entry only when the work calls for summaries
# posted to an internal channel; requested internal posting uses the granted Tools.
# tools:
#   - service: slack
#     identity: the team workspace
#     can: [read, post]
#     channels: [team]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "posts a requested summary to one internal channel; never a DM, never a customer channel"
tools: []
