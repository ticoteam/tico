name: issue-triage                # the slug: it matches the repository bot-issue-triage and the label owner:issue-triage
display_name: "QA Engineer"
labels: [owner:issue-triage]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# a comment on a public issue is a draft; public comments stay drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-issue-digest
    title: Weekly issue digest
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-issue-digest.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. The team's GitHub App gives the bot a
# short-lived token for its own repository plus the extra repositories the owner lists for it in
# Settings (docs/github-app.md); the repositories to triage are named in state.md after setup.
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads issues; requested label changes need write access, and public comments need outbound_send on"
# Writing to GitHub is the owner's decision, not the template's: the team's GitHub App token can write issues, so
# the only thing between this bot and a public comment is what its access and.claude/settings.json allow. To let it
# apply a requested plan, change `can` to [read, write] and move `Bash(gh issue edit *)` and
# `Bash(gh issue comment *)` from `deny` to `allow` in.claude/settings.json. It still never closes, assigns or transfers.
