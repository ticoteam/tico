name: retention-specialist                     # the slug: it matches the repository bot-retention-specialist and the label owner:retention-specialist
display_name: "Retention Specialist"
labels: [owner:retention-specialist]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-retention-report
    title: Weekly retention report
    cron: "0 10 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-retention-report.md
    labels: [priority:p2]
    enabled: false

# Optional, uncomment what setup says is connected. No entry may ever carry write or send.
# tools:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads cancellation requests in the support mailbox; never drafts, files or sends"
tools: []
