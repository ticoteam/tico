name: customer-insights-analyst                     # the slug: it matches the repository bot-customer-insights-analyst and the label owner:customer-insights-analyst
display_name: "Customer Insights Analyst"
labels: [owner:customer-insights-analyst]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 45

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-feedback-report
    title: Weekly feedback report
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-feedback-report.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Feedback arrives as tasks, pasted exports and the reports other bots publish. Optional, uncomment what
# the setup says is connected. Read only, always: it never contacts a customer.
# tools:
#   - service: gmail
#     identity: "support@example.com"
#     can: [read]
#     env: GOOGLE_SA_KEY
#     note: "reads support threads for feedback themes; never drafts, files or sends"
#   - service: slack
#     identity: the team workspace
#     can: [read]
#     channels: [feedback]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads one feedback channel; never posts"
#   - service: public-web
#     identity: "Unauthenticated public sources"
#     can: [read]
#     note: "reads public reviews of the team when a human points at them; no forms, no accounts"
tools: []
