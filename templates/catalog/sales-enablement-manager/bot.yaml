name: sales-enablement-manager            # the slug: it matches the repository bot-sales-enablement-manager and the label owner:sales-enablement-manager
display_name: "Sales Enablement Manager"
labels: [owner:sales-enablement-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-win-loss
    title: Weekly win/loss notes
    cron: "0 10 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-win-loss.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Imported calls come through Tico.
# Optional, uncomment when connected. Never write.
# tools:
