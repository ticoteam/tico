name: rules-owner               # the slug: it matches the repository bot-rules-owner and the label owner:rules-owner
display_name: "Rules Owner"
labels: [owner:rules-owner]
reads: []                        # other bot repositories this one may clone read-only

# The Rules Owner's tasks are private (its requester and the Rules Owner only); matches the server's default for this template.
private_tasks_default: true

# Each task is judged on its own: no session carries over to the next task, no memory/ is read or kept, and
# nightly learnings skip it (backend/hubdb.py stateless, STATELESS_BY_TEMPLATE).
stateless: true
max_run_minutes: 60

# No routines and no watchers: The Rules Owner only runs on a task (a document added, or a question asked).
routines: []

# What this bot may touch: nothing outside Tico. It has no credentials and sends nothing: it reads the document its task
# gives it and the rules in force, and writes suggestions through `tico rules`. Tico fetches a link itself, with no
# credential, before the Rules Owner's task exists; the Rules Owner never fetches.
tools: []
