name: affiliates-owner                     # the slug: it matches the repository bot-affiliates-owner and the label owner:affiliates-owner
display_name: "Affiliates Owner"
labels: [owner:affiliates-owner]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-affiliate-review
    title: Weekly affiliate review
    cron: "0 9 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-affiliate-review.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "affiliates' declared public sites, coupon sites and the team's public terms page; no forms, no messages, no accounts"
# Optional, uncomment when connected. Neither entry may ever carry write or send.
#   - service: gmail
#     identity: "affiliates@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads applications and affiliate questions and leaves drafts; never sends"
