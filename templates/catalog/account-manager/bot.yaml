name: account-manager             # the slug: it matches the repository bot-account-manager and the label owner:account-manager
display_name: "Account Manager"
labels: [owner:account-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-account-review
    title: Weekly renewal and expansion review
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-account-review.md
    labels: [priority:p2]
    enabled: false

