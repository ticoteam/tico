name: builder                    # the slug: it matches the repository bot-builder and the label owner:builder
display_name: "Builder"
labels: [owner:builder]
shared: true
session: task
reads: []                        # other bot repositories this one may clone read-only

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads the listed repositories, pull requests and checks; opening branches and pull requests needs write access the owner grants; it never merges"
# A starter is read only, and the owner grants write once the bot should build. The team's GitHub App token can write,
# so the only things between this bot and a merge, a release, a force push or a review are the granted access and
# .claude/settings.json, which allows branches and pull requests and denies merges, reviews, closes, releases, tags, API
# calls, skipped pre-push hooks and forced pushes (a --force-with-lease after a rebase is allowed). The Engineering
# pipeline's Merge stage queues each pull request.
