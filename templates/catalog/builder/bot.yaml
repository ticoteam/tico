name: builder                    # the slug: it matches the repository bot-builder and the label owner:builder
display_name: "Builder"
labels: [owner:builder]
shared: true
session: task
reads: []                        # other bot repositories this one may clone read-only

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads the listed repositories, pull requests and checks; opening branches and pull requests needs write access the owner grants; the merge queue merges where the repository has one"
# A starter is read only, and the owner grants write once the bot should build. The team's GitHub App token can write,
# so what stands between this bot and a merge, a release or a review is the granted access and its instructions.
# .claude/settings.json denies only what cannot be undone: forced pushes (a --force-with-lease after a rebase is
# allowed), deleting a repository, release, run, cache or issue, and secrets and variables. The Engineering
# pipeline's Merge stage queues each pull request.
