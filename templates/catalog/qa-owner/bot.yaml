name: qa-owner                    # the slug: it matches the repository bot-qa-owner and the label owner:qa-owner
display_name: "QA Owner"
labels: [owner:qa-owner]
shared: true
session: task
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 60

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-test-health
    title: Weekly test health report
    cron: "0 9 * * 2"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-test-health.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. The team's GitHub App gives the bot a short-lived
# token for the repositories the owner lists for it in Settings (docs/github-app.md).
tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads test code, pull requests, check results and run logs; opening a branch or a pull request for a test needs write access the owner grants; never reruns, cancels or triggers a workflow, never merges or reviews"
# The token can write once the owner grants it, so the only things between this bot and a merge, a rerun or a skipped test
# are this entry and .claude/settings.json, which allows branches and pull requests and denies merges, reviews, reruns and API calls.
