name: site-reliability-engineer                     # the slug: it matches the repository bot-site-reliability-engineer and the label owner:site-reliability-engineer
display_name: "Site Reliability Engineer"
labels: [owner:site-reliability-engineer]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-incident-review
    title: Weekly incident review
    cron: "0 10 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-incident-review.md
    labels: [priority:p2]
    enabled: false

tools: []
