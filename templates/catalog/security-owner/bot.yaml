name: security-owner               # the slug: it matches the repository bot-security-owner and the label owner:security-owner
display_name: "Security Owner"
labels: [owner:security-owner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

# What the Tico AI Gateway gives this bot when nobody picked a model: its group's pick at this level.
gateway:
  level: high

routines:
  - id: weekly-security-report
    title: Weekly dependency and advisory report
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-security-report.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads Dependabot pull requests, lockfiles and code to trace reachability; never dismisses an alert, merges or changes a setting"
# The token can write, so the only thing between this bot and a change on GitHub is this entry and its
# instructions. Keep it read only:
# engineers merge the upgrades the patch plan lists.
