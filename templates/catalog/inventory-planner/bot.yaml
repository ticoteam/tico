name: inventory-planner                     # the slug: it matches the repository bot-inventory-planner and the label owner:inventory-planner
display_name: "Inventory Planner"
labels: [owner:inventory-planner]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-reorder-list
    title: Weekly reorder list
    cron: "30 7 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-reorder-list.md
    labels: [priority:p2]
    enabled: false

tools: []
