name: accounts-receivable-specialist                     # the slug: it matches the repository bot-accounts-receivable-specialist and the label owner:accounts-receivable-specialist
display_name: "Accounts Receivable Specialist"
labels: [owner:accounts-receivable-specialist]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 45

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `tico bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-receivables-reminders
    title: Weekly receivables reminders
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-receivables-reminders.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# The aging export arrives as a file on a task, so nothing is declared to start. Optional, uncomment
# when connected (changing access is an owner decision). Read only: never a write, never send.
# tools:
#   - service: gmail
#     identity: "billing@example.com"
#     can: [read, draft]          # never send: drafts only
#     env: GOOGLE_SA_KEY
#     note: "reads the sender's threads with a customer and leaves a draft; never files or sends"
tools: []
