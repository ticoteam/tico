name: office-manager                     # the slug: it matches the repository bot-office-manager and the label owner:office-manager
display_name: "Office Manager"
labels: [owner:office-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-office-page
    title: Weekly office page
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-office-page.md
    labels: [priority:p2]
    enabled: false

tools: []
