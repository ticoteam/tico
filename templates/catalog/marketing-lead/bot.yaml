name: marketing-lead                     # the slug: it matches the repository bot-marketing-lead and the label owner:marketing-lead
display_name: "Head of Marketing"
labels: [owner:marketing-lead]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 45

# Declared off. Setup switches on only the first routine; the onboarding playbook (step 6) switches on the two growth
# routines with `hub automation update <id> --enable`. `hub bot create` seeds them once; from then on Tico's automations
# are the routines (docs/routines.md).
routines:
  - id: weekly-marketing-summary
    title: Weekly marketing summary
    cron: "0 14 * * 5"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-marketing-summary.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-growth-meeting
    title: Weekly growth meeting
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-meeting.md
    labels: [priority:p2]
    enabled: false
  - id: weekly-numbers
    title: Weekly numbers
    cron: "0 7 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-numbers.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Changing access is an
# owner decision, so the bot files a task for the owner rather than editing this file.
# Tico itself (tasks, updates, reports, calendar, meetings) needs no entry: every run has it.
tools: []
