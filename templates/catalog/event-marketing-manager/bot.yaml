name: event-marketing-manager                     # the slug: it matches the repository bot-event-marketing-manager and the label owner:event-marketing-manager
display_name: "Event Marketing Manager"
labels: [owner:event-marketing-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-events-review
    title: Weekly events review
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-events-review.md
    labels: [priority:p2]
    enabled: false

# Optional, uncomment when connected. The CRM is read so each event's leads, meetings and pipeline can
# be counted; the bot never creates or edits a record there.
# tools:
#   - service: crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CRM_API_KEY
#     note: "contacts and deals by campaign or event source; read only"
tools: []
