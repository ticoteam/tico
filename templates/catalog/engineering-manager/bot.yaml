name: engineering-manager
display_name: "Engineering Manager"
labels: [owner:engineering-manager]
reads: []
max_run_minutes: 60
routines:
  - id: weekly-engineering-summary
    title: Weekly engineering summary
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles
    template: playbooks/weekly-engineering-summary.md
    labels: [priority:p2]
    enabled: false
tools:
  - service: github
    identity: the team's enabled repositories
    can: [read]
    note: Read code, pull requests, checks and reviews to decide stopped tasks, write the weekly summary, and read what changed after an OK or merged outside the queue. It never writes to GitHub.
