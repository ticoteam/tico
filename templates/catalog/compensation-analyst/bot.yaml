name: compensation-analyst                     # the slug: it matches the repository bot-compensation-analyst and the label owner:compensation-analyst
display_name: "Compensation Analyst"
labels: [owner:compensation-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 45

routines:
  - id: weekly-pay-check
    title: Weekly offer and pay change check
    cron: "0 11 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-pay-check.md
    labels: [priority:p2]
    enabled: false

tools: []
# There is deliberately no payroll or HR-system entry: pay data arrives as exports on tasks, person-level results
# go back as task attachments for the owners, and nothing with a named person's pay is kept here.
