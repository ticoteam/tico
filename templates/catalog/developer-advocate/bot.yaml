name: developer-advocate              # the slug: it matches the repository bot-developer-advocate and the label owner:developer-advocate
display_name: "Developer Advocate"
labels: [owner:developer-advocate]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then every
# public reply is prepared on the task, and requested replies are posted with Tools when a person has turned mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-developer-pulse
    title: Weekly developer pulse
    cron: "0 10 * * 4"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-developer-pulse.md
    labels: [priority:p3]
    enabled: false

# What this bot may touch. Not listed is not allowed. Public forums are read on the open web and need no entry.
# The SDK and examples repositories are read with the team's GitHub App token once the owner lists them.
# Optional, uncomment when connected. These entries start read only. Requested writes need the necessary Tools; public messages stay drafts until a person turns mail sending on in Tico.
# tools:
#   - service: github
#     identity: "the SDK, examples and discussion repositories the owner lists for this bot"
#     can: [read]
#     note: "reads discussions, issues and example code; never comments, opens a pull request or pushes"
#   - service: slack
#     identity: the team workspace
#     can: [read]
#     channels: [developer-community]
#     dms: false
#     env: SLACK_BOT_TOKEN
#     note: "reads one community channel; never posts"
tools: []
