name: pricing-analyst                     # the slug: it matches the repository bot-pricing-analyst and the label owner:pricing-analyst
display_name: "Pricing Analyst"
labels: [owner:pricing-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: monthly-pricing-review
    title: Monthly pricing review
    cron: "0 9 1 * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/monthly-pricing-review.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "competitors' public pricing pages; no accounts, no forms, no sign-ups"
# Optional, uncomment when connected. Read only: a human changes prices and records.
#   - service: crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CRM_API_KEY
#     note: "closed deals, list and charged prices, discounts; never a write"
