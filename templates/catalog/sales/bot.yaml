name: sales                     # the slug: it matches the repository bot-sales and the label owner:sales
display_name: "Account Executive"
labels: [owner:sales]
reads: []                        # other bot repositories this one may clone read-only

# These must agree with the bot's settings on the server, or be left out of this file entirely.
reasoning_effort: medium
max_run_minutes: 60

# Nothing addressed to anyone outside the team leaves until an owner turns this on. Until then
# the bot puts the draft on the task and drafts until a person turns mail sending on in Tico.
outbound_send: false

# The first routine is declared off (`enabled: false`) and switched on when a human starts the bot's setup
# (Start setup, go-live). `hub bot create` seeds it once; from then on Tico's row is the routine (docs/routines.md).
routines:
  - id: weekly-deal-review
    title: Weekly deal review
    cron: "0 9 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-deal-review.md
    labels: [priority:p2]
    enabled: false

# What this bot may touch. Not listed is not allowed. `env:` names the variable a credential
# arrives in, never the value; declaring access here does not create it. Public research needs no
# credential. The CRM and the sender's mailbox are optional: changing access is an owner decision, so the
# bot files a task for the owner rather than editing this file. Uncomment what setup says
# is connected. Neither entry may ever carry write or send.
tools:
  - service: public-web
    identity: "Unauthenticated public sources"
    can: [read]
    note: "buyer sites, news, changelogs and public profiles; no forms, no messages, no accounts"
# Optional, uncomment when connected:
