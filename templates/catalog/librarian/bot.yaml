name: librarian                  # the slug: it matches the repository bot-librarian and the label owner:librarian
display_name: "Librarian"
labels: [owner:librarian]
reads: []                        # other bot repositories this one may clone read-only

# This must agree with the bot's settings on the server, or be left out of this file entirely.
max_run_minutes: 45

# The routines this bot starts with. The server seeds them once, when the Librarian is built in; from
# then on they are Automations: `tico automation list` lists them and
# `tico automation update <id>` changes one (docs/routines.md).
routines:
  - id: refresh-the-map
    title: Refresh the map of the docs
    cron: "30 3 * * *"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/refresh-the-map.md
    labels: [priority:p3]
  - id: curate-the-market
    title: Curate the market
    cron: "0 4 * * *"
    timezone: America/Los_Angeles
    template: playbooks/curate-the-market.md
    labels: [priority:p3]
  - id: urgent-market-insight
    title: Urgent market insight
    "on": market.insight.urgent    # quoted: YAML reads a bare `on` as true
    timezone: America/Los_Angeles
    template: playbooks/urgent-market-insight.md
  - id: customer-themes
    title: Customer themes
    "on": meeting.ready            # live, non-private team meetings only (docs/meetings.md)
    timezone: America/Los_Angeles
    template: playbooks/customer-themes.md

# What this bot may touch. It reads the docs through `tico doc` and public links through `tico doc fetch`,
# and needs no Credential of its own. A GitHub token stored in Credentials and granted to it lets it read private
# repositories that are linked as docs; it is only ever sent to api.github.com. Web search is for the market setup,
# research and deep research tasks a person files: public facts in, public pages read, nothing written outside.
tools:
  - service: web-search
    can: [use]
    note: "market setup, research and deep research tasks; queries hold public facts only, never text from a doc"
