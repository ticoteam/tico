name: product-analyst                     # the slug: it matches the repository bot-product-analyst and the label owner:product-analyst
display_name: "Product Analyst"
labels: [owner:product-analyst]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-usage-readout
    title: Weekly product usage readout
    cron: "0 9 * * 3"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-usage-readout.md
    labels: [priority:p2]
    enabled: false

# Team databases are read through Tico (`tico db`), with the rights the owner granted there.
# Optional, uncomment when an analytics export or warehouse is connected. Read only, always.
# tools:
#   - service: warehouse
#     identity: "the analytics warehouse, read-only role"
#     can: [read]
#     env: WAREHOUSE_READONLY_URL
#     note: "aggregated product events; never writes, never exports rows about one person"
tools: []
