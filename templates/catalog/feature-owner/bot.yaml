name: feature-owner                # the slug: it matches the repository bot-feature-owner and the label owner:feature-owner
display_name: "Feature Owner"
labels: [owner:feature-owner]
session: task                      # one task, one session: from the Spec to the check in production
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-area-review
    title: Weekly area review
    cron: "0 8 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-area-review.md
    labels: [priority:p2]
    enabled: false

tools:
  - service: github
    identity: "the product repositories the owner lists for this bot"
    can: [read]
    note: "reads the listed repositories, pull requests and checks; opening branches and pull requests needs write access the owner grants; the merge queue merges where the repository has one"
# A starter is read only, and the owner grants write once the bot should build. The team's GitHub App token can write,
# so what stands between this bot and a merge, a release or a review is the granted access and its instructions.
# .claude/settings.json denies only what cannot be undone: forced pushes (a --force-with-lease after a rebase is
# allowed), deleting a repository, release, run, cache or issue, and secrets and variables. The Merge stage
# queues each pull request.
# Optional, uncomment when connected. Read only.
#   - service: crm
#     identity: "the customer records the owner lists for this bot"
#     can: [read]
#     note: "reads which customers are in this area; never edits"
