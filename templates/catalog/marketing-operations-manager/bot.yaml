name: marketing-operations-manager                     # the slug: it matches the repository bot-marketing-operations-manager and the label owner:marketing-operations-manager
display_name: "Marketing Operations Manager"
labels: [owner:marketing-operations-manager]
reads: []                        # other bot repositories this one may clone read-only

max_run_minutes: 60

routines:
  - id: weekly-marketing-data-check
    title: Weekly marketing data check
    cron: "0 10 * * 1"
    timezone: America/Los_Angeles     # set this to the team's own timezone
    template: playbooks/weekly-marketing-data-check.md
    labels: [priority:p2]
    enabled: false

# Optional, uncomment when connected. Read only: the bot lists each fix and a human makes it, or the
# owner turns writing on later. It never edits a field, a scoring rule or a workflow.
# tools:
#   - service: crm
#     identity: "the team's CRM account"
#     can: [read]
#     env: CRM_API_KEY
#     note: "leads, lifecycle stages, original source and owner; read only"
tools: []
