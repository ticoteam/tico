name: CHANGE-ME              # slug, matches bot-<name> and owner:<name>
display_name: "Change Me"
labels: [owner:CHANGE-ME]
reads: []                    # other bot-* repos to clone read-only
slack_channel: "#agents"
# Runtime and model come from the team's provider choice (Settings > Computers).
# Override here only if this bot needs something different:
# runtime: <runtime>
# model: <model id>
# reasoning_effort: high
# max_run_minutes: 90
# Outbound sends (email, DMs, posts, calendar invites to anyone outside the team) are off
# until an owner sets this true. Drafts go on the task instead.
outbound_send: false
# Routines are rows in Tico, not lines here: `hub routine set <key> --title... --cron...`
# from a run, or the bot's Routines card on the site (docs/routines.md).
# What this bot may touch. Shown in the Tico app. Not listed = not allowed. See Tico policies/access.md.
# tools:
#   - service: gmail
#     identity: "owner@example.com"
#     can: [read, draft]          # send only with outbound_send: true
#     env: GMAIL_CREDENTIALS      # store a Credential and grant it to this bot
# Files: what the runner lists on this bot's page after a completed run (docs/files.md). Default is
# reports/ and artifacts/; `publish: []` turns it off.
# files:
#   publish: [reports/, artifacts/]
tools: []
