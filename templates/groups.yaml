# The groups a team builds its team chart from, in the order setup offers them.
#
# Each template card names its group (`group:` in templates/catalog/<id>/card.yaml), and exactly one card
# per group is its head: the template named in `head:` below, which is `lead: true`. A team's Manager is also
# `lead: true` and does not take the head's seat. The head's card lists the rest of
# the group in `team_templates:`; a card's `suggest:` says whether it is pre-checked (default), offered (common)
# or offered only when the briefing asks for it (niche). `icon` is a Material Symbols name in the font the UI ships
# (ui/vendor/fonts/icons.txt). `software_only: true` groups are offered only when software is the product.
# clients/tests/test_catalog.py checks this file against the cards. docs/starter-bots.md lists every template.

departments:
  - id: sales
    name: Sales
    description: "Finds buyers, works every deal to a signature and keeps existing accounts renewing and growing."
    goal: "Turn interest into revenue"
    question: "What kind of sales do you do today?"
    placeholder: "Outbound to studio owners, a two-call demo, annual contracts; two sellers and a spreadsheet pipeline"
    icon: handshake
    head: growth-manager

  - id: marketing
    name: Marketing
    description: "Makes the right people aware of your team and gives sales a steady flow of interested buyers."
    goal: "Be known by the customers you want"
    question: "How do customers find you today?"
    placeholder: "Mostly word of mouth and search; a monthly newsletter, some paid social, two trade shows a year"
    icon: campaign
    head: growth-manager

  - id: support
    name: Customer Support
    description: "Answers customers quickly and correctly, and keeps them successful after they buy."
    goal: "Every customer helped and kept"
    question: "How do customers reach you for help today, and what do they ask most?"
    placeholder: "A shared support inbox and chat on the site; mostly billing questions, setup help and a few bug reports"
    icon: support_agent
    head: success-manager

  - id: finance
    name: Finance
    description: "Keeps the books current, cash visible and bills paid and collected, with every number ready for a human to check."
    goal: "Know where the money is"
    question: "How do you keep the books and handle bills and invoices today?"
    placeholder: "Online accounting software and an outside accountant; we invoice monthly and chase late payers by hand"
    icon: account_balance
    head: finance-owner

  - id: operations
    name: Operations
    description: "Keeps the team running: vendors, purchases, projects, IT, the office and the checklists nobody should forget."
    goal: "Run smoothly, nothing dropped"
    question: "What keeps the team running day to day that someone has to remember?"
    placeholder: "Vendor renewals, buying laptops, the office lease, weekly project check-ins and our field crew schedule"
    icon: settings_suggest
    head: operations-manager

  - id: legal
    name: Legal
    description: "Reviews contracts, keeps the team's filings and policies current and flags risk early, as summaries for a human and never legal advice."
    goal: "Sign with eyes open"
    question: "What legal work comes up for you today, and who handles it?"
    placeholder: "Customer contracts and NDAs every week, a privacy question now and then; an outside lawyer for anything big"
    icon: gavel
    head: general-counsel

  - id: hr
    name: HR
    description: "Hires the right people, brings them in well and looks after them while they are here."
    goal: "Hire well, keep good people"
    question: "How do you hire and look after your people today?"
    placeholder: "Hiring three engineers this quarter; job posts on our site, a shared handbook, reviews twice a year"
    icon: groups
    head: head-of-people

  - id: product
    name: Product
    description: "Decides what to build next from what customers say and do, and writes it down clearly enough to build."
    goal: "Build what customers need"
    question: "How do you decide what to build next?"
    placeholder: "Feature requests from support and sales, a roadmap in a doc, the founders decide each quarter"
    icon: category
    head: product-lead
    software_only: true

  - id: engineering
    name: Engineering
    description: "Builds, reviews, ships and runs the product's software, with every change reviewed and every incident learned from."
    goal: "Ship reliable software, steadily"
    question: "How does your team build and ship software today?"
    placeholder: "Six engineers on GitHub, pull requests reviewed by one other person, weekly releases, alerts in Slack"
    icon: code
    head: engineering-manager
    software_only: true

  - id: success
    name: Success
    description: "Keeps existing customers renewing and growing: onboarding, account health, renewals and the support queue, reviewed together each week."
    goal: "Customers who renew and grow"
    question: "How do customers get set up and kept after they buy, and who owns renewals and account health today?"
    placeholder: "An onboarding call for each new account, a renewal reminder list in a spreadsheet, support by email; the founder handles the big accounts"
    icon: sentiment_satisfied
    head: success-manager

  - id: corporate
    name: Corporate
    description: "Keeps the company's legal, financial and partnership obligations on time and visible, with a person signing and approving each one."
    goal: "Every deadline kept, every deal read first"
    question: "Which legal, finance and partnership obligations do you carry, and who handles each today?"
    placeholder: "An outside lawyer for contracts, a bookkeeper who files taxes, two reseller agreements and a yearly partner registration"
    icon: contract
    head: corporate-manager

# Not a group the picker offers. The built-in Assistant already covers a human's own brief and messages, so these
# templates are never suggested by default; a team can still add them from a template.
extras:
  - id: leadership
    name: Leadership
    description: "Support for the founders and executives: a weekly brief across the team and the quarterly plan."
    goal: "Keep the leaders focused"
    icon: star
    head: chief-of-staff
