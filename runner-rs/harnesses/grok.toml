# xAI's Grok Build, the official CLI (npm package published by xAI; docs.x.ai/build). Its browser
# device-code login works on a remote computer without a local browser callback.
id = "grok"
name = "Grok Build"
host = "grok"
runtime = "grok"
executable = "grok"
providers = ["xai"]
# Runs on the generic ACP host (runner-rs/src/hosts/acp_host.rs), set up by [acp] below.
protocol = "acp"

[install]
method = "npm"
package = "@xai-official/grok"

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'

[update]
policy = "latest"

[auth]
methods = ["device-code", "subscription", "api-key"]
api_key_env = ["XAI_API_KEY"]

[login]
command = ["login", "--device-auth"]
terminal = false
logout = ["logout"]
files = [".grok/auth.json"]

# `grok agent -m <model> --reasoning-effort <effort> --always-approve --no-leader stdio`, one process per bot.
[acp]
args = ["agent", "-m", "{model}", "--reasoning-effort", "{effort}", "--always-approve", "--no-leader", "stdio"]
label = "grok agent"
default_model = "grok-4.6"
# Grok 4.6's four reasoning levels; any other is high.
efforts = ["low", "medium", "high", "xhigh"]
default_effort = "high"
mcp_servers = "acp"
resume = "load"
# --always-approve: a tool's permission the agent still asks for is given.
permission = "allow"
request_timeout_s = 120
stop_wait_s = 5

# The operator's own MCP servers Grok would pick up from other tools' files (~/.claude.json, ~/.cursor/mcp.json) and
# from the xAI account: off, so a bot gets its declared servers. Grok has no switch for servers in its own
# ~/.grok/config.toml or in plugins; those still load.
[acp.env]
GROK_CLAUDE_MCPS_ENABLED = "false"
GROK_CURSOR_MCPS_ENABLED = "false"
GROK_MANAGED_MCPS_ENABLED = "false"

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
api_key_in_turn = true
terminal_login = ["login"]
subscription_profiles = true
profile_home = "HOME"
profile_home_overrides = ["GROK_HOME", "GROK_AUTH_PATH"]
subscription_marker = "grok account"
weekly_usage = "manual"
mcp_transports = ["http", "sse"]
resume_command = "grok --resume"
model_list = "command"
model_list_args = ["models"]

[capabilities.sign_in_status]
check = "file"
ready_detail = "Signed in with a Grok account"
missing_detail = "Grok sign-in required (sign in from Tico) or XAI_API_KEY"
