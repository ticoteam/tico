# Google's Antigravity CLI (`agy`), signed in with a Google account.
id = "antigravity"
name = "Antigravity"
host = "antigravity"
executable = "agy"
providers = ["google"]

# Google publishes it only through its own updater: a manifest per platform names a build-numbered tarball and its
# sha512. antigravity-install-v1.sh (in this folder, fetched from the main branch at this checksum) checks both and
# installs the CLI as bin/agy. That file is never edited: a change is a new -v2 file, named here with its checksum.
[install]
method = "script"
url = "https://raw.githubusercontent.com/ticoteam/tico/main/runner-rs/harnesses/antigravity-install-v1.sh"
sha256 = "142709241325e666df80c9d342e83aa2500896242f674347ca93c1fd95dfa036"
requires = ["curl", "tar", "mktemp"]
prefix_env = "AGY_PREFIX"
bin = "bin/agy"
latest_url = "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json"
latest_pattern = '"version"\s*:\s*"(\d+\.\d+\.\d+)"'

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'
# The oldest release checked to take its home from `acp --gemini-dir`, keep a sign-in in that home's
# antigravity-cli/antigravity-oauth-token when it sees SSH_CONNECTION, read `acp --login`'s code from its input and
# speak the ACP hosts/antigravity.rs speaks.
minimum = "1.5.15"

[update]
policy = "latest"

[auth]
methods = ["subscription"]

[login]
# Settings > Computers: the computer's own sign-in (on a Mac, in its keychain). It prints a Google link and reads the
# code that page shows.
command = ["acp", "--login", "--app-data-dir", "antigravity-cli"]
terminal = true
paste_code = true
files = ["antigravity-cli/antigravity-oauth-token"]
# Connect (Settings > Providers): the same sign-in in a home of its own ({home}), told it runs over SSH so it writes
# this file there and never the keychain (model_subscriptions.rs TURN_HOMES). It counts once `agy acp` starts a session
# with a model there (login.rs `agy_session`): `agy models` reads only $HOME/.gemini.
connect = ["acp", "--login", "--gemini-dir", "{home}", "--app-data-dir", "antigravity-cli"]
connect_file = "antigravity-cli/antigravity-oauth-token"

# The CLI updates itself on every run unless this is set.
[env]
AGY_CLI_DISABLE_AUTO_UPDATE = "1"

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
# No subscription profiles: a profile's own home would hold no sign-in, and a profile's bots would lose the computer's.
# A plan's sign-in is put in a home of each turn's own instead (model_subscriptions.rs TURN_HOMES).
tool_events = true
mcp_unsupported = "agy takes no http or sse MCP servers over ACP (its initialize offers none), and Tico does not touch the config file in the operator's home (the operator's own servers would reach every bot)"
resume_command = "agy --conversation"

[capabilities.sign_in_status]
check = "command"
args = ["models"]
not_ready = "please sign in"
ready_detail = "Antigravity signed in"
missing_detail = "Antigravity sign-in required"
timeout_s = 10
