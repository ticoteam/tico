# Files and names scripts/cleanup/rename.py leaves alone; --check ignores them too.
# files: globs of files that are not about the hub database (their own SQLite files, other systems' fields).
# names: {glob: [old names]} where a name only looks like a renamed column.
# keys: {glob: [old names]} kept as Python keys and values (another system's field); SQL in the file is renamed.
files:
  - connectors/mail/*            # the mail connector's own mail.db (connectors/mail/db.py), not hub tables
  - connectors/mail/**
  - backend/migrations/renames.py     # the rename machinery itself names the old columns
  - backend/migrations/renames_data.py
  - backend/tests/test_schema_renames.py
  - backend/tests/test_task_delete.py   # trash snapshots saved before the renames, under the old names
  - backend/tests/test_stored_document_keys.py  # documents as an existing install holds them
  - backend/tests/fixtures/*
  - backend/tests/fixtures/**
  - docs/history/*               # how the schema looked then
  - contracts/runner/*            # the runner wire does not change: the server maps old wire names at the boundary
  - contracts/runner/**
  - runner-rs/*                   # the Rust runner reads and sends the wire names (contracts/runner)
  - runner-rs/**
  - runner/worktrees.py           # reads runners/me/worktrees rows, which keep the wire's detail_json
  # Wave 2 on: the Python runner's side of the wire and its own state file keep their names (started, updated...).
  - runner/*.py
  - runner/importers/**
  - runner/harnesses/**
  - runner/tests/conformance/**  # fake harnesses speaking the runner's side
  - runner/tests/test_hq_tickets.py             # a fake Tico HQ: another system's ticket fields
  - backend/runner_wire.py        # puts the runner wire's old names back on runner bodies
  - backend/tests/test_runner_wire_names.py
  - backend/migrations/0*         # applied migration files are history: they ran on the shape of their day
  - CHANGELOG.md
names:
  clients/*.py: [body_json]       # hub_goal_save's exact method/path/body_json step, not a column
  clients/tests/*.py: [body_json]
  backend/tests/test_hubdb.py: [payload_json]   # the documents table as it was before 0008 dropped it
  ui/app/router.js: [finished]          # a view transition's own `finished` promise
  ui/app/live.js: [started]             # the live connection's started flag
  ui/app/task-board.js: [finished]      # the board's folded-column choices
  ui/app/task-pipelines.js: [finished]
  ui/tests/task-pipelines.cjs: [finished]   # the board's folded-column choices, as stored
  ui/tests/bot-pause-strip.cjs: [finished]  # a held request's own finished promise
  ui/app/settings-billing.js: [expires]   # Tico HQ's billing credits (backend/company_billing.py), another system's fields
  ui/tests/settings-billing.cjs: [expires]
  ui/app/meetings-granola.js: [last_sync]   # Granola's sync status: a stored document's field, not a column
  ui/tests/meetings-granola.cjs: [last_sync]
keys:
  backend/strategy_setup.py: [started, finished]
  clients/hubtools.py: [owner, requester, due, from_actor, at]   # a tool's input takes a name or an id
  clients/remotecli.py: [owner, due]
  ui/app/org-rules.js: [owner, due, replaced_by]   # a rule's due dates and their form
  ui/app/settings-people.js: [owner]   # a person's owner flag, the access view's owner
  ui/app/finance-*.js: [owner, due]   # finance documents, budgets, capabilities
  ui/app/integrations.js: [owner]   # a tool's owner
  # meetings.owner, recorded_by and uploaded_by hold emails or runner ids (the columns and the metadata keep them).
  backend/meetings.py: [owner, recorded_by, uploaded_by]
  backend/meeting_review.py: [owner]
  backend/meetings_schema.py: [owner, recorded_by, uploaded_by]
  backend/imports.py: [owner, recorded_by, uploaded_by]
  ui/app/meetings.js: [owner, due, recorded_by, uploaded_by]
  backend/company_file/*.py: [dept, owner]   # the company file's draft, a stored document
  backend/sample_company.py: [dept, owner]
  backend/tests/test_company_file.py: [dept, owner, due]
  backend/tests/test_company_import.py: [dept, owner]   # the jobs saved in registry_metadata (strategy.draft_from)
  runner/tests/test_worktree*.py: [detail_json, created, updated]   # fake runners/me/worktrees rows (the wire); their hub SQL is renamed
  backend/company_billing.py: [created, expires]   # Tico HQ's billing answer: another system's fields
  backend/tests/test_company_billing.py: [created, expires]
  backend/granola_mcp.py: [last_sync]   # Granola's stored sync status (a JSON document) and its answer
  backend/demo.py: [last_sync]
  backend/tests/test_granola_*.py: [last_sync]
  backend/finance/core/feeds.py: [created]   # a Stripe balance transaction's own `created` (epoch seconds)
  backend/tests/test_finance_stripe.py: [created]   # the fake Stripe API's balance transactions
  evals/botops_automations/*.py: [created]           # the eval's saved answers: {"created": [automation, ...]}
  backend/tests/test_botops_automations_evals.py: [created]
# Request models a runner (or another separately updated client) sends: their fields keep the wire names.
wire_models:
  - WatcherReport      # POST /api/v2/runners/watchers (runner-rs watchers.rs)
  - ImportCreate       # POST /api/v2/imports/transcripts (runner/close_calls.py)
  - TranscriptImport
# API paths a runner sends bodies to: a dict literal posted to one (in tests too) keeps its keys.
wire_paths:
  - '(^|/api/v2/)(runners/|runner-|jobs/|attempts/|imports/)'
# sites: {glob: [line texts]}: a line holding one of these keeps every name on it (wave 2's hand-checked flags, counts,
