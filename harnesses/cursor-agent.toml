# Cursor's agent CLI (cursor.com/docs/cli). Its only official install is a script that installs under
# $HOME, so the runner runs it with HOME set to a fresh directory inside its tools directory. The
# script always installs the newest release, so this harness cannot be pinned to an older version.
id = "cursor-agent"
name = "Cursor Agent"
host = "cursor"
runtime = "cursor"
executable = "cursor-agent"
providers = ["cursor"]

[install]
method = "script"
url = "https://cursor.com/install"
shell = "bash"
requires = ["curl", "tar"]
prefix_env = "HOME"
bin = ".local/bin/cursor-agent"
latest_url = "https://cursor.com/install"
latest_pattern = 'lab/([0-9]{4}\.[0-9.]+-[0-9a-f]+)/'

[version]
args = ["--version"]
pattern = '(\d{4}\.\d{2}\.\d{2}-[0-9a-f]+)'

[update]
policy = "latest"

[auth]
methods = ["subscription", "api-key"]
api_key_env = ["CURSOR_API_KEY"]

[login]
command = ["login"]
terminal = false
logout = ["logout"]
# File storage uses ~/.config/cursor on Linux and ~/.cursor on macOS.
files = [".config/cursor/auth.json", ".cursor/auth.json"]

# File credentials let the computer default home and a switch keep their own login on macOS too.
[env]
AGENT_CLI_CREDENTIAL_STORE = "file"
NO_OPEN_BROWSER = "1"

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
terminal_login = ["login"]
api_keys = "computer"
api_key_in_turn = true
subscription_marker = "signed in"
profile_home = "HOME"
profile_home_overrides = ["XDG_CONFIG_HOME", "CURSOR_CONFIG_DIR", "CURSOR_DATA_DIR"]
mcp_unsupported = "cursor-agent reads MCP servers only from ~/.cursor/mcp.json or the bot's .cursor/mcp.json, with no per-run setting, so a bot would also get the operator's own servers"
resume_command = "cursor-agent --resume"
model_list = "host"

[capabilities.sign_in_status]
check = "command"
args = ["status"]
ready = "logged in"
not_ready = "not logged in"
ready_detail = "Signed in to Cursor"
missing_detail = "Cursor login required (cursor-agent login) or CURSOR_API_KEY"
timeout_s = 15
