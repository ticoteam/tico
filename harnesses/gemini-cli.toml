# Google Gemini CLI, with a Gemini API key.
id = "gemini-cli"
name = "Gemini CLI"
host = "gemini"
runtime = "gemini"
executable = "gemini"
providers = ["google"]

[install]
method = "npm"
package = "@google/gemini-cli"

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'

[update]
policy = "latest"

[auth]
methods = ["api-key"]
api_key_env = ["GEMINI_API_KEY", "GOOGLE_API_KEY"]

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
api_keys = "bot"
subscription_profiles = true
weekly_usage = "manual"
tool_events = true
mcp_transports = ["http", "sse"]
resume_command = "gemini --resume"
model_list = "host"

[capabilities.sign_in_status]
check = "bot-key"

# Google's Antigravity (`agy`) runs the Gemini bots whose harness is `antigravity`. The operator installs and signs
# it in; the runner never installs or updates it.
[variants.antigravity]
name = "Antigravity"
host = "antigravity"
executable = "agy"

[variants.antigravity.capabilities]
tool_events = true
persistent_session = true
readiness = false
mcp_unsupported = "it reads MCP servers only from a config file in the operator's home, which Tico does not touch (the operator's own servers would reach every bot)"
resume_command = "antigravity --resume"

[variants.antigravity.capabilities.sign_in_status]
check = "none"
