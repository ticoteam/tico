# Meta's Muse Code CLI (dev.meta.ai). Its only install is a script that puts a launcher in
# $MUSE_INSTALL_DIR (default ~/.local/bin), which downloads the ~340 MB binary beside itself. The
# runner runs it with HOME set to a fresh directory inside its tools directory, so the script's PATH
# edits land there and not in anyone's shell profile. The script always installs the newest release,
# so this harness cannot be pinned to an older version. The channel file names the newest release.
id = "muse-code"
name = "Muse Code"
host = "musecode"
runtime = "musecode"
executable = "muse"
providers = ["meta"]

[install]
method = "script"
url = "https://dev.meta.ai/install.sh"
shell = "bash"
requires = ["curl", "mktemp"]
prefix_env = "HOME"
bin = ".local/bin/muse"
latest_url = "https://api.meta.ai/muse-code/channels/muse-stable"
latest_pattern = '"version"\s*:\s*"(\d+\.\d+\.\d+)'

[version]
args = ["--version"]
pattern = '(\d+\.\d+\.\d+)'

[update]
policy = "latest"

[auth]
methods = ["device-code", "subscription", "api-key"]
api_key_env = ["META_API_KEY"]

[login]
command = ["login"]
terminal = true
logout = ["logout"]
files = ["muse/auth.json"]

# The launcher updates itself on every run unless this is set; the runner updates the harness itself.
# The file credential backend keeps each login whole in its own config folder's muse/auth.json. Without it, Muse on macOS
# keeps the token in the login Keychain, outside the files a switch moves into place or a cancel keeps, so neither could
# replace or keep a login as one change.
[env]
MUSE_NO_AUTO_UPDATE = "1"
TBH_CREDENTIAL_BACKEND = "file"

# What Tico does differently for this CLI (docs/harnesses.md, Capabilities).
[capabilities]
terminal_login = ["login"]
api_keys = "computer"
api_key_in_turn = true
subscription_marker = "meta account"
subscription_profiles = true
profile_home = "XDG_CONFIG_HOME"
# Muse loads every server in its own settings and cannot switch them off per run, so bot runs use Tico's own folder.
own_config_home = true
mcp_transports = ["http"]
resume_command = "muse resume"
model_list = "host"

# Muse has no status command: check its saved Meta credential in the config folder.
[capabilities.sign_in_status]
check = "file"
ready_detail = "Signed in with a Meta account"
missing_detail = "Muse sign-in required (sign in from Tico) or META_API_KEY"
