[package]
name = "tico-app"
version = "0.3.6"
edition = "2021"
description = "Tico: one window on the hub and a tray item with its status"
default-run = "tico-app"

[[bin]]
name = "tico-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keep this alias aligned with tauri-plugin-updater's reqwest 0.13 ClientBuilder hook.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
url = "2"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
minisign = "0.10"
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
# GTK 0.18 requires this API series; upstream VariantStrIter fix and provenance are in vendor/README.md.
glib = { path = "vendor/glib", version = "=0.18.5" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
