[package]
name = "tico-app"
version = "0.3.6"
edition = "2021"
description = "Tico: one window on the hub, with its Needs you count on the Dock icon"
default-run = "tico-app"

[[bin]]
name = "tico-app"
path = "src/main.rs"

[features]
# The web inspector on org pages in a release build (`cargo build --features devtools`); debug builds always have it.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keep this alias aligned with tauri-plugin-updater's reqwest 0.13 ClientBuilder hook.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
log = { version = "0.4", features = ["std"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

# The badge reads the page's cookies, and Tico sign-in copies its session into new orgs' stores, through WebKit's own
# callbacks, so the main thread never waits for them (see src/cookies.rs, src/signin.rs). The same versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSHTTPCookie", "NSString", "NSUUID"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }

[dev-dependencies]
base64 = "0.22"
minisign = "0.10"
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
# GTK 0.18 requires this API series; upstream VariantStrIter fix and provenance are in vendor/README.md.
glib = { path = "vendor/glib", version = "=0.18.5" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
