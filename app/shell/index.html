<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src ipc: http://ipc.localhost">
  <title>Tico</title>
  <link rel="stylesheet" href="setup.css">
  <script src="setup.js" defer></script>
</head>
<body>
  <main>
    <svg class="mark" viewBox="15 13 34 38" width="40" height="44" role="img" aria-label="Tico">
      <path fill="#56a578" d="M29.9 15A17.1 13.2 0 0 1 47 28.2A16.5 16.8 0 0 1 30.5 45A13.5 18.6 0 0 1 17 26.4A12.9 11.4 0 0 1 29.9 15Z"/>
    </svg>
    <h1 id="heading" hidden>Add organization</h1>
    <div id="signin" hidden>
      <button type="button" id="signin-button">Sign in to Tico</button>
      <p id="signin-error" class="error" role="alert" aria-live="polite"></p>
      <button type="button" id="use-address" class="link">Use a server address</button>
    </div>
    <form hidden>
      <label for="address">Server</label>
      <input id="address" name="address" type="url" placeholder="https://tico.example.com" autocomplete="url" spellcheck="false" required>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Connect</button>
    </form>
    <button type="button" id="cancel" class="quiet" hidden>Cancel</button>
  </main>
</body>
</html>
